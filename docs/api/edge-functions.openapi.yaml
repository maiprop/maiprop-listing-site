        do not establish deployment or provider availability.

  /create-checkout:
    post:
      operationId: createCheckout
      summary: Create a Stripe Checkout session for subscription upgrade
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Subscription uses plan; add-on branch uses addon_key. Product/price authority is resolved
                server-side, not supplied price_id.
              anyOf:
                - required:
                    - plan
                - required:
                    - addon_key
              properties:
                plan:
                  type: string
                billing_cycle:
                  type: string
                  enum:
                    - monthly
                    - annual
                success_url:
                  type: string
                cancel_url:
                  type: string
                trial:
                  type: boolean
                addon_key:
                  type: string
                target_type:
                  type: string
                target_id:
                  type: string
                quantity:
                  type: integer
            example:
              plan: pro
              billing_cycle: monthly
              success_url: /dashboard
              cancel_url: /pricing
      responses:
        '200':
          description: Successful result; shape depends on the documented operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                url: https://checkout.stripe.com/c/pay/cs_test_synthetic
                session_id: cs_test_synthetic
                checkout_type: subscription
                mode: test
      description: >-
        Create an eligible subscription Checkout session using a server-resolved plan. Add-ons, trials and
        existing subscriptions have separate response branches. Redirect only to the returned URL; this is not
        payment confirmation. Source limiter: 10 requests / minute per verified user. Examples are synthetic and
        do not establish deployment or provider availability.

  /check-subscription:
    get:
      operationId: checkSubscription
      summary: Returns the authenticated user's current subscription state
      description: An ordinary empty refresh. A synced entitlement is not proof of a new Checkout session.
      security:
        - SupabaseJWT: []
      responses:
        '200':
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
    post:
      operationId: reconcileCheckoutSubscription
      summary: Refresh subscription state and optionally reconcile one exact Checkout session
      description: >-
        Refresh durable subscription state with no body or {}. Optional checkout_session_id requests
        exact-session reconciliation; only a matching verified_checkout receipt confirms that session. A pending
        reconciliation may return 202. Source limiter: 30 requests / minute per IP; limiter outage is logged and
        allowed. Examples are synthetic and do not establish deployment or provider availability.
      security:
        - SupabaseJWT: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checkout_session_id:
                  type: string
                  pattern: ^cs_(test|live)_[A-Za-z0-9_]+$
            example: {}
      responses:
        '200':
          description: Current state; exact Checkout is confirmed only when verified_checkout is present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
              example:
                subscribed: true
                product_id: prod_synthetic
                subscription_end: '2026-10-27T00:00:00Z'
                source: billing_state
                plan_key: pro
                audience: participant
                billing_cycle: monthly
                status: active
                sync_status: synced
        '202':
          description: Checkout reconciliation remains pending or cannot yet be durably verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customer-portal:
    post:
      operationId: customerPortal
      summary: Create a Stripe Customer Portal session for billing management
      security: [{ SupabaseJWT: [] }]
      responses:
        '200':
          description: Portal URL
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string, format: uri } } }

  /apply-data-input-credit:
    post:
      operationId: applyDataInputCredit
      summary: |
        (Admin) Convert a verified agent_data_inputs row into a Stripe customer
        balance credit applied to the agent's next invoice. Idempotent on
        stripe_credit_id.
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_input_id]
              properties:
                data_input_id: { type: string, format: uuid }
      responses:
        '200':
          description: Credit applied (or already applied)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  idempotent: { type: boolean }
                  stripe_credit_id: { type: string, nullable: true }
                  amount_cents: { type: integer, nullable: true }
                  currency: { type: string, nullable: true }
                  reason: { type: string, nullable: true }
        '403':
          description: Caller is not a platform admin
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Data input or Stripe customer not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Row is not in 'verified' status
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Agent missing email or active subscription
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /get-invoices:
    get:
      operationId: getInvoices
      summary: Paginated list of Stripe invoices for the current user
      security: [{ SupabaseJWT: [] }]
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { type: object } }

  /agent-data-input:
    post:
      operationId: agentDataInput
      summary: |
        Agent "Data Input" feature. Action-based router for the agent dashboard
        — agents submit their closings (sale/rental deals) in exchange for a
        0.5%-per-verified-entry discount on their next subscription invoice
        (capped at 20 entries per calendar month = up to 10% off). Hallucinated
        submissions trigger a permanent (lifetime) ban via admin review.
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, enum: [status, list] }
                - type: object
                  required: [action, payload]
                  properties:
                    action: { type: string, enum: [submit] }
                    payload:
                      type: object
                      required: [property_address, property_type, transaction_type, agent_side, sale_price, closing_date]
                      properties:
                        property_address: { type: string, minLength: 5, maxLength: 300 }
                        city:             { type: string, nullable: true }
                        postal_code:      { type: string, nullable: true }
                        kaek:             { type: string, nullable: true }
                        property_type:    { type: string, enum: [apartment, house, commercial, land, other] }
                        transaction_type: { type: string, enum: [sale, rental] }
                        agent_side:       { type: string, enum: [buyer, seller, both] }
                        sale_price:       { type: number, exclusiveMinimum: 0 }
                        closing_date:     { type: string, format: date }
                        buyer_name:       { type: string, nullable: true }
                        seller_name:      { type: string, nullable: true }
                        notes:            { type: string, nullable: true, maxLength: 2000 }
                - type: object
                  required: [action, input_id, decision]
                  properties:
                    action:        { type: string, enum: [admin_review] }
                    input_id:      { type: string, format: uuid }
                    decision:      { type: string, enum: [verified, rejected, flagged, pending] }
                    reason:        { type: string, nullable: true }
                    lifetime_ban:  { type: boolean, default: false }
      responses:
        '200':
          description: |
            For action=status/list — counters + entries; for action=submit — created entry; for action=admin_review — updated entry.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Validation error,            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthenticated,             content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden / lifetime banned, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Monthly limit reached,       content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /create-stripe-price:
    post:
      operationId: createStripePrice
      summary: (Admin) create a new Stripe Price object
