                        distanceKm: { type: number, minimum: 0, maximum: 5 }
                        walkMinutes: { type: integer, minimum: 0, maximum: 120 }
                        description: { type: string }
        '503':
          description: Nearby-place evidence is unavailable or the requested response version is unsupported

  /smart-filters:
    post:
      operationId: smartFilters
      summary: Suggest search filter sections and feature labels
      description: >-
        Send POST JSON, not GET query parameters. Requires a signed-in actor and atomic AI quota
        reservation before provider work. Source limiter is 20 requests/minute per IP (actor fallback).
        Optional subtype must belong to the selected type; canonical source mapping is
        PROPERTY_SUBTYPES_BY_TYPE in smart-filters/index.ts. Model suggestions are allowlisted and do not
        retrieve properties or prove property features.
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - apartment
                    - house
                    - villa
                    - land
                    - commercial
                    - office
                    - studio
                    - maisonette
                    - warehouse
                    - hotel
                    - mixed_use
                    - parking
                    - storage
                subtype:
                  type:
                    - string
                    - 'null'
                  description: >-
                    Must be a member of the selected type’s source subtype mapping; omit or use null
                    otherwise.
                listing_type:
                  type:
                    - string
                    - 'null'
                  enum:
                    - sale
                    - rent
                    - auction
                    - firesale
                    - open_house
                    - new_build
                    - null
            example:
              type: apartment
              subtype: studio
              listing_type: sale
      responses:
        '200':
          description: Synthetic successful source-contract example
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - sections
                  - features
                  - sizeLabel
                  - priceLabel
                  - bedsLabel
                  - featuresLabel
                properties:
                  sections:
                    type: array
                    minItems: 1
                    maxItems: 24
                    items:
                      type: string
                      enum:
                        - size
                        - bedrooms
                        - bathrooms
                        - floor
                        - year_built
                        - heating
                        - energy_class
                        - construction_status
                        - land_details
                        - rental_extras
                        - commercial_details
                  features:
                    type: array
                    maxItems: 24
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - key
                        - label
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                  sizeLabel:
                    type: string
                  priceLabel:
                    type: string
                  bedsLabel:
                    type:
                      - string
                      - 'null'
                  featuresLabel:
                    type: string
              example:
                sections:
                  - size
                  - bedrooms
                features:
                  - key: has_balcony
                    label: Balcony
                sizeLabel: Size (m²)
                priceLabel: Asking Price
                bedsLabel: Bedrooms
                featuresLabel: Features
        '400':
          description: Invalid request
        '401':
          description: Authentication required for the authenticated operation
        '429':
          description: Rate or monthly quota limit reached
        '503':
          description: Required service unavailable

  /property-chat:
    post:
      operationId: propertyChat
      summary: Chat with the AI about a specific listing (authenticated)
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messages
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                      content:
                        type: string
                        minLength: 1
                        maxLength: 8000
                propertyContext:
                  type: object
                  description: >-
                    Optional supplied property facts. Supported keys are defined by propertyContextSchema in the
                    source handler; coordinates must be paired.
                  properties:
                    city:
                      type: string
                    title:
                      type: string
                    sqm:
                      type: number
                    price:
                      type: number
                    latitude:
                      type: number
                    longitude:
                      type: number
            example:
              messages:
                - role: user
                  content: Which property details should I confirm?
              propertyContext:
                city: Athens
                sqm: 80
      responses:
        '200':
          description: Assistant text stream (errors use JSON)
          content:
            text/event-stream:
              schema:
                type: string
              example: >+
                data: {"choices":[{"delta":{"content":"Confirm the property details with the responsible
                professional."}}]}


                data: [DONE]

      description: >-
        Ask about supplied property context. This endpoint does not upload documents. Success streams
        text/event-stream; errors are JSON. Answers are model-generated and require verification. Source
        limiter: 20 requests / minute per IP (actor fallback); monthly actor quota. Examples are synthetic and
        do not establish deployment or provider availability.

  /pro-ai-tools:
