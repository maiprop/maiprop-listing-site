  /ai-translate:
    post:
      operationId: aiTranslate
      summary: Translate a flat keyed string dictionary
      description: >-
        POST only. AI target locales require a verified signed-in actor, 10 requests/minute per user and an
        atomic ai-translate quota reservation before provider work. Exception: static locales en and el
        return the supplied locale/strings unchanged before authentication, rate limiting or quota; this is
        pass-through, not translation. The security scheme describes AI translation. Strict JSON accepts
        only locale and strings. Keys cannot have leading/trailing whitespace; the pretty-printed strings
        object is limited to 200000 characters, request body to 192 KiB, each string to the source
        provider-output budget, and the payload to 64 provider chunks. Source validates complete translated
        key identity; success is not a guarantee of linguistic accuracy. No anonymous AI-generation
        contract is offered.
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - locale
                - strings
              properties:
                locale:
                  type: string
                  enum:
                    - en
                    - el
                    - fr
                    - de
                    - ar
                    - zh
                    - ru
                    - tr
                    - it
                    - es
                    - pt
                    - nl
                    - pl
                    - ro
                    - bg
                    - cs
                    - hu
                    - sk
                    - hr
                    - sr
                    - uk
                    - he
                    - ja
                    - ko
                strings:
                  type: object
                  minProperties: 1
                  maxProperties: 2500
                  propertyNames:
                    type: string
                    minLength: 1
                    maxLength: 200
                  additionalProperties:
                    type: string
                    maxLength: 10000
            examples:
              ai:
                summary: Authenticated AI translation
                value:
                  locale: fr
                  strings:
                    nav.listings: Listings
              static:
                summary: Unauthenticated static pass-through; unchanged output
                value:
                  locale: en
                  strings:
                    nav.listings: Listings
      responses:
        '200':
          description: Synthetic successful source-contract example
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - locale
                  - strings
                properties:
                  locale:
                    type: string
                    enum:
                      - en
                      - el
                      - fr
                      - de
                      - ar
                      - zh
                      - ru
                      - tr
                      - it
                      - es
                      - pt
                      - nl
                      - pl
                      - ro
                      - bg
                      - cs
                      - hu
                      - sk
                      - hr
                      - sr
                      - uk
                      - he
                      - ja
                      - ko
                  strings:
                    type: object
                    additionalProperties:
                      type: string
              examples:
                ai:
                  value:
                    locale: fr
                    strings:
                      nav.listings: Annonces
                static:
                  value:
                    locale: en
                    strings:
                      nav.listings: Listings
        '400':
          description: Invalid request
        '401':
          description: Authentication required for the authenticated operation
        '405':
          description: Only POST is supported (apart from CORS preflight)
        '429':
          description: Rate or monthly quota limit reached
        '502':
          description: Provider translation/key validation failed
        '503':
          description: Required service unavailable
        '504':
          description: Translation deadline exceeded

  /listing-ai-assist:
