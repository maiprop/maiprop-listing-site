openapi: 3.1.0
info:
  title: mAI prop Supabase Edge Functions
  description: |
    HTTP endpoints exposed by Supabase Edge Functions for the mAI prop platform.
    Supabase functions run on Deno; the separately identified website catalogue route overrides the server base. Supabase paths use
    `https://<project>.supabase.co/functions/v1/<name>`.

    This is a source contract, not proof of current hosted parity.

    Auth model:
    - `verify_jwt = true`: requires Supabase session JWT in `Authorization: Bearer <token>`.
    - `verify_jwt = false`: public or custom-auth (HMAC, webhook signatures, etc.).
  version: 1.0.0
  contact:
    name: mAI prop Engineering

servers:
  - url: https://qvvicunqcrwpioqnvzxf.supabase.co/functions/v1
    description: Production

components:
  securitySchemes:
    SupabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user session JWT
    CronBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: CRON_SECRET supplied as an Authorization Bearer credential
    CronSecretHeader:
      type: apiKey
      in: header
      name: x-cron-secret
      description: CRON_SECRET supplied by the internal scheduler
    HMACSignature:
      type: apiKey
      in: header
      name: X-Maiprop-Signature
      description: HMAC-SHA256 signature (format `t=<ts>,v1=<hex>`) over raw request body
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe webhook signature

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code when the endpoint uses the shared standard error envelope.
        issues:
          type: array
          description: Field-level validation details when request schema validation fails.
          items:
            type: object
            required: [message]
            properties:
              code:
                type: string
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string

    SubscriptionCheckoutReceipt:
      oneOf:
        - type: object
          additionalProperties: false
          required: [checkout_session_id, user_id, kind, product_id, plan_key, audience, status, subscription_end]
          properties:
            checkout_session_id: { type: string, pattern: '^cs_(test|live)_[A-Za-z0-9_]+$' }
            user_id: { type: string, format: uuid }
            kind: { type: string, const: subscription }
            product_id: { type: string }
            plan_key: { type: string }
            audience: { type: string }
            status: { type: string, enum: [active, trialing] }
            subscription_end: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [checkout_session_id, user_id, kind, addon_key, audience, quantity]
          properties:
            checkout_session_id: { type: string, pattern: '^cs_(test|live)_[A-Za-z0-9_]+$' }
            user_id: { type: string, format: uuid }
            kind: { type: string, const: addon }
            addon_key: { type: string }
            audience: { type: string }
            quantity: { type: integer, minimum: 1 }

    SubscriptionCheckState:
      type: object
      required:
        - subscribed
        - product_id
        - subscription_end
        - sync_status
      properties:
        subscribed:
          type: boolean
        product_id:
          type:
            - string
            - 'null'
        plan_key:
          type:
            - string
            - 'null'
        audience:
          type:
            - string
            - 'null'
        billing_cycle:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
        subscription_end:
          type:
            - string
            - 'null'
          format: date-time
        source:
          type: string
          enum:
            - billing_state
            - investor
            - database
            - stripe
            - reconciliation
            - deadline
        sync_status:
          type: string
          enum:
            - synced
            - pending
            - timeout
        verified_checkout:
          description: >-
            Present only after this exact Checkout session is verified against its durable subscription or add-on
            record.
          $ref: '#/components/schemas/SubscriptionCheckoutReceipt'

    FullSyncFromOsRequest:
      type: object
      additionalProperties: false
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        size: { type: integer, minimum: 1, maximum: 500 }
        maxPages: { type: integer, minimum: 1, maximum: 500 }
        startPage: { type: integer, minimum: 0, maximum: 100000 }
        replaceAll: { type: boolean }
        replace_all: { type: boolean }
        auctionDateFrom: { type: string, format: date }
        auctionDateTo: { type: string, format: date }
        propertyCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [RESIDENCE, OTHER_BUSINESS_SPACE, STORE, OFFICE, PARKING, STOREROOM, INDUSTRIAL, LAND, LAND_WITH_BUILDING, PLOT, PLOT_WITH_BUILDING, HOTEL]
        prefectureId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        propertyMunicipalityId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        auctionStatuses:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [POSTED, OPEN, READY_TO_CONDUCT, CANCELED, COMPLETED, COMPLETED_NO_BIDDERS, FINALIZED_PARTICIPANT_LIST, SUSPENDED]

    PollOsAuctionsRequest:
      type: object
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 0, maximum: 100000 }
        pageSize: { type: integer, minimum: 1, maximum: 600 }
        size: { type: integer, minimum: 1, maximum: 600 }
        sampleAcrossGreece: { type: boolean }
        source: { type: string, enum: [daily-canonical-pool] }
        auctionDateFrom: { type: string, format: date }
        auctionDateTo: { type: string, format: date }
        propertyCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [RESIDENCE, OTHER_BUSINESS_SPACE, STORE, OFFICE, PARKING, STOREROOM, INDUSTRIAL, LAND, LAND_WITH_BUILDING, PLOT, PLOT_WITH_BUILDING, HOTEL]
        prefectureId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        propertyMunicipalityId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        auctionStatuses:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [POSTED, OPEN, READY_TO_CONDUCT, CANCELED, COMPLETED, COMPLETED_NO_BIDDERS, FINALIZED_PARTICIPANT_LIST, SUSPENDED]
        auctionAmountFrom: { type: number, minimum: 0, maximum: 1000000000000 }
        auctionAmountTo: { type: number, minimum: 0, maximum: 1000000000000 }
        boundingBox:
          type: object
          additionalProperties: false
          required: [north, south, east, west]
          properties:
            north: { type: number, minimum: -90, maximum: 90 }
            south: { type: number, minimum: -90, maximum: 90 }
            east: { type: number, minimum: -180, maximum: 180 }
            west: { type: number, minimum: -180, maximum: 180 }
        sortBy:
          type: string
          enum: [AUCTION_ID, AUCTION_DATE, AUCTION_FIRST_PRICE_OFFER, AUCTION_REGISTRATION_AMOUNT, AUCTION_DATE_QUARTER]
        order: { type: string, enum: [ASC, DESC] }

    FetchReportFromOsRequest:
      type: object
      additionalProperties: false
      required: [listing_id, report_type]
      properties:
        listing_id: { type: string, format: uuid }
        report_type: { type: string, enum: [valuation, neighbourhood] }
        lang: { type: string, enum: [en, el], default: en }
        since: { type: string, format: date }
        to: { type: string, format: date }
        listing:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, format: uuid }
            address: { type: [string, 'null'], maxLength: 500 }
            city: { type: [string, 'null'], maxLength: 200 }
            latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
            longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
            sqm: { type: [number, 'null'], minimum: 0, maximum: 10000000 }
            property_type: { type: [string, 'null'], maxLength: 100 }
            floor: { type: [integer, 'null'], minimum: -20, maximum: 300 }
            year_built: { type: [integer, 'null'], minimum: 1000, maximum: 2200 }

    LogRoleSwitchRequest:
      type: object
      additionalProperties: false
      required: [operation_id, from_type, cancel_subscription]
      properties:
        operation_id: { type: string, format: uuid }
        from_type:
          { type: string, enum: [buyer, seller, agent, developer, professional, investor, institutional] }
        to_type:
          { type: string, enum: ['', buyer, seller, agent, developer, professional, investor, institutional], default: '' }
        cancel_subscription: { type: boolean, enum: [true] }

    BeginRoleSwitchRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [audit_id]
          properties:
            audit_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [validate_only]
          properties:
            validate_only: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [validateOnly]
          properties:
            validateOnly: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [dry_run]
          properties:
            dry_run: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [dryRun]
          properties:
            dryRun: { type: boolean, enum: [true] }

    HealthzResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]
          description: Per-subsystem check results (database, env_vars, openai, stripe, sentry, brevo)
        timestamp:
          type: string
          format: date-time

    AISearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false

    AISearchResponse:
      type: object
      properties:
        city:
          type:
            - string
            - 'null'
        listing_type:
          type:
            - string
            - 'null'
          enum:
            - sale
            - rent
            - auction
            - null
        property_type:
          type:
            - string
            - 'null'
        price_min:
          type:
            - number
            - 'null'
        price_max:
          type:
            - number
            - 'null'
        beds_min:
          type:
            - integer
            - 'null'
        sqm_min:
          type:
            - integer
            - 'null'
        summary:
          type: string
        beds_max:
          type:
            - integer
            - 'null'
        sqm_max:
          type:
            - integer
            - 'null'
        features:
          type: array
          items:
            type: string
        energy:
          type: array
          items:
            type: string
        heating:
          type:
            - string
            - 'null'
          enum:
            - autonomous
            - central
            - floor
            - none
            - null

    PropertyValuationRequest:
      type: object
      required:
        - responseVersion
        - city
        - price
        - sqm
      properties:
        responseVersion:
          type: integer
          enum:
            - 2
        title:
          type:
            - string
            - 'null'
        city:
          type: string
        address:
          type:
            - string
            - 'null'
        price:
          type: number
        sqm:
          type: number
        bedrooms:
          type:
            - integer
            - 'null'
        bathrooms:
          type:
            - integer
            - 'null'
        propertyType:
          type:
            - string
            - 'null'
        listingType:
          type:
            - string
            - 'null'
        yearBuilt:
          type:
            - integer
            - 'null'
        energyClass:
          type:
            - string
            - 'null'
        floor:
          type:
            - integer
            - 'null'
        pricePerSqm:
          type:
            - number
            - 'null'

    PropertyValuationResponse:
      type: object
      required:
        - responseVersion
        - status
        - transaction
        - valueUnit
        - estimateBasis
        - providerPrediction
        - estimatedValue
        - auctionAdjustedValue
        - rangeLow
        - rangeHigh
        - rangeBasis
        - executionValue
        - pricePerSqmEstimate
        - rentalYieldEstimate
        - objectiveValueProxy
        - confidence
        - confidenceLabel
        - liquidityScore
        - legalCleanliness
        - planningCertainty
        - taxFriction
        - transferReadiness
        - listingQualityScore
        - marketComparison
        - marketComparisonPct
        - pricingPosition
        - summary
        - legalSummary
        - taxSummary
        - renovationPotential
        - highestBestUseHint
        - keyFactors
        - redFlags
        - methodUsed
        - evidence
      properties:
        responseVersion:
          type: integer
          enum:
            - 2
        status:
          type: string
          enum:
            - available
            - partial
        transaction:
          type: string
          enum:
            - sale
            - rent
            - auction
        valueUnit:
          type: string
          enum:
            - EUR
            - EUR/month
        estimateBasis:
          type: string
          enum:
            - market_value
            - monthly_rent
            - auction_value
            - os_auction_model
        providerPrediction:
          type:
            - object
            - 'null'
          required:
            - value
            - field
            - model
            - unit
          properties:
            value:
              type: number
            field:
              type: string
              enum:
                - propertyPredictedPrice
                - propertyPredictedLeasePrice
            model:
              type: string
              enum:
                - market
                - auction
            unit:
              type:
                - string
                - 'null'
              enum:
                - EUR
                - EUR/month
                - null
        estimatedValue:
          type:
            - number
            - 'null'
        auctionAdjustedValue:
          type:
            - number
            - 'null'
        rangeLow:
          type:
            - number
            - 'null'
        rangeHigh:
          type:
            - number
            - 'null'
        rangeBasis:
          type:
            - string
            - 'null'
          enum:
            - estimatedValue
            - auctionAdjustedValue
            - null
        executionValue:
          type:
            - number
            - 'null'
        pricePerSqmEstimate:
          type:
            - number
            - 'null'
        rentalYieldEstimate:
          type:
            - number
            - 'null'
        objectiveValueProxy:
          type:
            - number
            - 'null'
        confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        confidenceLabel:
          type:
            - string
            - 'null'
          enum:
            - Low
            - Medium
            - High
            - null
        liquidityScore:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        legalCleanliness:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        planningCertainty:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        taxFriction:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        transferReadiness:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        listingQualityScore:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        marketComparison:
          type:
            - string
            - 'null'
          enum:
            - below_market
            - at_market
            - above_market
            - null
        marketComparisonPct:
          type:
            - number
            - 'null'
        pricingPosition:
          type:
            - string
            - 'null'
          enum:
            - underpriced
            - fair
            - overpriced
            - null
        summary:
          type:
            - string
            - 'null'
        legalSummary:
          type:
            - string
            - 'null'
        taxSummary:
          type:
            - string
            - 'null'
        renovationPotential:
          type:
            - string
            - 'null'
        highestBestUseHint:
          type:
            - string
            - 'null'
        keyFactors:
          type: array
          items:
            type: object
            additionalProperties: true
        redFlags:
          type: array
          items:
            type: string
        methodUsed:
          type: string
        evidence:
          type: object
          additionalProperties: true

    OSWebhookEntity:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [listing, lead, consultation, profile, auction]
        entity_id: { type: string }
        payload: { type: object, additionalProperties: true }

    StripeEvent:
      type: object
      description: Stripe webhook event (full schema per Stripe API)
      properties:
        id: { type: string }
        type: { type: string }
        data: { type: object }

paths:
  /api/public/listings:
    servers:
      - url: https://{websiteHost}
        variables:
          websiteHost:
            default: portal.maiprop.co
    get:
      operationId: publicWebsiteListings
      summary: Public website catalogue (not a Supabase Edge route)
      security: []
      description: >-
        Website API: use your website origin, not the Supabase base. Public active catalogue; optional
        listing_type/property_type, price_min/price_max and cursor. Reuse nextCursor with the same filters;
        expired/invalid cursors return 400. Empty synthetic page shown.
      parameters:
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 40
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: listing_type
          schema:
            type: string
        - in: query
          name: property_type
          schema:
            type: string
        - in: query
          name: price_min
          schema:
            type: number
        - in: query
          name: price_max
          schema:
            type: number
      responses:
        '200':
          description: Public page; no total-count field
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  hasMore:
                    type: boolean
                  nextCursor:
                    type:
                      - string
                      - 'null'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  offset:
                    type: integer
                  publicationId:
                    type: integer
              example:
                data: []
                hasMore: false
                nextCursor: null
                page: 1
                pageSize: 24
                offset: 0
                publicationId: 1
        '400':
          description: Invalid or expired cursor/bounds
        '503':
          description: Upstream catalogue unavailable

  /ai-search:
    post:
      operationId: aiSearch
      summary: Natural-language listing search — converts query into filter object
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              query: Apartment in Athens under 250000 euros
      responses:
        '200':
          description: Parsed filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISearchResponse'
              example:
                city: Athens
                listing_type: sale
                property_type: apartment
                price_min: null
                price_max: 250000
                beds_min: null
                beds_max: null
                sqm_min: null
                sqm_max: null
                features: []
                energy: []
                heating: null
                summary: Apartment for sale in Athens under €250k
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Converts natural language into filters; does not retrieve listing records. Model interpretation should
        be checked by the caller. Source limiter: 20 requests / minute per IP (actor fallback); monthly actor
        quota. Examples are synthetic and do not establish deployment or provider availability.

  /property-valuation:
    post:
      operationId: propertyValuation
      summary: AI-powered property valuation and market comparison
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyValuationRequest'
            example:
              responseVersion: 2
              city: Athens
              price: 250000
              sqm: 80
              propertyType: apartment
              listingType: sale
      responses:
        '200':
          description: Valuation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyValuationResponse'
              example:
                responseVersion: 2
                status: partial
                transaction: sale
                valueUnit: EUR
                estimateBasis: market_value
                providerPrediction: null
                estimatedValue: null
                auctionAdjustedValue: null
                rangeLow: null
                rangeHigh: null
                rangeBasis: null
                executionValue: null
                pricePerSqmEstimate: null
                rentalYieldEstimate: null
                objectiveValueProxy: null
                confidence: null
                confidenceLabel: null
                liquidityScore: null
                legalCleanliness: null
                planningCertainty: null
                taxFriction: null
                transferReadiness: null
                listingQualityScore: null
                marketComparison: null
                marketComparisonPct: null
                pricingPosition: null
                legalSummary: null
                taxSummary: null
                renovationPotential: null
                highestBestUseHint: null
                summary: Insufficient comparable evidence for a numeric estimate.
                keyFactors: []
                redFlags: []
                methodUsed: Unverified AI valuation analysis
                evidence:
                  independentlyVerified: false
                  fields:
                    estimatedValue: unavailable
                    auctionAdjustedValue: unavailable
                    rangeLow: unavailable
                    rangeHigh: unavailable
                    executionValue: unavailable
                    pricePerSqmEstimate: unavailable
                    rentalYieldEstimate: unavailable
                    objectiveValueProxy: unavailable
                    confidence: unavailable
                    liquidityScore: unavailable
                    legalCleanliness: unavailable
                    planningCertainty: unavailable
                    taxFriction: unavailable
                    transferReadiness: unavailable
                    listingQualityScore: unavailable
                    marketComparisonPct: unavailable
                  analysis: ai_estimate
                  limitations:
                    - >-
                      No legal documents, live comparable transactions, or formal appraisal were independently
                      verified.
                    - Model estimates and qualitative assessments are unverified.
      description: >-
        Signed-in, quota-metered v2 valuation. Synthetic partial example: unavailable fields stay null;
        model/provider observations are not independently verified appraisals. A complete lack of evidence
        returns 503. Source limiter: 15 requests / minute per IP; monthly actor quota. Examples are synthetic
        and do not establish deployment or provider availability.

  /neighbourhood-report:
    post:
      operationId: neighbourhoodReport
      summary: Generates an AI-written neighbourhood report for a city/address
      security:
        - SupabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - responseVersion
                - city
              properties:
                responseVersion:
                  type: integer
                  enum:
                    - 2
                city:
                  type: string
                  minLength: 1
                  maxLength: 120
                address:
                  type: string
                region:
                  type: string
                municipality:
                  type: string
                propertyType:
                  type: string
                listingId:
                  type: string
                  format: uuid
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
            example:
              responseVersion: 2
              city: Athens
              address: Synthetic example street
      responses:
        '200':
          description: Successful result; shape depends on the documented operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                responseVersion: 2
                areaName: Synthetic example street
                walkabilityScore: null
                pricePerSqmTrend:
                  current: null
                  oneYearAgo: null
                  threeYearsAgo: null
                  fiveYearsAgo: null
                  changeYoY: null
                  change5Y: null
                noiseLevel: null
                safetyScore: null
                developmentProjects: []
                demographics: null
                investmentOutlook: null
                areaHighlights: []
                generatedBy: fallback
                osMunicipalityStatus: missing_config
                osMunicipalityDetail: ''
                provenance:
                  pricePerSqmTrend:
                    current: null
                    oneYearAgo: null
                    threeYearsAgo: null
                    fiveYearsAgo: null
                    changeYoY: null
                    change5Y: null
                  analysis: null
                  developmentProjects: null
      description: >-
        Signed-in v2 area report. Source-qualified nullable market history and qualitative model analysis; not
        verified safety or walkability. Synthetic fallback response shows unavailable evidence as null. Source
        limiter: 15 requests / minute per IP; monthly actor quota. Examples are synthetic and do not establish
        deployment or provider availability.

  /property-pois:
    post:
      operationId: propertyPois
      summary: Return qualified AI nearby-place suggestions
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responseVersion, lat, lng]
              properties:
                responseVersion:
                  type: integer
                  enum: [2]
