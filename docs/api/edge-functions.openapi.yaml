openapi: 3.1.0
info:
  title: mAI prop Supabase Edge Functions
  description: |
    HTTP endpoints exposed by Supabase Edge Functions for the mAI prop platform.
    All functions run on Deno runtime and are hosted at
    `https://<project>.supabase.co/functions/v1/<name>`.

    Auth model:
    - `verify_jwt = true`: requires Supabase session JWT in `Authorization: Bearer <token>`.
    - `verify_jwt = false`: public or custom-auth (HMAC, webhook signatures, etc.).
  version: 1.0.0
  contact:
    name: mAI prop Engineering

servers:
  - url: https://qvvicunqcrwpioqnvzxf.supabase.co/functions/v1
    description: Production

components:
  securitySchemes:
    SupabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user session JWT
    CronBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: CRON_SECRET supplied as an Authorization Bearer credential
    CronSecretHeader:
      type: apiKey
      in: header
      name: x-cron-secret
      description: CRON_SECRET supplied by the internal scheduler
    HMACSignature:
      type: apiKey
      in: header
      name: X-Maiprop-Signature
      description: HMAC-SHA256 signature (format `t=<ts>,v1=<hex>`) over raw request body
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe webhook signature

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code when the endpoint uses the shared standard error envelope.
        issues:
          type: array
          description: Field-level validation details when request schema validation fails.
          items:
            type: object
            required: [message]
            properties:
              code:
                type: string
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string

    SubscriptionCheckoutReceipt:
      oneOf:
        - type: object
          additionalProperties: false
          required: [checkout_session_id, user_id, kind, product_id, plan_key, audience, status, subscription_end]
          properties:
            checkout_session_id: { type: string, pattern: '^cs_(test|live)_[A-Za-z0-9_]+$' }
            user_id: { type: string, format: uuid }
            kind: { type: string, const: subscription }
            product_id: { type: string }
            plan_key: { type: string }
            audience: { type: string }
            status: { type: string, enum: [active, trialing] }
            subscription_end: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [checkout_session_id, user_id, kind, addon_key, audience, quantity]
          properties:
            checkout_session_id: { type: string, pattern: '^cs_(test|live)_[A-Za-z0-9_]+$' }
            user_id: { type: string, format: uuid }
            kind: { type: string, const: addon }
            addon_key: { type: string }
            audience: { type: string }
            quantity: { type: integer, minimum: 1 }

    SubscriptionCheckState:
      type: object
      required: [subscribed, product_id, subscription_end, sync_status]
      properties:
        subscribed: { type: boolean }
        product_id: { type: string, nullable: true }
        plan_key: { type: string, nullable: true }
        audience: { type: string, nullable: true }
        billing_cycle: { type: string, nullable: true }
        status: { type: string, nullable: true }
        subscription_end: { type: string, format: date-time, nullable: true }
        source: { type: string, enum: [billing_state, investor, database, stripe, reconciliation, deadline] }
        sync_status: { type: string, enum: [synced, pending, timeout] }
        verified_checkout:
          description: Present only after this exact Checkout session is verified against its durable subscription or add-on record.
          $ref: '#/components/schemas/SubscriptionCheckoutReceipt'

    FullSyncFromOsRequest:
      type: object
      additionalProperties: false
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        size: { type: integer, minimum: 1, maximum: 500 }
        maxPages: { type: integer, minimum: 1, maximum: 500 }
        startPage: { type: integer, minimum: 0, maximum: 100000 }
        replaceAll: { type: boolean }
        replace_all: { type: boolean }
        auctionDateFrom: { type: string, format: date }
        auctionDateTo: { type: string, format: date }
        propertyCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [RESIDENCE, OTHER_BUSINESS_SPACE, STORE, OFFICE, PARKING, STOREROOM, INDUSTRIAL, LAND, LAND_WITH_BUILDING, PLOT, PLOT_WITH_BUILDING, HOTEL]
        prefectureId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        propertyMunicipalityId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        auctionStatuses:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [POSTED, OPEN, READY_TO_CONDUCT, CANCELED, COMPLETED, COMPLETED_NO_BIDDERS, FINALIZED_PARTICIPANT_LIST, SUSPENDED]

    PollOsAuctionsRequest:
      type: object
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 0, maximum: 100000 }
        pageSize: { type: integer, minimum: 1, maximum: 600 }
        size: { type: integer, minimum: 1, maximum: 600 }
        sampleAcrossGreece: { type: boolean }
        source: { type: string, enum: [daily-canonical-pool] }
        auctionDateFrom: { type: string, format: date }
        auctionDateTo: { type: string, format: date }
        propertyCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [RESIDENCE, OTHER_BUSINESS_SPACE, STORE, OFFICE, PARKING, STOREROOM, INDUSTRIAL, LAND, LAND_WITH_BUILDING, PLOT, PLOT_WITH_BUILDING, HOTEL]
        prefectureId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        propertyMunicipalityId:
          { type: integer, format: int64, minimum: -9007199254740991, maximum: 9007199254740991 }
        auctionStatuses:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum: [POSTED, OPEN, READY_TO_CONDUCT, CANCELED, COMPLETED, COMPLETED_NO_BIDDERS, FINALIZED_PARTICIPANT_LIST, SUSPENDED]
        auctionAmountFrom: { type: number, minimum: 0, maximum: 1000000000000 }
        auctionAmountTo: { type: number, minimum: 0, maximum: 1000000000000 }
        boundingBox:
          type: object
          additionalProperties: false
          required: [north, south, east, west]
          properties:
            north: { type: number, minimum: -90, maximum: 90 }
            south: { type: number, minimum: -90, maximum: 90 }
            east: { type: number, minimum: -180, maximum: 180 }
            west: { type: number, minimum: -180, maximum: 180 }
        sortBy:
          type: string
          enum: [AUCTION_ID, AUCTION_DATE, AUCTION_FIRST_PRICE_OFFER, AUCTION_REGISTRATION_AMOUNT, AUCTION_DATE_QUARTER]
        order: { type: string, enum: [ASC, DESC] }

    FetchReportFromOsRequest:
      type: object
      additionalProperties: false
      required: [listing_id, report_type]
      properties:
        listing_id: { type: string, format: uuid }
        report_type: { type: string, enum: [valuation, neighbourhood] }
        lang: { type: string, enum: [en, el], default: en }
        since: { type: string, format: date }
        to: { type: string, format: date }
        listing:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, format: uuid }
            address: { type: [string, 'null'], maxLength: 500 }
            city: { type: [string, 'null'], maxLength: 200 }
            latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
            longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
            sqm: { type: [number, 'null'], minimum: 0, maximum: 10000000 }
            property_type: { type: [string, 'null'], maxLength: 100 }
            floor: { type: [integer, 'null'], minimum: -20, maximum: 300 }
            year_built: { type: [integer, 'null'], minimum: 1000, maximum: 2200 }

    LogRoleSwitchRequest:
      type: object
      additionalProperties: false
      required: [operation_id, from_type, cancel_subscription]
      properties:
        operation_id: { type: string, format: uuid }
        from_type:
          { type: string, enum: [buyer, seller, agent, developer, professional, investor, institutional] }
        to_type:
          { type: string, enum: ['', buyer, seller, agent, developer, professional, investor, institutional], default: '' }
        cancel_subscription: { type: boolean, enum: [true] }

    BeginRoleSwitchRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [audit_id]
          properties:
            audit_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [validate_only]
          properties:
            validate_only: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [validateOnly]
          properties:
            validateOnly: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [dry_run]
          properties:
            dry_run: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [dryRun]
          properties:
            dryRun: { type: boolean, enum: [true] }

    HealthzResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]
          description: Per-subsystem check results (database, env_vars, openai, stripe, sentry, brevo)
        timestamp:
          type: string
          format: date-time

    AISearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, description: Natural-language search input }

    AISearchResponse:
      type: object
      properties:
        city: { type: string, nullable: true }
        listing_type: { type: string, enum: [sale, rent, auction, firesale], nullable: true }
        property_type: { type: string, nullable: true }
        price_min: { type: number, nullable: true }
        price_max: { type: number, nullable: true }
        beds_min: { type: integer, nullable: true }
        sqm_min: { type: integer, nullable: true }
        summary: { type: string, nullable: true }

    PropertyValuationRequest:
      type: object
      required: [responseVersion, city, price, sqm]
      properties:
        responseVersion: { type: integer, enum: [2] }
        title: { type: string, nullable: true }
        city: { type: string }
        address: { type: string, nullable: true }
        price: { type: number }
        sqm: { type: number }
        bedrooms: { type: integer, nullable: true }
        bathrooms: { type: integer, nullable: true }
        propertyType: { type: string, nullable: true }
        listingType: { type: string, nullable: true }
        yearBuilt: { type: integer, nullable: true }
        energyClass: { type: string, nullable: true }
        floor: { type: integer, nullable: true }
        pricePerSqm: { type: number, nullable: true }

    PropertyValuationResponse:
      type: object
      required:
        - responseVersion
        - status
        - transaction
        - valueUnit
        - estimateBasis
        - providerPrediction
        - estimatedValue
        - auctionAdjustedValue
        - rangeLow
        - rangeHigh
        - rangeBasis
        - executionValue
        - pricePerSqmEstimate
        - rentalYieldEstimate
        - objectiveValueProxy
        - confidence
        - confidenceLabel
        - liquidityScore
        - legalCleanliness
        - planningCertainty
        - taxFriction
        - transferReadiness
        - listingQualityScore
        - marketComparison
        - marketComparisonPct
        - pricingPosition
        - summary
        - legalSummary
        - taxSummary
        - renovationPotential
        - highestBestUseHint
        - keyFactors
        - redFlags
        - methodUsed
        - evidence
      properties:
        responseVersion: { type: integer, enum: [2] }
        status: { type: string, enum: [available, partial] }
        transaction: { type: string, enum: [sale, rent, auction] }
        valueUnit: { type: string, enum: [EUR, EUR/month] }
        estimateBasis: { type: string, enum: [market_value, monthly_rent, auction_value, os_auction_model] }
        providerPrediction:
          type: object
          nullable: true
          required: [value, field, model, unit]
          properties:
            value: { type: number }
            field: { type: string, enum: [propertyPredictedPrice, propertyPredictedLeasePrice] }
            model: { type: string, enum: [market, auction] }
            unit: { type: string, enum: [EUR, EUR/month], nullable: true }
        estimatedValue: { type: number, nullable: true }
        auctionAdjustedValue: { type: number, nullable: true }
        rangeLow: { type: number, nullable: true }
        rangeHigh: { type: number, nullable: true }
        rangeBasis: { type: string, enum: [estimatedValue, auctionAdjustedValue], nullable: true }
        executionValue: { type: number, nullable: true }
        pricePerSqmEstimate: { type: number, nullable: true }
        rentalYieldEstimate: { type: number, nullable: true }
        objectiveValueProxy: { type: number, nullable: true }
        confidence: { type: number, minimum: 0, maximum: 100, nullable: true }
        confidenceLabel: { type: string, enum: [Low, Medium, High], nullable: true }
        liquidityScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        legalCleanliness: { type: number, minimum: 0, maximum: 100, nullable: true }
        planningCertainty: { type: number, minimum: 0, maximum: 100, nullable: true }
        taxFriction: { type: number, minimum: 0, maximum: 100, nullable: true }
        transferReadiness: { type: number, minimum: 0, maximum: 100, nullable: true }
        listingQualityScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        marketComparison: { type: string, enum: [below_market, at_market, above_market], nullable: true }
        marketComparisonPct: { type: number, nullable: true }
        pricingPosition: { type: string, enum: [underpriced, fair, overpriced], nullable: true }
        summary: { type: string, nullable: true }
        legalSummary: { type: string, nullable: true }
        taxSummary: { type: string, nullable: true }
        renovationPotential: { type: string, nullable: true }
        highestBestUseHint: { type: string, nullable: true }
        keyFactors: { type: array, items: { type: object, additionalProperties: true } }
        redFlags: { type: array, items: { type: string } }
        methodUsed: { type: string }
        evidence: { type: object, additionalProperties: true }

    OSWebhookEntity:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [listing, lead, consultation, profile, auction]
        entity_id: { type: string }
        payload: { type: object, additionalProperties: true }

    StripeEvent:
      type: object
      description: Stripe webhook event (full schema per Stripe API)
      properties:
        id: { type: string }
        type: { type: string }
        data: { type: object }

paths:
  /ai-search:
    post:
      operationId: aiSearch
      summary: Natural-language listing search — converts query into filter object
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AISearchRequest' }
      responses:
        '200':
          description: Parsed filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AISearchResponse' }
        '400':
          description: Bad request
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /property-valuation:
    post:
      operationId: propertyValuation
      summary: AI-powered property valuation and market comparison
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyValuationRequest' }
      responses:
        '200':
          description: Valuation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyValuationResponse' }

  /neighbourhood-report:
    post:
      operationId: neighbourhoodReport
      summary: Generates an AI-written neighbourhood report for a city/address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city]
              properties:
                city: { type: string }
                address: { type: string, nullable: true }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: string }
                  highlights: { type: array, items: { type: string } }
                  walkScore: { type: integer, nullable: true }

  /property-pois:
    post:
      operationId: propertyPois
      summary: Return qualified AI nearby-place suggestions
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responseVersion, lat, lng]
              properties:
                responseVersion:
                  type: integer
                  enum: [2]
                lat: { type: number }
                lng: { type: number }
                address: { type: string, maxLength: 240 }
                city: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Qualified AI suggestions without geographic marker coordinates
          content:
            application/json:
              schema:
                type: object
                required: [responseVersion, pois, generatedBy, warning, provenance]
                properties:
                  responseVersion: { type: integer, enum: [2] }
                  generatedBy: { type: string, enum: [ai] }
                  warning: { type: string }
                  provenance:
                    type: object
                    required: [source, independentlyVerified, coordinatesProvided]
                    properties:
                      source: { type: string, enum: [ai_model_suggestion] }
                      independentlyVerified: { type: boolean, enum: [false] }
                      coordinatesProvided: { type: boolean, enum: [false] }
                  pois:
                    type: array
                    minItems: 1
                    maxItems: 15
                    items:
                      type: object
                      required: [name, category, distanceKm, walkMinutes]
                      properties:
                        name: { type: string }
                        category: { type: string, enum: [school, transit, cafe, hospital, shopping, park] }
                        distanceKm: { type: number, minimum: 0, maximum: 5 }
                        walkMinutes: { type: integer, minimum: 0, maximum: 120 }
                        description: { type: string }
        '503':
          description: Nearby-place evidence is unavailable or the requested response version is unsupported

  /smart-filters:
    get:
      operationId: smartFilters
      summary: Returns suggested smart filters for a type/subtype combo
      security: []
      parameters:
        - in: query
          name: type
          required: true
          schema: { type: string }
        - in: query
          name: subtype
          schema: { type: string }
      responses:
        '200':
          description: Filter suggestions
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /property-chat:
    post:
      operationId: propertyChat
      summary: Chat with the AI about a specific listing (authenticated)
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, message]
              properties:
                listing_id: { type: string }
                message: { type: string }
                history: { type: array, items: { type: object } }
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }

  /pro-ai-tools:
    post:
      operationId: proAiTools
      summary: Pro-tier AI tools (listing improvement, translations, market briefs)
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Tool output
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /ai-service-match:
    post:
      operationId: aiServiceMatch
      summary: Match a user query to a suitable professional
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200':
          description: Ranked professional matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        professional_id: { type: string }
                        score: { type: number }
                        reason: { type: string }

  /ai-translate:
    post:
      operationId: aiTranslate
      summary: Translate arbitrary text between supported locales
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target]
              properties:
                text: { type: string }
                target: { type: string, enum: [en, el, de, fr, it] }
      responses:
        '200':
          description: Translated text
          content:
            application/json:
              schema:
                type: object
                properties:
                  translated: { type: string }

  /listing-ai-assist:
    post:
      operationId: listingAiAssist
      summary: "Assist form: title, description, features, price suggestion"
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Suggestions, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /create-checkout:
    post:
      operationId: createCheckout
      summary: Create a Stripe Checkout session for subscription upgrade
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_id]
              properties:
                price_id: { type: string }
                success_url: { type: string }
                cancel_url: { type: string }
      responses:
        '200':
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }

  /check-subscription:
    get:
      operationId: checkSubscription
      summary: Returns the authenticated user's current subscription state
      description: An ordinary empty refresh. A synced entitlement is not proof of a new Checkout session.
      security: [{ SupabaseJWT: [] }]
      responses:
        '200':
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
    post:
      operationId: reconcileCheckoutSubscription
      summary: Refresh subscription state and optionally reconcile one exact Checkout session
      description: |
        An empty JSON object performs the supported ordinary refresh. Providing checkout_session_id
        requests exact-session reconciliation. A 200 response confirms that Checkout only when
        verified_checkout is present and matches the request; receipt absence does not invalidate
        otherwise usable entitlement state. Pending provider or durable-state observation returns 202.
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checkout_session_id:
                  type: string
                  pattern: '^cs_(test|live)_[A-Za-z0-9_]+$'
      responses:
        '200':
          description: Current state; exact Checkout is confirmed only when verified_checkout is present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
        '202':
          description: Checkout reconciliation remains pending or cannot yet be durably verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckState'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /customer-portal:
    post:
      operationId: customerPortal
      summary: Create a Stripe Customer Portal session for billing management
      security: [{ SupabaseJWT: [] }]
      responses:
        '200':
          description: Portal URL
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string, format: uri } } }

  /apply-data-input-credit:
    post:
      operationId: applyDataInputCredit
      summary: |
        (Admin) Convert a verified agent_data_inputs row into a Stripe customer
        balance credit applied to the agent's next invoice. Idempotent on
        stripe_credit_id.
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_input_id]
              properties:
                data_input_id: { type: string, format: uuid }
      responses:
        '200':
          description: Credit applied (or already applied)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  idempotent: { type: boolean }
                  stripe_credit_id: { type: string, nullable: true }
                  amount_cents: { type: integer, nullable: true }
                  currency: { type: string, nullable: true }
                  reason: { type: string, nullable: true }
        '403':
          description: Caller is not a platform admin
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Data input or Stripe customer not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Row is not in 'verified' status
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Agent missing email or active subscription
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /get-invoices:
    get:
      operationId: getInvoices
      summary: Paginated list of Stripe invoices for the current user
      security: [{ SupabaseJWT: [] }]
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { type: object } }

  /agent-data-input:
    post:
      operationId: agentDataInput
      summary: |
        Agent "Data Input" feature. Action-based router for the agent dashboard
        — agents submit their closings (sale/rental deals) in exchange for a
        0.5%-per-verified-entry discount on their next subscription invoice
        (capped at 20 entries per calendar month = up to 10% off). Hallucinated
        submissions trigger a permanent (lifetime) ban via admin review.
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, enum: [status, list] }
                - type: object
                  required: [action, payload]
                  properties:
                    action: { type: string, enum: [submit] }
                    payload:
                      type: object
                      required: [property_address, property_type, transaction_type, agent_side, sale_price, closing_date]
                      properties:
                        property_address: { type: string, minLength: 5, maxLength: 300 }
                        city:             { type: string, nullable: true }
                        postal_code:      { type: string, nullable: true }
                        kaek:             { type: string, nullable: true }
                        property_type:    { type: string, enum: [apartment, house, commercial, land, other] }
                        transaction_type: { type: string, enum: [sale, rental] }
                        agent_side:       { type: string, enum: [buyer, seller, both] }
                        sale_price:       { type: number, exclusiveMinimum: 0 }
                        closing_date:     { type: string, format: date }
                        buyer_name:       { type: string, nullable: true }
                        seller_name:      { type: string, nullable: true }
                        notes:            { type: string, nullable: true, maxLength: 2000 }
                - type: object
                  required: [action, input_id, decision]
                  properties:
                    action:        { type: string, enum: [admin_review] }
                    input_id:      { type: string, format: uuid }
                    decision:      { type: string, enum: [verified, rejected, flagged, pending] }
                    reason:        { type: string, nullable: true }
                    lifetime_ban:  { type: boolean, default: false }
      responses:
        '200':
          description: |
            For action=status/list — counters + entries; for action=submit — created entry; for action=admin_review — updated entry.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Validation error,            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthenticated,             content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden / lifetime banned, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Monthly limit reached,       content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /create-stripe-price:
    post:
      operationId: createStripePrice
      summary: (Admin) create a new Stripe Price object
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /sync-stripe-pricing:
    post:
      operationId: syncStripePricing
      summary: (Admin) synchronise Stripe products/prices into Supabase
      security: [{ SupabaseJWT: [] }]
      responses:
        '200': { description: Sync result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /stripe-webhook:
    post:
      operationId: stripeWebhook
      summary: Inbound Stripe webhook (verified via Stripe signature)
      security: [{ StripeSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StripeEvent' }
      responses:
        '200':
          description: Acknowledged
          content: { application/json: { schema: { type: object, properties: { received: { type: boolean } } } } }
        '400':
          description: Invalid signature

  /receive-from-os:
    post:
      operationId: receiveFromOs
      summary: Inbound webhook from MaiProp-OS (HMAC verified, replay-protected)
      security: [{ HMACSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OSWebhookEntity' }
      responses:
        '200': { description: OK }
        '401': { description: Invalid signature }
        '409': { description: Replay detected }

  /sync-to-os:
    post:
      operationId: syncToOs
      summary: Outbound sync — pushes local entity to MaiProp-OS
      security: [{ HMACSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OSWebhookEntity' }
      responses:
        '200': { description: Sync accepted }

  /sync-firesale-to-os:
    post:
      operationId: syncFiresaleToOs
      summary: Sync fire-sale deals to MaiProp-OS
      security: [{ HMACSignature: [] }]
      responses:
        '200': { description: OK }

  /full-sync-from-os:
    post:
      operationId: fullSyncFromOs
      summary: Trigger a full re-sync of entities from MaiProp-OS
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullSyncFromOsRequest' }
      responses:
        '200': { description: Sync started }
        '400': { description: Invalid request body }
        '401': { description: Missing or invalid authorization }
        '403': { description: Platform admin required }
        '405': { description: Method not allowed }
        '408': { description: Request body read deadline exceeded }
        '413': { description: Request body exceeds the configured limit }
        '429': { description: Rate limit exceeded }
        '500': { description: Sync or upstream provider failure }
        '502': { description: MaiProp-OS rejected the sync request }

  /poll-os-auctions:
    post:
      operationId: pollOsAuctions
      summary: Scheduled function — polls MaiProp-OS for new auctions
      security:
        - CronBearer: []
        - SupabaseJWT: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollOsAuctionsRequest' }
      responses:
        '200': { description: Polling result }
        '400': { description: Invalid request body }
        '401': { description: Missing or invalid cron/admin authorization }
        '403': { description: Platform admin required }
        '405': { description: Method not allowed }
        '408': { description: Request body read deadline exceeded }
        '413': { description: Request body exceeds the configured limit }
        '429': { description: Rate limit exceeded }
        '500': { description: Poll or upstream provider failure }

  /fetch-os-auctions:
    post:
      operationId: fetchOsAuctions
      summary: Fetch OS auctions for eligible signed-in users
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: integer, minimum: 0 }
                pageSize: { type: integer, minimum: 1, maximum: 600 }
                sampleAcrossGreece: { type: boolean }
                auctionDateFrom: { type: string, format: date }
                auctionDateTo: { type: string, format: date }
                prefectureId: { type: string }
                propertyMunicipalityId: { type: string }
                boundingBox: { type: object, additionalProperties: true }
      responses:
        '200': { description: Auction search result }
        '401': { description: Missing or invalid user authorization }
        '403': { description: Caller is not eligible for OS auction access }

  /fetch-past-deals-from-os:
    get:
      operationId: fetchPastDealsFromOs
      summary: Fetch historical closed deals from MaiProp-OS
      security: []
      responses:
        '200': { description: Deals }

  /fetch-report-from-os:
    post:
      operationId: fetchReportFromOs
      summary: Fetch a valuation or neighbourhood report for an accessible listing
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FetchReportFromOsRequest' }
      responses:
        '200': { description: Report }
        '202': { description: Report generation is already in progress }
        '400': { description: Invalid request body }
        '401': { description: Missing or invalid authorization }
        '402': { description: Report entitlement or billing denied }
        '404': { description: Listing is not accessible }
        '405': { description: Method not allowed }
        '408': { description: Request body read deadline exceeded }
        '413': { description: Request body exceeds the configured limit }
        '429': { description: Rate limit exceeded }
        '500': { description: Report generation failed }
        '503': { description: Service configuration or listing access unavailable }

  /os-diagnose:
    get:
      operationId: osDiagnose
      summary: Diagnostics endpoint for MaiProp-OS integration health
      security: []
      responses:
        '200':
          description: Diagnostic report
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy: { type: boolean }
                  checks: { type: array, items: { type: object } }

  /os-sales-coordinates:
    get:
      operationId: osSalesCoordinates
      summary: Return clustered sale coordinates from MaiProp-OS
      security: []
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          description: "minLng,minLat,maxLng,maxLat"
      responses:
        '200': { description: GeoJSON FeatureCollection }

  /send-saved-search-alerts:
    post:
      operationId: sendSavedSearchAlerts
      summary: Scheduled — emails users about new matches for saved searches
      security: []
      responses:
        '200': { description: OK }

  /scheduled-followups:
    post:
      operationId: scheduledFollowups
      summary: Cron-only scheduled follow-up processor
      security: []
      responses:
        '200': { description: Follow-up processing summary }
        '401': { description: Missing or invalid cron secret }

  /reconcile-role-switch-billing:
    post:
      operationId: reconcileRoleSwitchBilling
      summary: Cron-only recovery for incomplete role-switch billing audits
      security: [{ CronSecretHeader: [] }]
      responses:
        '200': { description: Bounded billing reconciliation summary }
        '401': { description: Missing or invalid cron secret }
        '500': { description: Reconciliation or provider failure }
        '504': { description: Reconciliation deadline exceeded }
        '405': { description: Method not allowed }
        '503': { description: Required billing service configuration unavailable }

  /process-storage-cleanup:
    post:
      operationId: processStorageCleanup
      summary: Cron-only compensating cleanup for abandoned public Storage objects
      security: [{ CronSecretHeader: [] }]
      responses:
        '200':
          description: Claimed jobs were completed, preserved, or queued for retry
          content:
            application/json:
              schema:
                type: object
                required: [claimed, completed, retried, dead]
                properties:
                  claimed: { type: integer, minimum: 0, maximum: 25 }
                  completed: { type: integer, minimum: 0 }
                  retried: { type: integer, minimum: 0 }
                  dead: { type: integer, minimum: 0 }
        '401': { description: Missing or invalid cron secret }
        '405': { description: Method other than POST }
        '500': { description: Queue claim failed or one or more jobs became terminal }
        '503': { description: Required Supabase service configuration is unavailable }

  /process-email-queue:
    post:
      operationId: processEmailQueue
      summary: Drain queued outbound emails (invoked by cron)
      security: [{ SupabaseJWT: [] }]
      responses:
        '200': { description: OK }

  /invitation-notify:
    post:
      operationId: invitationNotify
      summary: Send invitation notification emails
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string }
      responses:
        '200': { description: OK }

  /oh-registration-notify:
    post:
      operationId: ohRegistrationNotify
      summary: Notify owner of a new open-house registration
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: OK }

  /delete-account:
    post:
      operationId: deleteAccount
      summary: Delete the authenticated user's account (GDPR right to erasure)
      security: [{ SupabaseJWT: [] }]
      responses:
        '200': { description: Deleted }
        '401': { description: Not authenticated }

  /log-role-switch:
    post:
      operationId: logRoleSwitch
      summary: Audit-log a participant/role switch event
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogRoleSwitchRequest' }
      responses:
        '200': { description: Logged }
        '400': { description: Invalid role-switch state or request body }
        '401': { description: Missing or invalid authorization }
        '405': { description: Method not allowed }
        '408': { description: Request body read deadline exceeded }
        '413': { description: Request body exceeds the configured limit }
        '429': { description: Rate limit exceeded }
        '500': { description: Role-switch billing or audit failure }
        '502': { description: Billing cancellation could not be verified }
        '503': { description: Service configuration or audit persistence unavailable }

  /begin-role-switch:
    post:
      operationId: beginRoleSwitch
      summary: Validate or begin an authenticated role-switch operation
      security: [{ SupabaseJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginRoleSwitchRequest' }
      responses:
        '200': { description: Role-switch validation or initialization succeeded }
        '400': { description: Invalid role-switch state or request body }
        '401': { description: Missing or invalid authorization }
        '405': { description: Method not allowed }
        '408': { description: Request body read deadline exceeded }
        '413': { description: Request body exceeds the configured limit }
        '429': { description: Rate limit exceeded }
        '503': { description: Service configuration unavailable }

  /streetview-proxy:
    get:
      operationId: streetViewProxy
      summary: Proxy for Google Street View images (hides API key)
      security: []
      parameters:
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: string
            default: 600x400
      responses:
        '200':
          description: JPEG image
          content:
            image/jpeg:
              schema: { type: string, format: binary }

  /sitemap:
    get:
      operationId: sitemap
      summary: Dynamic XML sitemap for SEO
      security: []
      responses:
        '200':
          description: XML sitemap
          content:
            application/xml:
              schema: { type: string }

  /auth-email-hook:
    post:
      operationId: authEmailHook
      summary: Supabase auth email hook (signup, reset, magic-link)
      security: [{ HMACSignature: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: OK }

  /csp-report:
    post:
      operationId: cspReport
      summary: Receive and log Content-Security-Policy violation reports
      description: |
        Public endpoint (verify_jwt = false). Accepts CSP violation reports in both
        Reporting API format (report-to, JSON array) and legacy report-uri format
        (single object with csp-report key). Logs violations via structured logger.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Report received and logged
        '405':
          description: Method not allowed (only POST accepted)

  /record-listing-view:
    post:
      operationId: recordListingView
      summary: Record an anonymous public listing view event
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string, format: uuid }
      responses:
        '200': { description: View recorded or safely ignored }
        '400': { description: Invalid listing view payload }
        '429': { description: Rate limited }

  /healthz:
    get:
      operationId: healthz
      summary: Uptime health check — verifies DB connectivity and required env vars
      description: |
        Public endpoint (verify_jwt = false). Returns 200 when all critical checks pass,
        503 when any critical check (database, env_vars) fails. Optional integration
        checks (openai, stripe, sentry, brevo) are reported but do not affect status.
      security: []
      responses:
        '200':
          description: All critical checks pass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
        '503':
          description: One or more critical checks failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
