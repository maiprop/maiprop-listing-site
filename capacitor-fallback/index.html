<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MaiProp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7faf9;
        color: #10201d;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 420px;
      }

      .mark {
        align-items: center;
        background: #0f766e;
        border-radius: 18px;
        color: white;
        display: inline-flex;
        font-size: 18px;
        font-weight: 800;
        height: 56px;
        justify-content: center;
        letter-spacing: 0;
        width: 56px;
      }

      h1 {
        font-size: 28px;
        letter-spacing: 0;
        line-height: 1.1;
        margin: 20px 0 12px;
      }

      p {
        color: #4a5f59;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }

      a {
        color: #0f766e;
        display: inline-block;
        font-weight: 700;
        margin-top: 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">mP</div>
      <h1>MaiProp needs a connection</h1>
      <p>The Android app opens the live MaiProp web app so listings, auctions, open houses, professionals, auth, and data stay wired to production.</p>
      <a href="https://maiprop.co">Open maiprop.co</a>
    </main>
  </body>
</html>
