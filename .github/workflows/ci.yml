name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift check; pushes and PRs cover normal change validation.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # Format-valid stubs — real secrets are never committed.
  # URL must match https://<ref>.supabase.co; key uses Supabase's publishable-key prefix.
  VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
  VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop

jobs:
  quality:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      release_candidate_artifact_id: ${{ steps.release_candidate_upload.outputs.artifact-id }}
      release_candidate_artifact_digest: ${{ steps.release_candidate_upload.outputs.artifact-digest }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Enforce Cloudflare bootstrap squash marker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          sensitive_change=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/bootstrap-cloudflare-staging-pages.yml|\
              .github/workflows/compliance-evidence.yml|\
              .github/workflows/lock-cloudflare-pages-git-deploys.yml|\
              .github/workflows/reusable-cloudflare-production-deploy.yml|\
              .github/workflows/stage-release.yml)
                sensitive_change=1
                break
                ;;
            esac
          done < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
          if [ "$sensitive_change" -eq 0 ]; then
            exit 0
          fi

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          gh api graphql \
            -f owner="$repo_owner" \
            -f name="$repo_name" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                mergeCommitAllowed
                rebaseMergeAllowed
                squashMergeAllowed
                squashMergeCommitTitle
              }
            }' > repository-merge-settings.json
          if ! jq -e '
            .data.repository.squashMergeAllowed == true and
            .data.repository.mergeCommitAllowed == false and
            .data.repository.rebaseMergeAllowed == false and
            .data.repository.squashMergeCommitTitle == "PR_TITLE"
          ' repository-merge-settings.json > /dev/null; then
            echo "::error::Sensitive Cloudflare bootstrap changes require squash-only PR-title commit settings."
            jq -c '.data.repository // {}' repository-merge-settings.json
            exit 1
          fi
          case "$PR_TITLE" in
            '[CF-Pages-Skip]'*) ;;
            *)
              echo "::error::Sensitive Cloudflare bootstrap PR titles must begin with [CF-Pages-Skip]."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Security audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

      - name: Check committed secrets
        run: npm run check:secrets

      - name: Check dependency overrides
        run: npm run check:dependency-overrides

      - name: Type-check & build
        run: npm run build

      - name: Type-check Cloudflare Pages Functions
        run: npm run typecheck:functions

      - name: Type-check Remotion video runtime
        run: npm run typecheck:remotion

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Lint migrations (idempotency for new migrations)
        run: npm run lint:migrations

      - name: Lint migrations (timestamp chronology)
        run: npm run lint:migrations:chronology

      - name: Check public edge function protections
        run: npm run check:public-functions

      - name: Check OpenAPI coverage
        run: npm run check:openapi-coverage

      - name: Check enterprise readiness basics
        run: npm run check:enterprise-readiness-basics

      - name: Check GitHub governance evidence
        run: npm run check:github-governance

      - name: Check disaster recovery evidence
        run: npm run check:dr-readiness

      - name: Check standards readiness evidence
        run: npm run check:standards-readiness

      - name: Check type-debt ratchet
        run: npm run check:type-debt

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # The components smoke-test file alone renders ~150 React components
          # in one process; with the default 2 GB Node heap on Linux runners
          # the V8 GC starts thrashing and OOM-kills the worker. 4 GB leaves
          # comfortable head-room. Pair this with `pool: 'forks'` in
          # vitest.config.ts so other files run in fresh processes.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test catalogue hotfix release contracts
        run: npm run test:catalogue-hotfix

      - name: Coverage
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check generated types freshness
        run: |
          TYPES_FILE="src/integrations/supabase/types.ts"
          REVIEW_THRESHOLD=5500
          LINES=$(wc -l < "$TYPES_FILE")
          echo "Generated types file: $LINES lines"
          if [ "$LINES" -gt "$REVIEW_THRESHOLD" ]; then
            echo "::warning file=$TYPES_FILE::Generated types file has grown to $LINES lines (threshold: $REVIEW_THRESHOLD). Consider reviewing schema size."
          fi

      - name: SBOM generation
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 3

      - name: License compliance check
        run: |
          npx license-checker --production --failOn 'GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;MPL-1.0;MPL-1.1;MPL-2.0;EPL-1.0;EPL-2.0;CDDL-1.0;CDDL-1.1' --summary || {
            echo "::error::Found dependencies with restricted licenses (GPL/AGPL/LGPL/MPL/EPL/CDDL). Review before deploying."
            exit 1
          }

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          DOWNLOAD_VERIFIED=false
          for ATTEMPT in 1 2 3; do
            rm -f "$GITLEAKS_ARCHIVE"
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --output "$GITLEAKS_ARCHIVE" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" && \
              echo "${EXPECTED_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum -c -; then
              DOWNLOAD_VERIFIED=true
              break
            fi

            echo "::warning::Gitleaks archive failed verification (attempt ${ATTEMPT}/3)."
            sleep $((ATTEMPT * 2))
          done

          if [ "$DOWNLOAD_VERIFIED" != "true" ]; then
            echo "::error::Gitleaks archive failed pinned SHA-256 verification after 3 attempts."
            exit 1
          fi
          tar -xzf "$GITLEAKS_ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scanning (gitleaks)
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

      - name: Deno edge function tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.12

      - name: Type-check Supabase Edge Functions
        run: npm run check:edge-functions

      - name: Run Deno tests
        working-directory: supabase/functions
        run: |
          for attempt in 1 2 3; do
            deno test --allow-env --allow-net --allow-read --allow-write . && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Deno test failed on attempt $attempt; retrying after transient dependency fetch failure..."
            sleep 10
          done

      - name: Package Cloudflare Pages Functions worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.triggering_actor
        run: npm run build:cloudflare-pages-worker

      - name: Create immutable release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.triggering_actor
        run: |
          set -euo pipefail
          supabase_status="$(
            git status --porcelain --untracked-files=all -- supabase
          )"
          if [ -n "$supabase_status" ]; then
            echo "::error::Supabase source changed before immutable candidate packaging."
            printf '%s\n' "$supabase_status"
            exit 1
          fi
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          npm run release:artifact:create -- \
            --dist dist \
            --sbom sbom.cdx.json \
            --supabase supabase \
            --out release-candidate \
            --sha "$GITHUB_SHA" \
            --tree "$source_tree" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload immutable release candidate
        id: release_candidate_upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.triggering_actor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90

  release-safety:
    name: Release Safety Inventory
    needs: quality
    uses: ./.github/workflows/reusable-release-safety.yml

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Run on main pushes, manual full CI, and non-draft PRs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [quality, release-safety]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        timeout-minutes: 4
        # Hosted Ubuntu runners already include Chromium's runtime libraries for
        # our CI smoke tests. Avoid --with-deps here because it enters apt and
        # can stall on external package mirrors before tests ever start.
        run: npx playwright install chromium

      - name: Build app
        run: npm run build

      - name: Run authenticated performance gates
        run: npm run test:perf
        env:
          CI: true
          VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop

      - name: Run placeholder Supabase E2E smoke + auth tests
        timeout-minutes: 8
        run: |
          echo "This job uses placeholder Supabase env and is a UI smoke gate, not staging integration proof."
          npx playwright test --project=chromium --grep-invert @perf --reporter=line
        env:
          CI: true
          VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  migrations-validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    needs: [quality, release-safety]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maiprop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify containerized psql client
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:15 \
            psql -h localhost -U postgres -d maiprop_test -v ON_ERROR_STOP=1 -c 'select 1'

      - name: Prepare extensions
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres -i postgres:15 \
            psql -h localhost -U postgres -d maiprop_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          -- Supabase built-in roles used by RLS policies
          DO $$ BEGIN
            CREATE ROLE authenticated; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE anon; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE service_role; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          -- Stub auth.users with full Supabase column set
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text UNIQUE,
            encrypted_password text,
            email_confirmed_at timestamptz,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            raw_app_meta_data jsonb DEFAULT '{}'::jsonb,
            role text,
            aud text,
            phone text,
            phone_confirmed_at timestamptz,
            last_sign_in_at timestamptz,
            is_super_admin boolean DEFAULT false,
            banned_until timestamptz,
            deleted_at timestamptz
          );
          -- Stub auth.uid() used by RLS policies
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT 'anon'::text $$;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT '{}'::jsonb $$;
          -- Stub storage schema — migrations reference storage.buckets / storage.objects
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            public boolean DEFAULT false,
            avif_autodetection boolean DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          ALTER TABLE storage.buckets ENABLE ROW LEVEL SECURITY;
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text REFERENCES storage.buckets(id),
            name text,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            last_accessed_at timestamptz DEFAULT now(),
            metadata jsonb,
            path_tokens text[]
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          -- Supabase storage helper functions used in policies
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql AS $$ SELECT string_to_array(name, '/') $$;
          CREATE OR REPLACE FUNCTION storage.filename(name text) RETURNS text LANGUAGE sql AS $$ SELECT (string_to_array(name, '/'))[array_length(string_to_array(name, '/'), 1)] $$;
          CREATE OR REPLACE FUNCTION storage.extension(name text) RETURNS text LANGUAGE sql AS $$ SELECT reverse(split_part(reverse(name), '.', 1)) $$;
          -- Stub extensions schema used by pg_net SCHEMA extensions
          CREATE SCHEMA IF NOT EXISTS extensions;
          -- Stub pg_net used by private cron invoker migrations
          CREATE SCHEMA IF NOT EXISTS net;
          CREATE OR REPLACE FUNCTION net.http_post(
            url text,
            headers jsonb DEFAULT '{}'::jsonb,
            body jsonb DEFAULT '{}'::jsonb,
            timeout_milliseconds integer DEFAULT 1000
          ) RETURNS bigint LANGUAGE sql AS $$ SELECT 0::bigint $$;
          -- Stub cron schema + minimal job table + schedule/unschedule functions (pg_cron is Supabase-managed)
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE TABLE IF NOT EXISTS cron.job (
            jobid bigserial PRIMARY KEY,
            schedule text,
            command text,
            nodename text DEFAULT 'localhost',
            nodeport integer DEFAULT 5432,
            database text DEFAULT 'postgres',
            username text DEFAULT 'postgres',
            active boolean DEFAULT true,
            jobname text UNIQUE
          );
          CREATE OR REPLACE FUNCTION cron.schedule(jobname text, schedule text, command text) RETURNS bigint LANGUAGE sql AS $$
            INSERT INTO cron.job (jobname, schedule, command) VALUES ($1, $2, $3)
            ON CONFLICT (jobname) DO UPDATE SET schedule = EXCLUDED.schedule, command = EXCLUDED.command
            RETURNING jobid;
          $$;
          CREATE OR REPLACE FUNCTION cron.schedule(schedule text, command text) RETURNS bigint LANGUAGE sql AS $$
            INSERT INTO cron.job (schedule, command) VALUES ($1, $2) RETURNING jobid;
          $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(jobname text) RETURNS boolean LANGUAGE sql AS $$
            DELETE FROM cron.job WHERE jobname = $1 RETURNING true;
          $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(jobid bigint) RETURNS boolean LANGUAGE sql AS $$
            DELETE FROM cron.job WHERE jobid = $1 RETURNING true;
          $$;
          CREATE OR REPLACE FUNCTION cron.alter_job(
            job_id bigint,
            schedule text DEFAULT NULL,
            command text DEFAULT NULL,
            database text DEFAULT NULL,
            username text DEFAULT NULL,
            active boolean DEFAULT NULL
          ) RETURNS void LANGUAGE sql AS $$
            UPDATE cron.job AS existing
            SET schedule = COALESCE($2, existing.schedule),
                command = COALESCE($3, existing.command),
                database = COALESCE($4, existing.database),
                username = COALESCE($5, existing.username),
                active = COALESCE($6, existing.active)
            WHERE existing.jobid = $1;
          $$;
          -- Stub pgmq (message queue) used by email infrastructure
          CREATE SCHEMA IF NOT EXISTS pgmq;
          CREATE OR REPLACE FUNCTION pgmq.create(queue_name text) RETURNS void LANGUAGE sql AS $$ SELECT NULL::void $$;
          CREATE OR REPLACE FUNCTION pgmq.send(queue_name text, msg jsonb, delay integer DEFAULT 0) RETURNS bigint LANGUAGE sql AS $$ SELECT 0::bigint $$;
          CREATE OR REPLACE FUNCTION pgmq.read(queue_name text, vt integer, qty integer) RETURNS TABLE (msg_id bigint, read_ct integer, enqueued_at timestamptz, vt timestamptz, message jsonb) LANGUAGE sql AS $$ SELECT NULL::bigint, NULL::integer, NULL::timestamptz, NULL::timestamptz, NULL::jsonb WHERE false $$;
          CREATE OR REPLACE FUNCTION pgmq.delete(queue_name text, msg_id bigint) RETURNS boolean LANGUAGE sql AS $$ SELECT true $$;
          CREATE OR REPLACE FUNCTION pgmq.archive(queue_name text, msg_id bigint) RETURNS boolean LANGUAGE sql AS $$ SELECT true $$;
          -- Stub supabase_vault (secrets vault) — migrations reference vault.secrets
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text UNIQUE,
            description text,
            secret text,
            key_id uuid,
            nonce bytea,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id, name, description, secret, key_id, nonce, created_at, updated_at
            FROM vault.secrets;
          SQL

      - name: Strip unavailable extensions from migrations
        run: |
          # pg_cron, pg_net, pgmq, supabase_vault are Supabase-managed and not available in bare postgres:15.
          # Remove both the IF-NOT-EXISTS form and plain CREATE EXTENSION form, plus the DO-block form used in email_infra.
          find supabase/migrations -name '*.sql' -exec sed -i -E \
            -e 's/CREATE EXTENSION (IF NOT EXISTS )?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;//g' \
            {} +
          # Remove the DO-block that conditionally creates pg_cron in email_infra
          find supabase/migrations -name '*.sql' -exec perl -i -0pe \
            's/DO \$\$ BEGIN\s+IF NOT EXISTS \(SELECT 1 FROM pg_extension WHERE extname = '"'"'pg_cron'"'"'\) THEN\s+CREATE EXTENSION pg_cron;\s+END IF;\s+END \$\$;//g' \
            {} +

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ applying $f"
            if ! docker run --rm --network host -e PGPASSWORD=postgres \
              -v "$PWD:/workspace" -w /workspace postgres:15 \
              psql -h localhost -U postgres -d maiprop_test -v ON_ERROR_STOP=1 -f "$f"; then
              echo "::error file=$f::Migration failed"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed migration(s) failed"
            exit 1
          fi

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/heads/release-please--')) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release-please--'))
    needs: [quality, release-safety]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build app
        run: npm run build

      - name: Install Lighthouse browser
        timeout-minutes: 4
        run: |
          npx playwright install chromium
          CHROME_PATH=$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun --config=.lighthouserc.public.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 30

  release-candidate-built:
    name: Immutable release candidate built
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == github.triggering_actor
    needs: [quality, release-safety, e2e, migrations-validate, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require every static release gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_SAFETY_RESULT: ${{ needs['release-safety'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          MIGRATIONS_RESULT: ${{ needs['migrations-validate'].result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY_RESULT" \
            "$RELEASE_SAFETY_RESULT" \
            "$E2E_RESULT" \
            "$MIGRATIONS_RESULT" \
            "$LIGHTHOUSE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::Immutable release candidate requires every static gate to succeed; observed '$result'."
              exit 1
            fi
          done

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate

      - name: Verify immutable release candidate
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          npm run release:artifact:verify -- \
            --dir release-candidate \
            --sha "$GITHUB_SHA" \
            --tree "$source_tree" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Create and verify immutable release candidate binding
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.quality.outputs.release_candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.quality.outputs.release_candidate_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if ! [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The release candidate upload did not return an immutable artifact ID."
            exit 1
          fi
          mkdir -p release-candidate-binding release-candidate-binding-metadata
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" \
            > release-candidate-binding-metadata/artifact.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > release-candidate-binding-metadata/run.json
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          artifact_name="production-release-candidate-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          node scripts/create-release-artifact-binding.mjs \
            --payload-root release-candidate \
            --out release-candidate-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding release-candidate-binding/release-artifact-binding.json \
            --payload-root release-candidate \
            --artifact-metadata release-candidate-binding-metadata/artifact.json \
            --producer-run release-candidate-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > release-candidate-binding/verification.json

      - name: Upload immutable release candidate binding
        id: release_candidate_binding_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-candidate-binding-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate-binding/
          if-no-files-found: error
          retention-days: 90

      - name: Record candidate readiness
        run: |
          {
            echo "### Immutable release candidate built"
            echo
            echo "Static CI passed and the exact artifact for \`${GITHUB_SHA}\` was verified."
            echo "Signed binding artifact ID: ${{ steps.release_candidate_binding_upload.outputs.artifact-id }}"
            echo "No staging or production service was mutated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  release-status:
    name: Publish Release PR CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/release-please--')
    needs:
      - quality
      - release-safety
      - e2e
      - migrations-validate
      - lighthouse
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish final release status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_SAFETY_RESULT: ${{ needs['release-safety'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          MIGRATIONS_RESULT: ${{ needs['migrations-validate'].result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          results=(
            "$QUALITY_RESULT"
            "$RELEASE_SAFETY_RESULT"
            "$E2E_RESULT"
            "$MIGRATIONS_RESULT"
            "$LIGHTHOUSE_RESULT"
          )
          state=success
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              state=failure
              break
            fi
          done

          if [[ "$state" == "success" ]]; then
            description="Release PR CI passed"
          else
            description="Release PR CI failed"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="release-please/ci" \
            -f description="$description" \
            -f target_url="$target_url" >/dev/null

          [[ "$state" == "success" ]]
