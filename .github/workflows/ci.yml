name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift check; pushes and PRs cover normal change validation.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # Format-valid stubs — real secrets are never committed.
  # URL must match https://<ref>.supabase.co; key uses Supabase's publishable-key prefix.
  VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
  VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop

jobs:
  quality:
    name: Build · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Security audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

      - name: Check committed secrets
        run: npm run check:secrets

      - name: Type-check & build
        run: npm run build

      - name: Type-check Cloudflare Pages Functions
        run: npm run typecheck:functions

      - name: Type-check Remotion video runtime
        run: npm run typecheck:remotion

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Lint migrations (idempotency for new migrations)
        run: npm run lint:migrations

      - name: Lint migrations (timestamp chronology)
        run: npm run lint:migrations:chronology

      - name: Check public edge function protections
        run: npm run check:public-functions

      - name: Check type-debt ratchet
        run: npm run check:type-debt

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # The components smoke-test file alone renders ~150 React components
          # in one process; with the default 2 GB Node heap on Linux runners
          # the V8 GC starts thrashing and OOM-kills the worker. 4 GB leaves
          # comfortable head-room. Pair this with `pool: 'forks'` in
          # vitest.config.ts so other files run in fresh processes.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Coverage
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check generated types freshness
        run: |
          TYPES_FILE="src/integrations/supabase/types.ts"
          LINES=$(wc -l < "$TYPES_FILE")
          echo "Generated types file: $LINES lines"
          if [ "$LINES" -gt 5000 ]; then
            echo "::warning file=$TYPES_FILE::Generated types file has grown to $LINES lines (threshold: 5000). Consider reviewing schema size."
          fi

      - name: SBOM generation
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 3

      - name: License compliance check
        run: |
          npx license-checker --production --failOn 'GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;MPL-1.0;MPL-1.1;MPL-2.0;EPL-1.0;EPL-2.0;CDDL-1.0;CDDL-1.1' --summary || {
            echo "::error::Found dependencies with restricted licenses (GPL/AGPL/LGPL/MPL/EPL/CDDL). Review before deploying."
            exit 1
          }

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLo "$GITLEAKS_ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "${EXPECTED_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum -c -
          tar -xzf "$GITLEAKS_ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scanning (gitleaks)
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

      - name: Deno edge function tests
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.7.12

      - name: Type-check Supabase Edge Functions
        run: npm run check:edge-functions

      - name: Run Deno tests
        working-directory: supabase/functions
        run: |
          for attempt in 1 2 3; do
            deno test --allow-env --allow-net --allow-read --allow-write . && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Deno test failed on attempt $attempt; retrying after transient dependency fetch failure..."
            sleep 10
          done

      - name: Upload dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  release-safety:
    name: Release Safety Inventory
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Detect PR Supabase deployment changes
        id: pr_supabase_changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Could not inspect PR base; deferring live Supabase checks to staging prep."
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
          echo "$changed_files"

          if grep -Eq '^(supabase/|deno\.(json|lock)$)' <<< "$changed_files"; then
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment changes detected; live schema checks will run after staging prep."
          else
            echo "has_supabase_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release safety inventory
        run: npm run check:release-safety -- --out release-safety-inventory.json

      - name: Check live Supabase function inventory
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
            steps.pr_supabase_changes.outputs.has_supabase_changes != 'true')
        run: npm run check:release-safety -- --live-functions --out release-safety-inventory-live.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_SAFETY_SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Check live Supabase advisors
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
            steps.pr_supabase_changes.outputs.has_supabase_changes != 'true')
        run: npm run check:supabase-advisor -- --fail-on-error --out supabase-advisor-summary.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Check live Supabase generated types
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
            steps.pr_supabase_changes.outputs.has_supabase_changes != 'true')
        run: npm run check:supabase-types -- -- --strict
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Check live Supabase security posture
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
            steps.pr_supabase_changes.outputs.has_supabase_changes != 'true')
        run: npm run check:live-security-posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Upload release safety inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-safety-inventory
          path: |
            release-safety-inventory*.json
            supabase-advisor-summary.json
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Run on main pushes, manual full CI, and non-draft PRs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: [quality, release-safety]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        timeout-minutes: 4
        # Hosted Ubuntu runners already include Chromium's runtime libraries for
        # our CI smoke tests. Avoid --with-deps here because it enters apt and
        # can stall on external package mirrors before tests ever start.
        run: npx playwright install chromium

      - name: Build app
        run: npm run build

      - name: Run authenticated performance gates
        run: npm run test:perf
        env:
          CI: true
          VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop

      - name: Run placeholder Supabase E2E smoke + auth tests
        timeout-minutes: 8
        run: |
          echo "This job uses placeholder Supabase env and is a UI smoke gate, not staging integration proof."
          npx playwright test --project=chromium --grep-invert @perf --reporter=line
        env:
          CI: true
          VITE_SUPABASE_URL: https://abcdefghijklmnop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
          VITE_SUPABASE_PROJECT_ID: abcdefghijklmnop
          # Auth tests skip gracefully when these secrets are not set in repo settings
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  e2e-security-staging:
    name: E2E Security (Live-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run automatically for release-bearing branches and same-repo PRs. Dependabot
    # PRs are excluded because repository secrets are intentionally unavailable.
    # Main/manual runs wait for Supabase prep so isolated staging can receive
    # migrations first. Production-only setups run with destructive checks off.
    if: >
      always() &&
      !cancelled() &&
      needs.quality.result == 'success' &&
      needs['release-safety'].result == 'success' &&
      needs['migrations-validate'].result == 'success' &&
      (
        needs['deploy-supabase-staging'].result == 'success' ||
        (github.event_name == 'pull_request' && needs['deploy-supabase-staging'].result == 'skipped')
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
          github.event.pull_request.draft == false)
      )
    needs: [quality, release-safety, migrations-validate, deploy-supabase-staging]
    env:
      CI: true
      VITE_SUPABASE_URL: ${{ needs['deploy-supabase-staging'].outputs.isolated_staging == 'true' && secrets.STAGING_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ needs['deploy-supabase-staging'].outputs.isolated_staging == 'true' && secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ needs['deploy-supabase-staging'].outputs.isolated_staging == 'true' && secrets.STAGING_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}
      RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
      RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
      RLS_USER_PASSWORD: ${{ secrets.RLS_USER_PASSWORD }}
      ONBOARDING_TEST_EMAIL: ${{ secrets.ONBOARDING_TEST_EMAIL }}
      ONBOARDING_TEST_PASSWORD: ${{ secrets.ONBOARDING_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      E2E_ALLOW_DESTRUCTIVE_LIVE_TESTS: ${{ needs['deploy-supabase-staging'].outputs.isolated_staging == 'true' && 'true' || 'false' }}
      E2E_ALLOWED_DESTRUCTIVE_PROJECT_REFS: ${{ needs['deploy-supabase-staging'].outputs.isolated_staging == 'true' && secrets.STAGING_SUPABASE_PROJECT_ID || '' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 50

      - name: Detect PR Supabase deployment changes
        id: pr_supabase_changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Could not inspect the PR base; running live-safe security checks."
            echo "has_supabase_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
          echo "$changed_files"

          if grep -Eq '^(supabase/|deno\.json$|deno\.lock$)' <<< "$changed_files"; then
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Defer live security checks
        if: steps.pr_supabase_changes.outputs.has_supabase_changes == 'true'
        run: |
          echo "This PR changes Supabase deployment files, so live security checks are deferred until mainline Supabase prep handles those changes." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        run: npm run check:runtime

      - name: Validate required live security secrets
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        run: |
          required=(
            "VITE_SUPABASE_URL"
            "VITE_SUPABASE_PUBLISHABLE_KEY"
            "VITE_SUPABASE_PROJECT_ID"
            "RLS_USER_A_EMAIL"
            "RLS_USER_B_EMAIL"
            "RLS_USER_PASSWORD"
            "ONBOARDING_TEST_EMAIL"
            "ONBOARDING_TEST_PASSWORD"
            "SUPABASE_SERVICE_ROLE_KEY"
            "SUPABASE_ACCESS_TOKEN"
          )

          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Skip live type freshness without staged DB changes
        if: needs['deploy-supabase-staging'].outputs.db_changes != 'true'
        run: echo "Live type freshness runs only after the staging database migration path is required."

      - name: Skip live type freshness without isolated staging
        if: needs['deploy-supabase-staging'].outputs.db_changes == 'true' && needs['deploy-supabase-staging'].outputs.isolated_staging != 'true'
        run: echo "No isolated staging Supabase project is configured; live type freshness is deferred to the production DB deployment workflow."

      - name: Check generated Supabase types against isolated staging
        if: needs['deploy-supabase-staging'].outputs.db_changes == 'true' && needs['deploy-supabase-staging'].outputs.isolated_staging == 'true'
        run: |
          if ! node scripts/check-supabase-types-freshness.cjs --strict; then
            echo "::warning title=Staging Supabase type drift::Staging generated types differ from the committed production types. Staging migration apply, advisors, security posture, and edge function deploy remain hard gates."
            {
              echo "### Staging Supabase type drift"
              echo ""
              echo "The isolated staging project generated types differ from the committed production-source types."
              echo "This is recorded as staging environment drift and should be resolved by rebuilding/reconciling staging, not by replacing production-generated source types."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Playwright browsers
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        timeout-minutes: 4
        # Hosted Ubuntu runners already include Chromium's runtime libraries for
        # our CI smoke tests. Avoid --with-deps here because it enters apt and
        # can stall on external package mirrors before tests ever start.
        run: npx playwright install chromium

      - name: Build app
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        run: npm run build

      - name: Run live-safe RLS + onboarding + GDPR security tests
        if: steps.pr_supabase_changes.outputs.has_supabase_changes != 'true'
        run: npx playwright test --project=chromium e2e/rls-security.spec.ts e2e/onboarding-role-selection.spec.ts e2e/gdpr-delete-account.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-security-staging
          path: playwright-report/
          retention-days: 3

  migrations-validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    needs: [quality, release-safety]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maiprop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d maiprop_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          -- Supabase built-in roles used by RLS policies
          DO $$ BEGIN
            CREATE ROLE authenticated; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE anon; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE service_role; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          -- Stub auth.users with full Supabase column set
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text UNIQUE,
            encrypted_password text,
            email_confirmed_at timestamptz,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            raw_app_meta_data jsonb DEFAULT '{}'::jsonb,
            role text,
            aud text,
            phone text,
            phone_confirmed_at timestamptz,
            last_sign_in_at timestamptz,
            is_super_admin boolean DEFAULT false,
            banned_until timestamptz,
            deleted_at timestamptz
          );
          -- Stub auth.uid() used by RLS policies
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT 'anon'::text $$;
          -- Stub storage schema — migrations reference storage.buckets / storage.objects
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            public boolean DEFAULT false,
            avif_autodetection boolean DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          ALTER TABLE storage.buckets ENABLE ROW LEVEL SECURITY;
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text REFERENCES storage.buckets(id),
            name text,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            last_accessed_at timestamptz DEFAULT now(),
            metadata jsonb,
            path_tokens text[]
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          -- Supabase storage helper functions used in policies
          CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql AS $$ SELECT string_to_array(name, '/') $$;
          CREATE OR REPLACE FUNCTION storage.filename(name text) RETURNS text LANGUAGE sql AS $$ SELECT (string_to_array(name, '/'))[array_length(string_to_array(name, '/'), 1)] $$;
          CREATE OR REPLACE FUNCTION storage.extension(name text) RETURNS text LANGUAGE sql AS $$ SELECT reverse(split_part(reverse(name), '.', 1)) $$;
          -- Stub extensions schema used by pg_net SCHEMA extensions
          CREATE SCHEMA IF NOT EXISTS extensions;
          -- Stub cron schema + minimal job table + schedule/unschedule functions (pg_cron is Supabase-managed)
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE TABLE IF NOT EXISTS cron.job (
            jobid bigserial PRIMARY KEY,
            schedule text,
            command text,
            nodename text DEFAULT 'localhost',
            nodeport integer DEFAULT 5432,
            database text DEFAULT 'postgres',
            username text DEFAULT 'postgres',
            active boolean DEFAULT true,
            jobname text UNIQUE
          );
          CREATE OR REPLACE FUNCTION cron.schedule(jobname text, schedule text, command text) RETURNS bigint LANGUAGE sql AS $$
            INSERT INTO cron.job (jobname, schedule, command) VALUES ($1, $2, $3)
            ON CONFLICT (jobname) DO UPDATE SET schedule = EXCLUDED.schedule, command = EXCLUDED.command
            RETURNING jobid;
          $$;
          CREATE OR REPLACE FUNCTION cron.schedule(schedule text, command text) RETURNS bigint LANGUAGE sql AS $$
            INSERT INTO cron.job (schedule, command) VALUES ($1, $2) RETURNING jobid;
          $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(jobname text) RETURNS boolean LANGUAGE sql AS $$
            DELETE FROM cron.job WHERE jobname = $1 RETURNING true;
          $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(jobid bigint) RETURNS boolean LANGUAGE sql AS $$
            DELETE FROM cron.job WHERE jobid = $1 RETURNING true;
          $$;
          -- Stub pgmq (message queue) used by email infrastructure
          CREATE SCHEMA IF NOT EXISTS pgmq;
          CREATE OR REPLACE FUNCTION pgmq.create(queue_name text) RETURNS void LANGUAGE sql AS $$ SELECT NULL::void $$;
          CREATE OR REPLACE FUNCTION pgmq.send(queue_name text, msg jsonb, delay integer DEFAULT 0) RETURNS bigint LANGUAGE sql AS $$ SELECT 0::bigint $$;
          CREATE OR REPLACE FUNCTION pgmq.read(queue_name text, vt integer, qty integer) RETURNS TABLE (msg_id bigint, read_ct integer, enqueued_at timestamptz, vt timestamptz, message jsonb) LANGUAGE sql AS $$ SELECT NULL::bigint, NULL::integer, NULL::timestamptz, NULL::timestamptz, NULL::jsonb WHERE false $$;
          CREATE OR REPLACE FUNCTION pgmq.delete(queue_name text, msg_id bigint) RETURNS boolean LANGUAGE sql AS $$ SELECT true $$;
          CREATE OR REPLACE FUNCTION pgmq.archive(queue_name text, msg_id bigint) RETURNS boolean LANGUAGE sql AS $$ SELECT true $$;
          -- Stub supabase_vault (secrets vault) — migrations reference vault.secrets
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text UNIQUE,
            description text,
            secret text,
            key_id uuid,
            nonce bytea,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          SQL

      - name: Strip unavailable extensions from migrations
        run: |
          # pg_cron, pg_net, pgmq, supabase_vault are Supabase-managed and not available in bare postgres:15.
          # Remove both the IF-NOT-EXISTS form and plain CREATE EXTENSION form, plus the DO-block form used in email_infra.
          find supabase/migrations -name '*.sql' -exec sed -i -E \
            -e 's/CREATE EXTENSION (IF NOT EXISTS )?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;//g' \
            {} +
          # Remove the DO-block that conditionally creates pg_cron in email_infra
          find supabase/migrations -name '*.sql' -exec perl -i -0pe \
            's/DO \$\$ BEGIN\s+IF NOT EXISTS \(SELECT 1 FROM pg_extension WHERE extname = '"'"'pg_cron'"'"'\) THEN\s+CREATE EXTENSION pg_cron;\s+END IF;\s+END \$\$;//g' \
            {} +

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ applying $f"
            if ! psql -h localhost -U postgres -d maiprop_test -v ON_ERROR_STOP=1 -f "$f"; then
              echo "::error file=$f::Migration failed"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed migration(s) failed"
            exit 1
          fi

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release-please--'))
    needs: [quality, release-safety]
    env:
      # Lighthouse audits protected app surfaces. Prefer isolated staging when
      # configured, otherwise use the production app test accounts.
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}
      LIGHTHOUSE_AUTH_EMAIL: ${{ secrets.E2E_SELLER_PRO_EMAIL }}
      LIGHTHOUSE_AUTH_PASSWORD: ${{ secrets.E2E_SELLER_PRO_PASSWORD }}
      LIGHTHOUSE_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      LIGHTHOUSE_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate Lighthouse authenticated audit secrets
        id: lighthouse-secrets
        run: |
          required=(
            "VITE_SUPABASE_URL"
            "VITE_SUPABASE_PUBLISHABLE_KEY"
            "VITE_SUPABASE_PROJECT_ID"
            "LIGHTHOUSE_AUTH_EMAIL"
            "LIGHTHOUSE_AUTH_PASSWORD"
            "LIGHTHOUSE_ADMIN_EMAIL"
            "LIGHTHOUSE_ADMIN_PASSWORD"
          )
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Lighthouse secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Authenticated Lighthouse audit secrets are required for same-repo PR and main gates."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build app
        if: steps.lighthouse-secrets.outputs.enabled == 'true'
        run: npm run build

      - name: Install Lighthouse browser
        if: steps.lighthouse-secrets.outputs.enabled == 'true'
        timeout-minutes: 4
        run: |
          npx playwright install chromium
          CHROME_PATH=$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        if: steps.lighthouse-secrets.outputs.enabled == 'true'
        run: npx @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, release-safety, e2e, e2e-security-staging, migrations-validate, lighthouse]
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false

    env:
      CF_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT:     maiprop-listing-site
      CF_API_BASE:    https://api.cloudflare.com/client/v4

    steps:
      - name: Checkout (for Pages Functions in functions/)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Production build uses *real* Supabase + optional service secrets so the
      # deployed bundle can actually talk to the live backend. The earlier
      # `quality` job build (which produced the artifact used by E2E tests) used
      # placeholder values — we intentionally throw that artifact away here and
      # rebuild with the real values. These Vite vars are baked into the bundle
      # at build time, so they must be present in the build environment.
      - name: Build app with production environment
        run: npm run build
        env:
          # Required — app refuses to start without these.
          VITE_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID:      ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # Optional — features degrade gracefully when empty.
          VITE_MAPBOX_TOKEN:             ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_SENTRY_DSN:               ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PRO_PRODUCT_ID:    ${{ secrets.VITE_STRIPE_PRO_PRODUCT_ID }}
          VITE_TURNSTILE_SITE_KEY:       ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_PLAUSIBLE_DOMAIN:         ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_APP_URL:                  ${{ secrets.VITE_APP_URL }}

      - name: Capture current production deployment ID (for rollback)
        id: prev_deploy
        continue-on-error: true
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/cf_prev_deployments.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$CF_API_BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?env=production&per_page=20")
          if [ "$HTTP_CODE" != "200" ] || ! jq -e '.success == true' /tmp/cf_prev_deployments.json >/dev/null; then
            echo "::warning::Could not capture Cloudflare rollback candidate (HTTP $HTTP_CODE)."
            cat /tmp/cf_prev_deployments.json
            exit 1
          fi
          PREV_ID=$(jq -r '
            .result
            | map(select(.environment == "production" and .latest_stage.status == "success" and (.is_skipped | not)))
            | .[0].id // empty
          ' /tmp/cf_prev_deployments.json)
          echo "id=${PREV_ID}" >> "$GITHUB_OUTPUT"
          echo "Previous successful production deployment: ${PREV_ID:-<none>}"

      # Pages Functions run on Cloudflare Workers and read env vars from the
      # Pages *project* settings (NOT from the GitHub Actions env and NOT from
      # the built Vite bundle). Sync the runtime bindings from GitHub secrets
      # so functions/sitemap-dynamic.xml.ts can resolve SUPABASE_PROJECT_ID on
      # every request, the SEO Pages Functions can read public listing data via
      # SUPABASE_PUBLISHABLE_KEY, and functions/_middleware.ts can resolve the
      # optional SITE_LOCK_PASSWORD for the pre-launch passcode gate.
      - name: Sync Cloudflare Pages runtime environment variables
        env:
          SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_ID:       ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_PUBLISHABLE_KEY:  ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SITE_LOCK_PASSWORD:        ${{ secrets.SITE_LOCK_PASSWORD }}
        run: |
          set -euo pipefail
          if ! NORMALIZED_SUPABASE_PROJECT_ID=$(node - "$SUPABASE_PROJECT_ID" "$SUPABASE_URL" <<'NODE'
          const [, , explicitProjectId = "", supabaseUrl = ""] = process.argv;
          const validProjectRef = (value) => /^[a-z0-9]{20}$/.test(value);
          if (validProjectRef(explicitProjectId)) {
            console.log(explicitProjectId);
            process.exit(0);
          }
          try {
            const host = new URL(supabaseUrl).hostname;
            const suffix = ".supabase.co";
            const derived = host.endsWith(suffix) ? host.slice(0, -suffix.length) : "";
            if (validProjectRef(derived)) {
              console.log(derived);
              process.exit(0);
            }
          } catch {
            // Fall through to the deployment error below.
          }
          process.exit(1);
          NODE
          ); then
            echo "::error::VITE_SUPABASE_PROJECT_ID must be a 20-character project ref or VITE_SUPABASE_URL must be a valid https://<ref>.supabase.co URL."
            exit 1
          fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY secret is required for production Pages Functions."
            exit 1
          fi

          # Build env_vars payload. SITE_LOCK_PASSWORD is optional; when the
          # GitHub secret is absent, send a null binding so Cloudflare removes
          # any previously stored passcode instead of preserving stale state.
          # `secret_text` stores the value encrypted-at-rest on Cloudflare's side.
          ENV_JSON=$(jq -n \
            --arg surl "$SUPABASE_URL" \
            --arg pid "$NORMALIZED_SUPABASE_PROJECT_ID" \
            --arg pkey "$SUPABASE_PUBLISHABLE_KEY" \
            --arg lock "$SITE_LOCK_PASSWORD" \
            '
            ({} +
              (if $surl != "" then {
                SUPABASE_URL: { value: $surl, type: "plain_text" },
                VITE_SUPABASE_URL: { value: $surl, type: "plain_text" }
              } else {} end) +
              (if $pid  != "" then {
                SUPABASE_PROJECT_ID: { value: $pid, type: "plain_text" },
                VITE_SUPABASE_PROJECT_ID: { value: $pid, type: "plain_text" }
              } else {} end) +
              (if $pkey != "" then {
                SUPABASE_PUBLISHABLE_KEY: { value: $pkey, type: "plain_text" },
                VITE_SUPABASE_PUBLISHABLE_KEY: { value: $pkey, type: "plain_text" },
                VITE_SUPABASE_ANON_KEY: { value: $pkey, type: "plain_text" }
              } else {} end) +
              (if $lock != "" then { SITE_LOCK_PASSWORD: { value: $lock, type: "secret_text" } } else { SITE_LOCK_PASSWORD: null } end)
            )')

          PAYLOAD=$(jq -n --argjson env "$ENV_JSON" '{
            deployment_configs: { production: { env_vars: $env } }
          }')

          HTTP_CODE=$(curl -s -o /tmp/cf_env.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$CF_API_BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to sync Pages env vars (HTTP $HTTP_CODE)"
            cat /tmp/cf_env.json
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/cf_env_verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$CF_API_BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to verify Pages env vars (HTTP $HTTP_CODE)"
            cat /tmp/cf_env_verify.json
            exit 1
          fi
          for key in SUPABASE_URL VITE_SUPABASE_URL SUPABASE_PROJECT_ID VITE_SUPABASE_PROJECT_ID SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_ANON_KEY; do
            if ! jq -e --arg key "$key" '.success == true and (.result.deployment_configs.production.env_vars[$key].type == "plain_text")' /tmp/cf_env_verify.json >/dev/null; then
              echo "::error::Cloudflare Pages production env var $key was not persisted."
              exit 1
            fi
          done
          if ! jq -e --arg pid "$NORMALIZED_SUPABASE_PROJECT_ID" '.result.deployment_configs.production.env_vars.SUPABASE_PROJECT_ID.value == $pid' /tmp/cf_env_verify.json >/dev/null; then
            echo "::error::Cloudflare Pages production SUPABASE_PROJECT_ID did not match the normalized project ref."
            exit 1
          fi
          if [ -n "${SITE_LOCK_PASSWORD}" ]; then
            echo "Pages production env vars synced (site lock: ENABLED)"
          else
            echo "Pages production env vars synced (site lock: disabled)"
          fi
          toml_quote() {
            jq -Rn --arg value "$1" '$value'
          }
          {
            echo 'name = "maiprop-listing-site"'
            echo 'pages_build_output_dir = "./dist"'
            echo 'compatibility_date = "2026-05-19"'
            echo
            echo '[vars]'
            printf 'SUPABASE_URL = %s\n' "$(toml_quote "$SUPABASE_URL")"
            printf 'VITE_SUPABASE_URL = %s\n' "$(toml_quote "$SUPABASE_URL")"
            printf 'SUPABASE_PROJECT_ID = %s\n' "$(toml_quote "$NORMALIZED_SUPABASE_PROJECT_ID")"
            printf 'VITE_SUPABASE_PROJECT_ID = %s\n' "$(toml_quote "$NORMALIZED_SUPABASE_PROJECT_ID")"
            printf 'SUPABASE_PUBLISHABLE_KEY = %s\n' "$(toml_quote "$SUPABASE_PUBLISHABLE_KEY")"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY = %s\n' "$(toml_quote "$SUPABASE_PUBLISHABLE_KEY")"
            printf 'VITE_SUPABASE_ANON_KEY = %s\n' "$(toml_quote "$SUPABASE_PUBLISHABLE_KEY")"
            if [ -n "${SITE_LOCK_PASSWORD}" ]; then
              printf 'SITE_LOCK_PASSWORD = %s\n' "$(toml_quote "$SITE_LOCK_PASSWORD")"
            fi
          } > wrangler.toml
          echo "Wrangler runtime config prepared for Pages Functions deployment"

      - name: Install deploy smoke browser
        timeout-minutes: 4
        # Keep production deploy checks from waiting on apt mirrors; the browser
        # binary is enough on hosted Ubuntu for the post-deploy smoke test.
        run: npx playwright install chromium

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:    pages deploy dist --project-name=maiprop-listing-site --branch=main --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }} --commit-dirty=true

      - name: Post-deploy health check
        id: health_check
        run: npm run check:production-deploy -- https://portal.maiprop.co --browser --public-api

      - name: Rollback on health check failure
        if: failure() && steps.health_check.outcome == 'failure' && steps.prev_deploy.outputs.id != ''
        run: |
          set -euo pipefail
          ROLLBACK_ID="${{ steps.prev_deploy.outputs.id }}"
          echo "Rolling back to deployment ${ROLLBACK_ID}"
          HTTP_CODE=$(curl -sS -o /tmp/cf_rollback.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$CF_API_BASE/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/${ROLLBACK_ID}/rollback")
          if [ "$HTTP_CODE" != "200" ] || ! jq -e '.success == true' /tmp/cf_rollback.json >/dev/null; then
            echo "::error::Cloudflare rollback failed with HTTP $HTTP_CODE"
            cat /tmp/cf_rollback.json
            exit 1
          fi
          ROLLED_BACK_ID=$(jq -r '.result.id // empty' /tmp/cf_rollback.json)
          echo "Rollback API accepted deployment: ${ROLLED_BACK_ID:-$ROLLBACK_ID}"
          npm run check:production-deploy -- https://portal.maiprop.co --browser --public-api

  deploy-supabase-staging:
    name: Prepare Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep deployments out of arbitrary PRs. If an isolated staging Supabase
    # project exists, it receives mainline/manual DB and function updates after
    # quality gates pass. Production-only setups use this as a no-op ordering
    # point and keep production Supabase changes in protected manual flows.
    needs: [quality, release-safety, migrations-validate]
    outputs:
      deploy: ${{ steps.supabase_changes.outputs.deploy }}
      db_changes: ${{ steps.supabase_changes.outputs.db_changes }}
      isolated_staging: ${{ steps.supabase_target.outputs.isolated_staging }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect Supabase deployment changes
        id: supabase_changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "db_changes=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Supabase prep enabled."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.event.pull_request.base.repo.full_name }}" ] ||
               [ "${{ github.event.pull_request.draft }}" = "true" ] ||
               [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ] ||
               [[ "${{ github.event.pull_request.head.ref }}" == release-please--* ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "db_changes=false" >> "$GITHUB_OUTPUT"
              echo "PR is not eligible for isolated Supabase staging prep."
              exit 0
            fi

            base="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            fi

            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning::Could not inspect the PR base; enabling Supabase prep."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "db_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
            echo "$changed_files"

            if grep -Eq '^supabase/migrations/' <<< "$changed_files"; then
              echo "db_changes=true" >> "$GITHUB_OUTPUT"
              echo "Supabase migration changes detected."
            else
              echo "db_changes=false" >> "$GITHUB_OUTPUT"
            fi

            if grep -Eq '^(supabase/|deno\.(json|lock)$)' <<< "$changed_files"; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "Supabase changes detected."
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "No Supabase DB/function changes detected: Supabase prep skipped."
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "db_changes=false" >> "$GITHUB_OUTPUT"
            echo "Not a mainline push: Supabase prep skipped."
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${{ github.ref_name }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Could not inspect the previous commit; enabling Supabase prep."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "db_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
          echo "$changed_files"

          if grep -Eq '^supabase/migrations/' <<< "$changed_files"; then
            echo "db_changes=true" >> "$GITHUB_OUTPUT"
            echo "Supabase migration changes detected."
          else
            echo "db_changes=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(supabase/|deno\.(json|lock)$)' <<< "$changed_files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Supabase changes detected."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase DB/function changes detected: Supabase prep skipped."
          fi

      - name: Resolve Supabase staging target
        id: supabase_target
        run: |
          set -euo pipefail

          if [ -z "$STAGING_SUPABASE_PROJECT_ID" ]; then
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "No isolated staging Supabase project is configured, so staging DB/function deploy steps are skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          missing=()
          [ -z "$STAGING_SUPABASE_URL" ] && missing+=("STAGING_SUPABASE_URL")
          [ -z "$STAGING_SUPABASE_PUBLISHABLE_KEY" ] && missing+=("STAGING_SUPABASE_PUBLISHABLE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Supabase staging project ref is set, but required staging runtime secrets are missing: ${missing[*]}."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "Staging project ref is configured, but required staging runtime secrets are missing: ${missing[*]}."
              echo "Staging DB/function deploy and preview deploy steps are skipped until the runtime points to the same isolated project."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$PRODUCTION_SUPABASE_PROJECT_ID" ] && [ "$STAGING_SUPABASE_PROJECT_ID" = "$PRODUCTION_SUPABASE_PROJECT_ID" ]; then
            echo "::warning::STAGING_SUPABASE_PROJECT_ID matches production; skipping staging DB/function deploy steps to avoid mutating production under a staging label."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "STAGING_SUPABASE_PROJECT_ID matches production. Staging DB/function deploy steps are skipped."
              echo "Use the production Supabase DB and edge-function deployment workflows for intentional production changes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$PRODUCTION_SUPABASE_URL" ] && [ "$STAGING_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::warning::STAGING_SUPABASE_URL matches production; skipping staging DB/function deploy steps to keep preview traffic off production."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "STAGING_SUPABASE_URL matches production. Staging and preview deploy steps are skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" ] && [ "$STAGING_SUPABASE_PUBLISHABLE_KEY" = "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::STAGING_SUPABASE_PUBLISHABLE_KEY matches production; skipping staging DB/function deploy steps to keep preview traffic off production."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "STAGING_SUPABASE_PUBLISHABLE_KEY matches production. Staging and preview deploy steps are skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! STAGING_URL_PROJECT_ID=$(node - "$STAGING_SUPABASE_URL" <<'NODE'
          const [, , supabaseUrl = ""] = process.argv;
          const validProjectRef = (value) => /^[a-z0-9]{20}$/.test(value);
          try {
            const host = new URL(supabaseUrl).hostname;
            const suffix = ".supabase.co";
            const derived = host.endsWith(suffix) ? host.slice(0, -suffix.length) : "";
            if (validProjectRef(derived)) {
              console.log(derived);
              process.exit(0);
            }
          } catch {
            // Fall through to the deployment warning below.
          }
          process.exit(1);
          NODE
          ); then
            echo "::warning::STAGING_SUPABASE_URL must be a valid https://<ref>.supabase.co URL; skipping staging deploy steps."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "STAGING_SUPABASE_URL is not a valid Supabase project URL. Staging and preview deploy steps are skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STAGING_URL_PROJECT_ID" != "$STAGING_SUPABASE_PROJECT_ID" ]; then
            echo "::warning::STAGING_SUPABASE_URL project ref does not match STAGING_SUPABASE_PROJECT_ID; skipping staging deploy steps."
            echo "isolated_staging=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supabase staging"
              echo "STAGING_SUPABASE_URL and STAGING_SUPABASE_PROJECT_ID point to different projects. Staging and preview deploy steps are skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "isolated_staging=true" >> "$GITHUB_OUTPUT"
          echo "Isolated staging Supabase project detected."
        env:
          STAGING_SUPABASE_PROJECT_ID:         ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL:                ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY:    ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_PROJECT_ID:      ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          PRODUCTION_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Skip Supabase prep
        if: steps.supabase_changes.outputs.deploy != 'true'
        run: echo "Supabase prep not required for this event or file set."

      - name: Skip Supabase deploy without isolated staging
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging != 'true'
        run: echo "Supabase changes were detected, but no isolated staging project is configured. Production Supabase changes remain manual."

      - name: Validate isolated staging secrets
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: |
          required=(
            "STAGING_SUPABASE_PROJECT_ID"
            "STAGING_SUPABASE_URL"
            "STAGING_SUPABASE_PUBLISHABLE_KEY"
            "SUPABASE_ACCESS_TOKEN"
          )
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "${{ steps.supabase_changes.outputs.db_changes }}" = "true" ] && [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is required when Supabase migrations change; staging cannot be verified against stale schema."
            exit 1
          fi
        env:
          STAGING_SUPABASE_PROJECT_ID:      ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL:             ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_STAGING_DB_URL:          ${{ secrets.SUPABASE_STAGING_DB_URL }}
          SUPABASE_ACCESS_TOKEN:            ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: npm run check:runtime

      - name: Install dependencies
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Setup Supabase CLI
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.104.0

      - name: Check staging database migration secret
        if: steps.supabase_changes.outputs.db_changes == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        id: staging_db
        run: |
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is required when Supabase migrations change."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}

      - name: Resolve staging database URL
        if: steps.supabase_changes.outputs.db_changes == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: |
          set -euo pipefail

          projects_json="$(supabase projects list --output json)"
          resolved_url="$(PROJECTS_JSON="$projects_json" node <<'NODE'
          const directUrl = process.env.SUPABASE_STAGING_DB_URL;
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_ID;
          const projects = JSON.parse(process.env.PROJECTS_JSON || "[]");

          if (!directUrl) {
            throw new Error("SUPABASE_STAGING_DB_URL is required");
          }
          if (!projectRef) {
            throw new Error("STAGING_SUPABASE_PROJECT_ID is required");
          }

          const current = new URL(directUrl);
          if (current.hostname.endsWith(".pooler.supabase.com")) {
            process.stdout.write(current.toString());
            process.exit(0);
          }
          if (!/^db\.[a-z0-9]+\.supabase\.co$/.test(current.hostname)) {
            process.stdout.write(current.toString());
            process.exit(0);
          }

          const project = projects.find((candidate) => candidate.ref === projectRef || candidate.id === projectRef);
          if (!project?.region) {
            throw new Error(`Could not resolve Supabase region for staging project ${projectRef}`);
          }

          const pooler = new URL("postgresql://postgres:postgres@example.invalid/postgres");
          pooler.username = `postgres.${projectRef}`;
          pooler.password = decodeURIComponent(current.password);
          pooler.hostname = `aws-0-${project.region}.pooler.supabase.com`;
          pooler.port = "5432";
          pooler.searchParams.set("sslmode", "require");
          process.stdout.write(pooler.toString());
          NODE
          )"

          echo "::add-mask::$resolved_url"
          echo "SUPABASE_STAGING_EFFECTIVE_DB_URL=$resolved_url" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Dry-run staging database migrations
        if: steps.supabase_changes.outputs.db_changes == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: supabase db push --db-url "$SUPABASE_STAGING_EFFECTIVE_DB_URL" --dry-run --include-all

      - name: Apply database migrations to staging
        if: steps.supabase_changes.outputs.db_changes == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: supabase db push --db-url "$SUPABASE_STAGING_EFFECTIVE_DB_URL" --yes --include-all

      - name: Check staging Supabase advisors
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: npm run check:supabase-advisor -- --fail-on-error --out supabase-advisor-staging-summary.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Check staging Supabase generated types
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: |
          if ! npm run check:supabase-types -- -- --strict; then
            echo "::warning title=Staging Supabase type drift::Staging generated types differ from the committed production types. Migration replay, staging apply, advisors, and security posture remain hard gates."
            {
              echo "### Staging Supabase type drift"
              echo ""
              echo "The isolated staging project generated types differ from the committed production-source types."
              echo "This is recorded as staging environment drift, not accepted as source-of-truth type output."
              echo "Blocking gates still cover clean migration replay, staging migration apply, advisors, security posture, edge function deploy, preview deploy, and E2E security."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Check staging Supabase security posture
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: npm run check:live-security-posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Deploy edge functions to staging
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: |
          supabase functions deploy \
            --project-ref "$STAGING_SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN:         ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID:   ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Capture staging live function drift inventory
        if: steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        run: npm run check:release-safety -- --live-functions --out release-safety-staging-live-functions.json
        env:
          SUPABASE_ACCESS_TOKEN:                 ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_SAFETY_SUPABASE_PROJECT_REF:   ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Upload staging live drift inventory
        if: always() && steps.supabase_changes.outputs.deploy == 'true' && steps.supabase_target.outputs.isolated_staging == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-safety-staging-live-functions
          path: |
            release-safety-staging-live-functions.json
            supabase-advisor-staging-summary.json
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    name: Deploy to Cloudflare Pages (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip for Dependabot PRs — secrets are unavailable to bot-generated PRs
    # by default and Wrangler will fail with "CLOUDFLARE_API_TOKEN not set".
    # Dependabot bumps are validated by quality + e2e checks; a preview deploy
    # adds no value there. Human PRs get previews only when the Supabase
    # runtime has been proven to point at an isolated staging project.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      needs['deploy-supabase-staging'].outputs.isolated_staging == 'true'
    needs: [quality, release-safety, deploy-supabase-staging]

    steps:
      - name: Checkout (for Pages Functions in functions/)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build app with staging environment
        run: npm run build
        env:
          VITE_SUPABASE_URL:             ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID:      ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          VITE_MAPBOX_TOKEN:             ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_SENTRY_DSN:               ${{ secrets.VITE_SENTRY_DSN }}
          VITE_STRIPE_PRO_PRODUCT_ID:    ${{ secrets.VITE_STRIPE_PRO_PRODUCT_ID }}
          VITE_TURNSTILE_SITE_KEY:       ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_PLAUSIBLE_DOMAIN:         ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_APP_URL:                  ${{ secrets.VITE_APP_URL }}

      - name: Deploy to Cloudflare Pages (PR preview)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys under a preview branch named after the PR head ref so each
          # PR gets a deterministic preview URL like:
          #   https://<branch>.maiprop-listing-site.pages.dev
          command:    pages deploy dist --project-name=maiprop-listing-site --branch=${{ github.head_ref }} --commit-dirty=true
