name: Reusable Cloudflare Production Deploy

on:
  workflow_call:
    inputs:
      release_sha:
        description: Immutable repository commit submitted for validation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-disabled:
    name: Production Cloudflare deployment disabled
    runs-on: ubuntu-latest
    steps:
      - name: Reject production Cloudflare mutation
        run: |
          echo "::error::Production Cloudflare mutations are disabled. The eventual workflow must promote the exact staged artifact without rebuilding it."
          exit 1

  deploy:
    name: Production Cloudflare mutation hard-disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      PRODUCTION_MUTATIONS_DISABLED: "true"
    steps:
      - run: exit 1
