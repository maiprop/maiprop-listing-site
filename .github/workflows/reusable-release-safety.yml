name: Reusable Release Safety

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-safety:
    name: Release Safety Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Detect PR Supabase deployment changes
        id: pr_supabase_changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Could not inspect PR base; deferring live Supabase checks to staging prep."
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
          echo "$changed_files"

          if grep -Eq '^(supabase/|deno\.(json|lock)$)' <<< "$changed_files"; then
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment changes detected; live schema checks will run after staging prep."
          else
            echo "has_supabase_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release safety inventory
        run: npm run check:release-safety -- --out release-safety-inventory.json

      - name: Check live Supabase function inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:release-safety -- --live-functions --out release-safety-inventory-live.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_SAFETY_SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Capture live Supabase index stats
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run capture:supabase-index-stats -- --out supabase-index-stats.json --allow-empty-when-unconfigured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check live Supabase advisors
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:supabase-advisor -- --fail-on-error --fail-on-unknown --allow-transient-unavailable --index-stats supabase-index-stats.json --out supabase-advisor-summary.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Check live Supabase generated types
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:supabase-types -- -- --strict --allow-transient-unavailable
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Check live Supabase security posture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:live-security-posture -- --allow-transient-unavailable
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Upload release safety inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-safety-inventory
          path: |
            release-safety-inventory*.json
            supabase-index-stats.json
            supabase-advisor-summary.json
          if-no-files-found: ignore
          retention-days: 3
