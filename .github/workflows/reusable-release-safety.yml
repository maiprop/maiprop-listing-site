name: Reusable Release Safety

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-safety:
    name: Release Safety Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Detect PR Supabase deployment changes
        id: pr_supabase_changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Could not inspect PR base; deferring live Supabase checks to staging prep."
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}" || true)"
          echo "$changed_files"

          if grep -Eq '^(supabase/|deno\.(json|lock)$)' <<< "$changed_files"; then
            echo "has_supabase_changes=true" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment changes detected; live schema checks will run after staging prep."
          else
            echo "has_supabase_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release safety inventory
        run: npm run check:release-safety -- --out release-safety-inventory.json

      - name: Upload release safety inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-safety-inventory
          path: release-safety-inventory.json
          if-no-files-found: ignore
          retention-days: 3
