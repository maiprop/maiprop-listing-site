name: Verify Stripe Live Readiness

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stripe-live-readiness-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  verify-stripe-readiness:
    name: Verify exact-SHA Stripe live catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject non-main, rerun, or substituted actor execution
        if: ${{ github.ref != 'refs/heads/main' || github.run_attempt != 1 || github.actor != github.triggering_actor }}
        run: |
          echo "::error::Stripe readiness requires main, run attempt 1, and actor == triggering_actor."
          exit 1

      - name: Validate exact current main release
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be an exact lowercase 40-character Git SHA."
            exit 1
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::release_sha is not the current main SHA."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$RELEASE_SHA" ] ||
             [ "$GITHUB_WORKFLOW_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::The workflow and dispatch source must equal the requested release SHA."
            exit 1
          fi

      - name: Check out the exact release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact checkout identity
        id: checkout
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ] ||
             ! [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Exact release checkout validation failed."
            exit 1
          fi
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Produce and verify read-only Stripe live evidence
        env:
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.checkout.outputs.source_tree }}
          RELEASE_EVIDENCE_NONCE: ${{ github.run_id }}:${{ github.run_attempt }}:${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/check-stripe-live-migration.mjs --evidence-json \
            > stripe-live-migration-evidence.json
          node scripts/verify-stripe-live-migration-evidence.mjs \
            --evidence stripe-live-migration-evidence.json \
            --release-sha "$RELEASE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-nonce "$RELEASE_EVIDENCE_NONCE" \
            > stripe-live-migration-verification.json
          jq -e '.ok == true and (.issues | length) == 0' \
            stripe-live-migration-evidence.json > /dev/null

      - name: Revalidate current main before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::main advanced during Stripe readiness verification; evidence will not be published."
            exit 1
          fi

      - name: Upload immutable Stripe live readiness evidence
        id: stripe_evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-live-readiness-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: stripe-live-migration-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Create and same-run verify HMAC evidence binding
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.stripe_evidence_upload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.stripe_evidence_upload.outputs.artifact-digest }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.checkout.outputs.source_tree }}
        run: |
          set -euo pipefail
          if ! [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The Stripe readiness upload did not return immutable artifact identity."
            exit 1
          fi
          artifact_name="stripe-live-readiness-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p stripe-live-readiness-binding stripe-live-readiness-binding-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > stripe-live-readiness-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > stripe-live-readiness-binding-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root stripe-live-migration-evidence.json \
            --out stripe-live-readiness-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/verify-stripe-live-readiness.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding stripe-live-readiness-binding/release-artifact-binding.json \
            --payload-root stripe-live-migration-evidence.json \
            --artifact-metadata stripe-live-readiness-binding-metadata/artifact.json \
            --producer-run stripe-live-readiness-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/verify-stripe-live-readiness.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > stripe-live-readiness-binding/verification.json

      - name: Upload immutable Stripe readiness binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-live-readiness-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-binding
          path: stripe-live-readiness-binding/
          if-no-files-found: error
          retention-days: 90
