name: Verify Stripe Live Readiness

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character current main SHA"
        required: true
        type: string
      confirm:
        description: "Type VERIFY_STRIPE_LIVE_READINESS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maiprop-stripe-live-readiness
  cancel-in-progress: false

jobs:
  verify-live-catalogue:
    name: Verify exact-SHA Stripe live catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed on reruns or substituted actors
        if: ${{ github.run_attempt != 1 || github.actor != github.triggering_actor }}
        run: |
          echo "::error::Stripe live readiness cannot run from a rerun or a substituted actor."
          exit 1

      - name: Reject reruns and substituted actors
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRM: ${{ inputs.confirm }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTORS: ${{ vars.PRODUCTION_RELEASE_APPROVERS }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/verify-stripe-live-readiness.yml@refs/heads/main"
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$CONFIRM" != "VERIFY_STRIPE_LIVE_READINESS" ] ||
             [ "$RUN_ATTEMPT" != "1" ] ||
             [ "$ACTOR" != "$TRIGGERING_ACTOR" ] ||
             [ "$EVENT_SHA" != "$RELEASE_SHA" ] ||
             [ "$WORKFLOW_SHA" != "$RELEASE_SHA" ] ||
             [ "$WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ] ||
             [ "$REPOSITORY" != "maiprop/maiprop-listing-site" ] ||
             ! [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Stripe live readiness requires a fresh, exact-main, attempt-1 dispatch by one actor."
            exit 1
          fi
          case ",${ALLOWED_ACTORS// /}," in
            *,"$ACTOR",*) ;;
            *)
              echo "::error::Stripe live readiness dispatcher is not allowlisted."
              exit 1
              ;;
          esac

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install immutable dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify current main identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Generate and verify signed live-catalogue evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_EVIDENCE_NONCE: ${{ github.run_id }}:${{ github.run_attempt }}:${{ inputs.release_sha }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          STRIPE_EXPECTED_ACCOUNT_ID: ${{ vars.STRIPE_EXPECTED_ACCOUNT_ID }}
          STRIPE_COMPANY_VAT_ID: ${{ vars.STRIPE_COMPANY_VAT_ID }}
          STRIPE_WEBHOOK_EXPECTED_URL: ${{ vars.STRIPE_WEBHOOK_EXPECTED_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          npm run check:stripe-live-migration -- \
            --release-sha "$RELEASE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-nonce "$RELEASE_EVIDENCE_NONCE" \
            --repository "$REPOSITORY" \
            --workflow-sha "$WORKFLOW_SHA" \
            --workflow-ref "$WORKFLOW_REF" \
            --event-sha "$EVENT_SHA" \
            --event-name "$EVENT_NAME" \
            --actor "$ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            --out stripe-live-migration-evidence.json
          npm run verify:stripe-live-migration-evidence -- \
            --evidence stripe-live-migration-evidence.json \
            --release-sha "$RELEASE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-nonce "$RELEASE_EVIDENCE_NONCE" \
            --repository "$REPOSITORY" \
            --workflow-sha "$WORKFLOW_SHA" \
            --workflow-ref "$WORKFLOW_REF" \
            --event-sha "$EVENT_SHA" \
            --event-name "$EVENT_NAME" \
            --actor "$ACTOR"

      - name: Upload signed live-catalogue evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-live-readiness-${{ inputs.release_sha }}-${{ github.run_id }}-1
          path: stripe-live-migration-evidence.json
          if-no-files-found: error
          retention-days: 30
