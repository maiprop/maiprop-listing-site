name: Android WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/webview-android-wrapper
    paths:
      - ".github/workflows/android-webview-apk.yml"
      - "android/**"
      - "capacitor-fallback/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-capacitor-android.mjs"

concurrency:
  group: android-webview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAPACITOR_BUNDLED_WEB: "true"
      CAPACITOR_APP_ID: co.maiprop.portal.mobile
      CAPACITOR_APP_NAME: MaiProp Portal
      CAPACITOR_SERVER_URL: https://portal.maiprop.co
      VITE_APP_URL: https://portal.maiprop.co
      VITE_PUBLIC_API_ORIGIN: https://portal.maiprop.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_STRIPE_PRO_PRODUCT_ID: ${{ secrets.VITE_STRIPE_PRO_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:web:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maiprop-webview-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
