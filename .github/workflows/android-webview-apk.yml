name: Android WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/webview-android-wrapper
    paths:
      - ".github/workflows/android-webview-apk.yml"
      - "android/**"
      - "capacitor-fallback/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-capacitor-android.mjs"

concurrency:
  group: android-webview-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAPACITOR_BUNDLED_WEB: "true"
      CAPACITOR_APP_ID: co.maiprop.portal.mobile
      CAPACITOR_APP_NAME: MaiProp Portal
      CAPACITOR_SERVER_URL: https://portal.maiprop.co
      VITE_APP_URL: https://portal.maiprop.co
      VITE_PUBLIC_API_ORIGIN: https://portal.maiprop.co
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_ENABLE_GOOGLE_PLACES_AUTOCOMPLETE: "true"
      VITE_STRIPE_PRO_PRODUCT_ID: ${{ secrets.VITE_STRIPE_PRO_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@cf4beec8b4cca436a7b646657f74edc125658df8 # v6

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:web:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maiprop-webview-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
