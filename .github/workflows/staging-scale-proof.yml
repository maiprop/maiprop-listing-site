name: Staging Scale Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-scale-proof-disabled
  cancel-in-progress: false

jobs:
  validate-disabled:
    name: Validate staging scale lockout
    runs-on: ubuntu-latest
    steps:
      - name: Reject standalone staging mutations
        shell: bash
        run: |
          echo "::error::Standalone staging scale mutations are disabled. Route them through the exact-SHA stage-release.yml lease after staging controls are enabled."
          exit 1
