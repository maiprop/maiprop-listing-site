name: Staging Scale Proof

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Protected Cloudflare Pages URL wired to isolated staging Supabase
        required: true
        default: https://staging.maiprop-listing-site.pages.dev
        type: string
      dataset_size:
        description: Synthetic listing count
        required: true
        default: '1000'
        type: choice
        options:
          - '1000'
          - '10000'
      load_profile:
        description: k6 profile
        required: true
        default: baseline_100
        type: choice
        options:
          - baseline_100
          - growth_10x
          - enterprise_soak
      confirmation:
        description: Type RUN_STAGING_LOAD to approve temporary data and quota use
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-scale-proof
  cancel-in-progress: false

jobs:
  staging-scale-proof:
    name: ${{ inputs.dataset_size }} listings / ${{ inputs.load_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALLOW_STAGING_LOAD_DATASET: 'true'
      STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      ECAS_DATASET_SIZE: ${{ inputs.dataset_size }}
      ECAS_DATASET_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_URL: ${{ inputs.staging_url }}
      ECAS_LOAD_PROFILE: ${{ inputs.load_profile }}
      LOAD_TEST_APPROVED_CLOUDFLARE_QUOTA_BURN: 'true'
      LOAD_TEST_SUMMARY_DIR: artifacts/performance/k6
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID || secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET || secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Validate destructive test scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "RUN_STAGING_LOAD" ]; then
            echo "::error::confirmation must be RUN_STAGING_LOAD"
            exit 1
          fi
          node <<'NODE'
          const target = new URL(process.env.BASE_URL);
          const allowed = target.protocol === 'https:' && (
            target.hostname === 'staging.maiprop-listing-site.pages.dev' ||
            target.hostname.endsWith('.maiprop-listing-site.pages.dev')
          );
          if (!allowed || target.hostname === 'portal.maiprop.co') {
            throw new Error(`Refusing non-staging load target: ${target.origin}`);
          }
          const size = Number(process.env.ECAS_DATASET_SIZE);
          const profile = process.env.ECAS_LOAD_PROFILE;
          if (profile === 'baseline_100' && size !== 1000) {
            throw new Error('baseline_100 requires the 1,000-listing dataset');
          }
          if (profile !== 'baseline_100' && size !== 10000) {
            throw new Error('growth_10x and enterprise_soak require the 10,000-listing dataset');
          }
          NODE

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Remove orphaned synthetic datasets
        env:
          ECAS_DATASET_ACTION: cleanup-all
        run: node scripts/staging-load-dataset.mjs

      - name: Seed representative staging dataset
        env:
          ECAS_DATASET_ACTION: seed
        run: node scripts/staging-load-dataset.mjs

      - name: Capture database query plans and index counters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance/database
          psql "$SUPABASE_STAGING_DB_URL" -X -v ON_ERROR_STOP=1 --no-psqlrc \
            -f scripts/load-test/staging-query-plans.sql \
            > artifacts/performance/database/query-plans.txt

      - name: Run approved staging load profile
        run: node scripts/perf-k6-run.mjs

      - name: Remove synthetic dataset
        if: always()
        env:
          ECAS_DATASET_ACTION: cleanup-all
        run: node scripts/staging-load-dataset.mjs

      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-scale-${{ inputs.dataset_size }}-${{ inputs.load_profile }}-${{ github.run_id }}
          path: artifacts/performance
          if-no-files-found: error
          retention-days: 30
