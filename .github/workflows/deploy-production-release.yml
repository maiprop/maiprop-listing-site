name: Deploy Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character current main SHA with an Immutable release candidate built result"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_PRODUCTION_RELEASE to validate this exact main SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: maiprop-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact production release SHA
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_PRODUCTION_RELEASE' && github.run_attempt == 1 && github.actor == github.triggering_actor
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_tree: ${{ steps.release_contract.outputs.source_tree }}
      source_run_id: ${{ steps.release_contract.outputs.source_run_id }}
      source_run_attempt: ${{ steps.release_contract.outputs.source_run_attempt }}
      staging_run_id: ${{ steps.release_contract.outputs.staging_run_id }}
      staging_run_attempt: ${{ steps.release_contract.outputs.staging_run_attempt }}
      approval_run_id: ${{ steps.release_contract.outputs.approval_run_id }}
      approval_run_attempt: ${{ steps.release_contract.outputs.approval_run_attempt }}
      stripe_readiness_run_id: ${{ steps.release_contract.outputs.stripe_readiness_run_id }}
      stripe_readiness_run_attempt: ${{ steps.release_contract.outputs.stripe_readiness_run_attempt }}
      stripe_readiness_sha256: ${{ steps.release_contract.outputs.stripe_readiness_sha256 }}
      stripe_readiness_artifact_id: ${{ steps.release_contract.outputs.stripe_readiness_artifact_id }}
      stripe_readiness_artifact_digest: ${{ steps.release_contract.outputs.stripe_readiness_artifact_digest }}
      stripe_readiness_checked_at: ${{ steps.release_contract.outputs.stripe_readiness_checked_at }}
      artifact_sha256: ${{ steps.release_contract.outputs.artifact_sha256 }}
      manifest_sha256: ${{ steps.release_contract.outputs.manifest_sha256 }}
      approval_nonce: ${{ steps.release_contract.outputs.approval_nonce }}
      mutation_lease_artifact: ${{ steps.release_contract.outputs.mutation_lease_artifact }}
    steps:
      - name: Fail closed on reruns or substituted actors
        if: ${{ github.run_attempt != 1 || github.actor != github.triggering_actor }}
        run: |
          echo "::error::Production release requires a fresh attempt-1 dispatch by the original actor."
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Require current main and final exact-SHA readiness
        id: release_contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          PRODUCTION_RELEASE_APPROVERS: ${{ vars.PRODUCTION_RELEASE_APPROVERS }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          DEPLOY_ACTOR: ${{ github.actor }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION_RELEASE_ENABLED" != "true" ]; then
            echo "::error::Production release orchestration is disabled."
            exit 1
          fi
          case ",${PRODUCTION_RELEASE_DEPLOYERS// /}," in
            *,"$DEPLOY_ACTOR",*) ;;
            *)
              echo "::error::Production release dispatcher is not an allowlisted deployer."
              exit 1
              ;;
          esac
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected release SHA $RELEASE_SHA."
            exit 1
          fi

          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            echo "::error::Release SHA $RELEASE_SHA is no longer current main ($CURRENT_MAIN). Start a new release."
            exit 1
          fi

          node scripts/production-release-validation.mjs github-release-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            > release-proof-selection.json

          SOURCE_RUN_ID="$(jq -r '.readiness_run_id' release-proof-selection.json)"
          SOURCE_RUN_ATTEMPT="$(jq -r '.readiness_run_attempt' release-proof-selection.json)"
          STAGING_RUN_ID="$(jq -r '.staging_run_id' release-proof-selection.json)"
          STAGING_RUN_ATTEMPT="$(jq -r '.staging_run_attempt' release-proof-selection.json)"
          SOURCE_TREE="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$STAGING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The selected source or staging run identity is invalid."
            exit 1
          fi

          gh run download "$STAGING_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-attestation-${RELEASE_SHA}-${STAGING_RUN_ATTEMPT}" \
            --dir staging-evidence
          mkdir -p staging-binding staging-binding-metadata
          gh run download "$STAGING_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-attestation-${RELEASE_SHA}-${STAGING_RUN_ATTEMPT}-binding" \
            --dir staging-binding
          staging_artifact_id="$(jq -er '.artifact.id' staging-binding/release-artifact-binding.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${staging_artifact_id}" \
            > staging-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" \
            > staging-binding-metadata/run.json
          staging_actor="$(jq -er '.actor.login' staging-binding-metadata/run.json)"
          staging_triggering_actor="$(jq -er '.triggering_actor.login' staging-binding-metadata/run.json)"
          node scripts/verify-release-artifact-binding.mjs \
            --binding staging-binding/release-artifact-binding.json \
            --payload-root staging-evidence/release-candidate-attestation.json \
            --artifact-metadata staging-binding-metadata/artifact.json \
            --producer-run staging-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/stage-release.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/stage-release.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event workflow_run \
            --run-id "$STAGING_RUN_ID" \
            --run-attempt "$STAGING_RUN_ATTEMPT" \
            --actor "$staging_actor" \
            --triggering-actor "$staging_triggering_actor" \
            --artifact-id "$staging_artifact_id" \
            --artifact-name "release-candidate-attestation-${RELEASE_SHA}-${STAGING_RUN_ATTEMPT}" \
            --artifact-digest "$(jq -er '.digest' staging-binding-metadata/artifact.json)" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > staging-evidence/cryptographic-verification.json

          node scripts/production-release-validation.mjs release-candidate-attestation \
            --file staging-evidence/release-candidate-attestation.json \
            --sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            > staging-evidence/content-verification.json

          ARTIFACT_SHA256="$(jq -r '.artifact_sha256' staging-evidence/content-verification.json)"
          MANIFEST_SHA256="$(jq -r '.manifest_sha256' staging-evidence/content-verification.json)"
          if ! [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
             ! [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The signed candidate artifact or manifest digest is invalid."
            exit 1
          fi

          node scripts/production-release-validation.mjs github-stripe-readiness \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            > stripe-readiness-selection.json
          STRIPE_READINESS_RUN_ID="$(jq -er '.stripe_readiness_run_id' stripe-readiness-selection.json)"
          STRIPE_READINESS_RUN_ATTEMPT="$(jq -er '.stripe_readiness_run_attempt' stripe-readiness-selection.json)"
          STRIPE_READINESS_ACTOR="$(jq -er '.verifier' stripe-readiness-selection.json)"
          if [ "$STRIPE_READINESS_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Stripe live readiness must come from attempt 1."
            exit 1
          fi
          STRIPE_READINESS_ARTIFACT_NAME="stripe-live-readiness-${RELEASE_SHA}-${STRIPE_READINESS_RUN_ID}-1"
          mkdir -p stripe-readiness-evidence
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${STRIPE_READINESS_RUN_ID}" \
            > stripe-readiness-evidence/producer-run.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${STRIPE_READINESS_RUN_ID}/artifacts?per_page=100" \
            > stripe-readiness-evidence/artifacts.json
          if [ "$(jq --arg name "$STRIPE_READINESS_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            stripe-readiness-evidence/artifacts.json)" != "1" ]; then
            echo "::error::Expected one immutable Stripe readiness artifact."
            exit 1
          fi
          jq --arg name "$STRIPE_READINESS_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0]' \
            stripe-readiness-evidence/artifacts.json \
            > stripe-readiness-evidence/artifact.json
          : > stripe-readiness-evidence/artifact-metadata.env
          node scripts/github-artifact-metadata.mjs \
            --artifact stripe-readiness-evidence/artifact.json \
            --producer-run stripe-readiness-evidence/producer-run.json \
            --name "$STRIPE_READINESS_ARTIFACT_NAME" \
            --run-id "$STRIPE_READINESS_RUN_ID" \
            --run-attempt "$STRIPE_READINESS_RUN_ATTEMPT" \
            --release-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-path ".github/workflows/verify-stripe-live-readiness.yml" \
            --event "workflow_dispatch" \
            --branch "main" \
            --actor "$STRIPE_READINESS_ACTOR" \
            --github-output stripe-readiness-evidence/artifact-metadata.env
          source stripe-readiness-evidence/artifact-metadata.env
          STRIPE_READINESS_ARTIFACT_ID="$artifact_id"
          STRIPE_READINESS_ARTIFACT_DIGEST="$artifact_digest"
          gh run download "$STRIPE_READINESS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$STRIPE_READINESS_ARTIFACT_NAME" \
            --dir stripe-readiness-evidence
          mkdir -p stripe-readiness-binding
          gh run download "$STRIPE_READINESS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${STRIPE_READINESS_ARTIFACT_NAME}-binding" \
            --dir stripe-readiness-binding
          STRIPE_READINESS_TRIGGERING_ACTOR="$(jq -er '.triggering_actor.login' stripe-readiness-evidence/producer-run.json)"
          node scripts/verify-release-artifact-binding.mjs \
            --binding stripe-readiness-binding/release-artifact-binding.json \
            --payload-root stripe-readiness-evidence/stripe-live-migration-evidence.json \
            --artifact-metadata stripe-readiness-evidence/artifact.json \
            --producer-run stripe-readiness-evidence/producer-run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/verify-stripe-live-readiness.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/verify-stripe-live-readiness.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event workflow_dispatch \
            --run-id "$STRIPE_READINESS_RUN_ID" \
            --run-attempt "$STRIPE_READINESS_RUN_ATTEMPT" \
            --actor "$STRIPE_READINESS_ACTOR" \
            --triggering-actor "$STRIPE_READINESS_TRIGGERING_ACTOR" \
            --artifact-id "$STRIPE_READINESS_ARTIFACT_ID" \
            --artifact-name "$STRIPE_READINESS_ARTIFACT_NAME" \
            --artifact-digest "$STRIPE_READINESS_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > stripe-readiness-evidence/binding-verification.json
          RELEASE_EVIDENCE_NONCE="${STRIPE_READINESS_RUN_ID}:1:${RELEASE_SHA}" \
            node scripts/verify-stripe-live-migration-evidence.mjs \
              --evidence stripe-readiness-evidence/stripe-live-migration-evidence.json \
              --release-sha "$RELEASE_SHA" \
              --workflow-run-id "$STRIPE_READINESS_RUN_ID" \
              --workflow-run-attempt "1" \
              --evidence-nonce "${STRIPE_READINESS_RUN_ID}:1:${RELEASE_SHA}"
          STRIPE_READINESS_SHA256="$(sha256sum stripe-readiness-evidence/stripe-live-migration-evidence.json | awk '{print $1}')"
          STRIPE_READINESS_CHECKED_AT="$(jq -er '.checked_at' stripe-readiness-evidence/stripe-live-migration-evidence.json)"
          if ! [[ "$STRIPE_READINESS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Stripe live readiness evidence digest is invalid."
            exit 1
          fi

          node scripts/production-release-validation.mjs github-release-approval \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            > approval-selection.json
          APPROVAL_RUN_ID="$(jq -r '.approval_run_id' approval-selection.json)"
          APPROVAL_RUN_ATTEMPT="$(jq -r '.approval_run_attempt' approval-selection.json)"
          if ! [[ "$APPROVAL_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$APPROVAL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The selected approval run identity is invalid."
            exit 1
          fi

          mkdir -p approval-evidence
          gh run download "$APPROVAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-release-approval-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --dir approval-evidence
          mkdir -p approval-binding approval-binding-metadata
          gh run download "$APPROVAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-release-approval-binding-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --dir approval-binding
          approval_artifact_id="$(jq -er '.artifact.id' approval-binding/release-artifact-binding.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${approval_artifact_id}" \
            > approval-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_RUN_ID}" \
            > approval-binding-metadata/run.json
          approval_actor="$(jq -er '.actor.login' approval-binding-metadata/run.json)"
          approval_triggering_actor="$(jq -er '.triggering_actor.login' approval-binding-metadata/run.json)"
          node scripts/verify-release-artifact-binding.mjs \
            --binding approval-binding/release-artifact-binding.json \
            --payload-root approval-evidence/production-release-approval.json \
            --artifact-metadata approval-binding-metadata/artifact.json \
            --producer-run approval-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/approve-production-release.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/approve-production-release.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event workflow_dispatch \
            --run-id "$APPROVAL_RUN_ID" \
            --run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --actor "$approval_actor" \
            --triggering-actor "$approval_triggering_actor" \
            --artifact-id "$approval_artifact_id" \
            --artifact-name "production-release-approval-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --artifact-digest "$(jq -er '.digest' approval-binding-metadata/artifact.json)" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > approval-evidence/cryptographic-verification.json
          npm run --silent release:validate -- release-approval \
            --file approval-evidence/production-release-approval.json \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$SOURCE_TREE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            --approval-run-id "$APPROVAL_RUN_ID" \
            --approval-run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --deploy-actor "$DEPLOY_ACTOR" \
            --allowed-approvers "$PRODUCTION_RELEASE_APPROVERS"

          APPROVAL_NONCE="$(jq -r '.nonce' approval-evidence/production-release-approval.json)"
          export RELEASE_SHA SOURCE_TREE SOURCE_RUN_ID SOURCE_RUN_ATTEMPT
          export STAGING_RUN_ID STAGING_RUN_ATTEMPT APPROVAL_RUN_ID
          export APPROVAL_RUN_ATTEMPT ARTIFACT_SHA256 APPROVAL_NONCE
          export STRIPE_READINESS_RUN_ID STRIPE_READINESS_RUN_ATTEMPT
          export STRIPE_READINESS_SHA256
          export STRIPE_READINESS_ARTIFACT_ID STRIPE_READINESS_ARTIFACT_DIGEST
          export STRIPE_READINESS_CHECKED_AT
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";

          const issuedAt = new Date();
          const readinessExpiresAt = new Date(
            new Date(process.env.STRIPE_READINESS_CHECKED_AT).getTime() +
              15 * 60 * 1000,
          );
          const lease = {
            schema_version: 2,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            approval_run_id: process.env.APPROVAL_RUN_ID,
            approval_run_attempt: process.env.APPROVAL_RUN_ATTEMPT,
            stripe_readiness_run_id: process.env.STRIPE_READINESS_RUN_ID,
            stripe_readiness_run_attempt:
              process.env.STRIPE_READINESS_RUN_ATTEMPT,
            stripe_readiness_sha256: process.env.STRIPE_READINESS_SHA256,
            stripe_readiness_artifact_id:
              process.env.STRIPE_READINESS_ARTIFACT_ID,
            stripe_readiness_artifact_digest:
              process.env.STRIPE_READINESS_ARTIFACT_DIGEST,
            stripe_readiness_checked_at:
              process.env.STRIPE_READINESS_CHECKED_AT,
            production_run_id: process.env.GITHUB_RUN_ID,
            production_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            approval_nonce: process.env.APPROVAL_NONCE,
            nonce: randomBytes(32).toString("hex"),
            issued_at: issuedAt.toISOString(),
            expires_at: new Date(Math.min(
              issuedAt.getTime() + 15 * 60 * 1000,
              readinessExpiresAt.getTime(),
            )).toISOString(),
          };
          writeFileSync(
            "production-mutation-lease.json",
            `${JSON.stringify(lease, null, 2)}\n`,
          );
          NODE
          npm run --silent release:validate -- mutation-lease \
            --file production-mutation-lease.json \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$SOURCE_TREE" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --approval-nonce "$APPROVAL_NONCE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            --approval-run-id "$APPROVAL_RUN_ID" \
            --approval-run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --production-run-id "$GITHUB_RUN_ID" \
            --production-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stripe-readiness-run-id "$STRIPE_READINESS_RUN_ID" \
            --stripe-readiness-run-attempt "$STRIPE_READINESS_RUN_ATTEMPT" \
            --stripe-readiness-sha256 "$STRIPE_READINESS_SHA256" \
            --stripe-readiness-artifact-id "$STRIPE_READINESS_ARTIFACT_ID" \
            --stripe-readiness-artifact-digest "$STRIPE_READINESS_ARTIFACT_DIGEST"

          MUTATION_LEASE_ARTIFACT="production-mutation-lease-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-database"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "staging_run_attempt=$STAGING_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "approval_run_id=$APPROVAL_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "approval_run_attempt=$APPROVAL_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_run_id=$STRIPE_READINESS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_run_attempt=$STRIPE_READINESS_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_sha256=$STRIPE_READINESS_SHA256" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_artifact_id=$STRIPE_READINESS_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_artifact_digest=$STRIPE_READINESS_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "stripe_readiness_checked_at=$STRIPE_READINESS_CHECKED_AT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          echo "approval_nonce=$APPROVAL_NONCE" >> "$GITHUB_OUTPUT"
          echo "mutation_lease_artifact=$MUTATION_LEASE_ARTIFACT" >> "$GITHUB_OUTPUT"

          {
            echo "### Production release validation"
            echo "- Exact SHA: $RELEASE_SHA"
            echo "- Static gate: Immutable release candidate built"
            echo "- Signed staging evidence run: $STAGING_RUN_ID (attempt $STAGING_RUN_ATTEMPT)"
            echo "- Independent approval run: $APPROVAL_RUN_ID (attempt $APPROVAL_RUN_ATTEMPT)"
            echo "- Stripe live readiness run: $STRIPE_READINESS_RUN_ID (attempt $STRIPE_READINESS_RUN_ATTEMPT)"
            echo "- Database mutation lease: $MUTATION_LEASE_ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload database mutation lease
        id: database_lease_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_contract.outputs.mutation_lease_artifact }}
          path: production-mutation-lease.json
          if-no-files-found: error
          retention-days: 1

      - name: Create signed database mutation lease binding
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.database_lease_upload.outputs.artifact-digest }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.database_lease_upload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_NAME: ${{ steps.release_contract.outputs.mutation_lease_artifact }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.release_contract.outputs.source_tree }}
        run: |
          set -euo pipefail
          mkdir -p database-lease-binding database-lease-binding-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > database-lease-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > database-lease-binding-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root production-mutation-lease.json \
            --out database-lease-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/deploy-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$PAYLOAD_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding database-lease-binding/release-artifact-binding.json \
            --payload-root production-mutation-lease.json \
            --artifact-metadata database-lease-binding-metadata/artifact.json \
            --producer-run database-lease-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/deploy-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$PAYLOAD_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > database-lease-binding/verification.json

      - name: Upload database mutation lease binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_contract.outputs.mutation_lease_artifact }}-binding
          path: database-lease-binding/
          if-no-files-found: error
          retention-days: 1

  cloudflare-production-preflight:
    name: Preflight production Cloudflare before backend mutation
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Verify Cloudflare production credentials identity and rollback baseline
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CF_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_PAGES_READ_TOKEN }}
          STAGING_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          PRODUCTION_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          STAGING_PROJECT: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_PROJECT_ID: ${{ vars.CLOUDFLARE_PAGES_PROJECT_ID }}
          CLOUDFLARE_STAGING_PAGES_PROJECT_ID: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for value in \
            "$CF_READ_TOKEN" \
            "$CF_EDIT_TOKEN" \
            "$CF_ACCOUNT_ID" \
            "$STAGING_CF_READ_TOKEN" \
            "$STAGING_CF_ACCOUNT_ID" \
            "$CLOUDFLARE_PAGES_PROJECT_ID" \
            "$CLOUDFLARE_STAGING_PAGES_PROJECT_ID"; do
            if [ -z "$value" ]; then
              echo "::error::Complete production Cloudflare preflight credentials and project IDs are required."
              exit 1
            fi
            echo "::add-mask::$value"
          done
          if [ "$PRODUCTION_PROJECT" != "maiprop-listing-site" ] ||
             [ "$STAGING_PROJECT" != "maiprop-listing-site-staging" ] ||
             [ "$CF_ACCOUNT_ID" = "$STAGING_CF_ACCOUNT_ID" ] ||
             [ "$CF_READ_TOKEN" = "$CF_EDIT_TOKEN" ] ||
             [ "$CF_READ_TOKEN" = "$STAGING_CF_READ_TOKEN" ] ||
             [ "$CF_EDIT_TOKEN" = "$STAGING_CF_READ_TOKEN" ]; then
            echo "::error::Cloudflare production preflight identities are not isolated from staging."
            exit 1
          fi
          if { [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -z "$CF_ACCESS_CLIENT_SECRET" ]; } ||
             { [ -z "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; }; then
            echo "::error::Cloudflare Access credentials must be supplied as a pair."
            exit 1
          fi

          production_read="$RUNNER_TEMP/cloudflare-production-preflight-read.json"
          production_edit="$RUNNER_TEMP/cloudflare-production-preflight-edit.json"
          staging_read="$RUNNER_TEMP/cloudflare-staging-production-preflight.json"
          rollback="$RUNNER_TEMP/cloudflare-production-preflight-rollback.json"
          deployments="$RUNNER_TEMP/cloudflare-production-preflight-deployments.json"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $CF_READ_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PRODUCTION_PROJECT" \
            > "$production_read"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $CF_EDIT_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PRODUCTION_PROJECT" \
            > "$production_edit"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $STAGING_CF_READ_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$STAGING_CF_ACCOUNT_ID/pages/projects/$STAGING_PROJECT" \
            > "$staging_read"
          jq -e --arg id "$CLOUDFLARE_PAGES_PROJECT_ID" \
            '.success == true and .result.id == $id and .result.name == "maiprop-listing-site"' \
            "$production_edit" > /dev/null
          node scripts/validate-cloudflare-pages-staging-posture.mjs \
            --mode git-lock \
            --staging-project-file "$staging_read" \
            --production-project-file "$production_read" \
            --out "$RUNNER_TEMP/cloudflare-production-preflight-posture.json"
          jq -e '.success == true and (.result.canonical_deployment | type == "object")' \
            "$production_read" > /dev/null
          jq '.result.canonical_deployment' "$production_read" > "$rollback"
          rollback_sha="$(jq -er '.deployment_trigger.metadata.commit_hash' "$rollback")"
          if [ "${rollback_sha,,}" = "${RELEASE_SHA,,}" ]; then
            echo "::error::Production rollback baseline must differ from the release candidate."
            exit 1
          fi
          npm run --silent release:validate -- cloudflare-deployment \
            --file "$rollback" \
            --project "$PRODUCTION_PROJECT" \
            --project-id "$CLOUDFLARE_PAGES_PROJECT_ID" \
            --environment production \
            --branch main \
            --sha "$rollback_sha"
          npm run --silent release:verify-live-marker -- \
            "https://portal.maiprop.co" \
            --expected-sha "$rollback_sha" \
            > "$RUNNER_TEMP/cloudflare-production-preflight-rollback-marker.json"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $CF_READ_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PRODUCTION_PROJECT/deployments?env=production&per_page=100" \
            > "$deployments"
          jq -e --arg id "$(jq -er '.id' "$rollback")" \
            '.success == true and any(.result[]; .id == $id)' \
            "$deployments" > /dev/null

  archive-production-source:
    name: Archive immutable production source before backend mutation
    needs: [validate, cloudflare-production-preflight]
    if: ${{ needs.validate.result == 'success' && needs.cloudflare-production-preflight.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Re-verify and package exact attempt-1 source candidate
        id: source_archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.source_run_attempt }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_RUN_ATTEMPT" != "1" ] || [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Durable source archival requires attempt-1 source and production runs."
            exit 1
          fi

          root="$RUNNER_TEMP/production-source"
          candidate="$root/release-candidate"
          binding="$root/source-binding"
          metadata="$root/source-metadata"
          mkdir -p "$candidate" "$binding" "$metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "$metadata/artifacts.json"
          candidate_name="production-release-candidate-${RELEASE_SHA}-1"
          binding_name="production-release-candidate-binding-${RELEASE_SHA}-1"
          mapfile -t candidate_ids < <(
            jq -r --arg name "$candidate_name" \
              '.artifacts[] | select(.expired == false and .name == $name) | .id' \
              "$metadata/artifacts.json"
          )
          mapfile -t binding_ids < <(
            jq -r --arg name "$binding_name" \
              '.artifacts[] | select(.expired == false and .name == $name) | .id' \
              "$metadata/artifacts.json"
          )
          if [ "${#candidate_ids[@]}" -ne 1 ] || [ "${#binding_ids[@]}" -ne 1 ]; then
            echo "::error::The exact attempt-1 source candidate and binding must each resolve uniquely."
            exit 1
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${binding_ids[0]}/zip" \
            > "$root/source-binding.zip"
          unzip -q "$root/source-binding.zip" -d "$binding"
          bound_artifact_id="$(jq -er '.artifact.id' "$binding/release-artifact-binding.json")"
          if [ "$bound_artifact_id" != "${candidate_ids[0]}" ]; then
            echo "::error::The signed source binding does not identify the selected candidate."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_ids[0]}" \
            > "$metadata/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "$metadata/run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_ids[0]}/zip" \
            > "$root/release-candidate.zip"
          unzip -q "$root/release-candidate.zip" -d "$candidate"
          source_actor="$(jq -er '.actor.login' "$metadata/run.json")"
          source_triggering_actor="$(jq -er '.triggering_actor.login' "$metadata/run.json")"
          npm run --silent release:artifact:verify -- \
            --dir "$candidate" \
            --sha "$RELEASE_SHA" \
            --tree "$SOURCE_TREE" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT"
          node scripts/verify-release-artifact-binding.mjs \
            --binding "$binding/release-artifact-binding.json" \
            --payload-root "$candidate" \
            --artifact-metadata "$metadata/artifact.json" \
            --producer-run "$metadata/run.json" \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event push \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --actor "$source_actor" \
            --triggering-actor "$source_triggering_actor" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > "$root/source-verification.json"

          tag_name="production-source-${RELEASE_SHA}"
          asset_name="${tag_name}.tar.gz"
          binding_asset_name="${tag_name}.binding.json"
          asset_path="$root/$asset_name"
          binding_path="$root/$binding_asset_name"
          unsafe_candidate_entry="$(find "$candidate" \( ! -type f -a ! -type d \) -print -quit)"
          if [ -n "$unsafe_candidate_entry" ]; then
            echo "::error::Release candidate contains a special filesystem entry and cannot be archived."
            exit 1
          fi
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner --hard-dereference \
            -C "$candidate" -cf - . | gzip -n > "$asset_path"
          node scripts/production-source-release.mjs create \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --archive-run-id "$GITHUB_RUN_ID" \
            --archive-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --archive-actor "$GITHUB_ACTOR" \
            --tag-name "$tag_name" \
            --asset-name "$asset_name" \
            --asset "$asset_path" \
            --manifest "$candidate/release-manifest.json" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --out "$binding_path" \
            > "$root/archive-binding-create.json"
          {
            echo "root=$root"
            echo "tag_name=$tag_name"
            echo "asset_name=$asset_name"
            echo "asset_path=$asset_path"
            echo "binding_asset_name=$binding_asset_name"
            echo "binding_path=$binding_path"
          } >> "$GITHUB_OUTPUT"

      - name: Publish or verify immutable SHA-bound source release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.source_run_attempt }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          ROOT: ${{ steps.source_archive.outputs.root }}
          TAG_NAME: ${{ steps.source_archive.outputs.tag_name }}
          ASSET_NAME: ${{ steps.source_archive.outputs.asset_name }}
          ASSET_PATH: ${{ steps.source_archive.outputs.asset_path }}
          BINDING_ASSET_NAME: ${{ steps.source_archive.outputs.binding_asset_name }}
          BINDING_PATH: ${{ steps.source_archive.outputs.binding_path }}
        run: |
          set -euo pipefail
          github_api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }
          github_get_status() {
            local path="$1"
            local output="$2"
            curl -sS --retry 3 --retry-all-errors \
              -o "$output" \
              -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$path"
          }
          release_json="$ROOT/release.json"
          downloaded_asset="$ROOT/downloaded-$ASSET_NAME"
          downloaded_binding="$ROOT/downloaded-$BINDING_ASSET_NAME"
          downloaded_manifest="$ROOT/downloaded-release-manifest.json"
          archive_paths="$ROOT/downloaded-archive-paths.txt"
          archive_listing="$ROOT/downloaded-archive-listing.txt"

          verify_release() {
            jq -e \
              --arg tag "$TAG_NAME" \
              --arg sha "$RELEASE_SHA" \
              --arg asset "$ASSET_NAME" \
              --arg binding "$BINDING_ASSET_NAME" '
                .draft == false and
                .prerelease == true and
                .immutable == true and
                .tag_name == $tag and
                .target_commitish == $sha and
                ([.assets[].name] | sort) == ([$asset, $binding] | sort)
              ' "$release_json" > /dev/null
            github_api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
              --jq '.object.type + " " + .object.sha' \
              | grep -Fx "commit $RELEASE_SHA" > /dev/null

            asset_id="$(jq -er --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .id' "$release_json")"
            binding_id="$(jq -er --arg name "$BINDING_ASSET_NAME" '.assets[] | select(.name == $name) | .id' "$release_json")"
            github_api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$downloaded_asset"
            github_api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${binding_id}" \
              > "$downloaded_binding"
            asset_digest="sha256:$(sha256sum "$downloaded_asset" | awk '{print $1}')"
            binding_digest="sha256:$(sha256sum "$downloaded_binding" | awk '{print $1}')"
            jq -e --arg name "$ASSET_NAME" --arg digest "$asset_digest" \
              '.assets[] | select(.name == $name) | .digest == $digest' \
              "$release_json" > /dev/null
            jq -e --arg name "$BINDING_ASSET_NAME" --arg digest "$binding_digest" \
              '.assets[] | select(.name == $name) | .digest == $digest' \
              "$release_json" > /dev/null
            tar -tzf "$downloaded_asset" > "$archive_paths"
            tar -tvzf "$downloaded_asset" > "$archive_listing"
            if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' "$archive_paths"; then
              echo "::error::Production source archive contains an unsafe path."
              exit 1
            fi
            if grep -Eq '^[^d-]' "$archive_listing"; then
              echo "::error::Production source archive contains a special filesystem entry."
              exit 1
            fi
            tar -xOzf "$downloaded_asset" ./release-manifest.json \
              > "$downloaded_manifest"
            node scripts/production-source-release.mjs verify \
              --repository "$GITHUB_REPOSITORY" \
              --release-sha "$RELEASE_SHA" \
              --source-tree "$SOURCE_TREE" \
              --source-run-id "$SOURCE_RUN_ID" \
              --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
              --tag-name "$TAG_NAME" \
              --asset-name "$ASSET_NAME" \
              --asset "$downloaded_asset" \
              --manifest "$downloaded_manifest" \
              --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
              --binding "$downloaded_binding" \
              > "$ROOT/archive-binding-verification.json"
          }

          release_status="$(github_get_status "releases/tags/${TAG_NAME}" "$release_json")"
          if [ "$release_status" = "200" ]; then
            verify_release
          elif [ "$release_status" = "404" ]; then
            tag_status="$(github_get_status "git/ref/tags/${TAG_NAME}" "$ROOT/existing-tag.json")"
            if [ "$tag_status" = "200" ]; then
              jq -e --arg sha "$RELEASE_SHA" \
                '.object.type == "commit" and .object.sha == $sha' \
                "$ROOT/existing-tag.json" > /dev/null
            elif [ "$tag_status" != "404" ]; then
              echo "::error::GitHub tag lookup failed with HTTP $tag_status."
              exit 1
            fi
            github_api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="Production source $RELEASE_SHA" \
              -f body="Immutable, signed source used by the production release dispatch for $RELEASE_SHA." \
              -F draft=true \
              -F prerelease=true \
              > "$release_json"
            release_id="$(jq -er '.id' "$release_json")"
            cleanup_draft() {
              github_api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                >/dev/null 2>&1 || true
            }
            trap cleanup_draft ERR
            upload_url="$(jq -er '.upload_url | sub("\\{\\?name,label\\}$"; "")' "$release_json")"
            expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            if [ "$upload_url" != "$expected_upload_url" ]; then
              echo "::error::GitHub returned an unexpected release asset upload URL."
              exit 1
            fi
            upload_release_asset() {
              local asset_path="$1"
              local asset_name="$2"
              local content_type="$3"
              local response_path="$4"
              curl -fsS --request POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: $content_type" \
                --data-binary @"$asset_path" \
                "${upload_url}?name=${asset_name}" \
                > "$response_path"
              jq -e --arg name "$asset_name" \
                '.name == $name and .state == "uploaded"' \
                "$response_path" > /dev/null
            }
            upload_release_asset \
              "$ASSET_PATH" "$ASSET_NAME" "application/gzip" \
              "$ROOT/uploaded-asset.json"
            upload_release_asset \
              "$BINDING_PATH" "$BINDING_ASSET_NAME" "application/json" \
              "$ROOT/uploaded-binding.json"
            github_api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=true \
              > "$release_json"
            github_api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              > "$release_json"
            if [ "$(jq -r '.immutable' "$release_json")" != "true" ]; then
              echo "::error::GitHub did not publish an immutable release; deleting the mutable release before production mutation."
              cleanup_draft
              trap - ERR
              exit 1
            fi
            trap - ERR
            verify_release
          else
            echo "::error::GitHub immutable release lookup failed with HTTP $release_status."
            exit 1
          fi
          {
            echo "### Durable production source"
            echo "- Tag: $TAG_NAME"
            echo "- Immutable: true"
            echo "- Candidate SHA: $RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production-database:
    name: Promote production database
    needs: [validate, cloudflare-production-preflight, archive-production-source]
    if: ${{ needs.validate.result == 'success' && needs.cloudflare-production-preflight.result == 'success' && needs.archive-production-source.result == 'success' }}
    uses: ./.github/workflows/deploy-supabase-production-db.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      source_tree: ${{ needs.validate.outputs.source_tree }}
      source_run_id: ${{ needs.validate.outputs.source_run_id }}
      source_run_attempt: ${{ needs.validate.outputs.source_run_attempt }}
      staging_run_id: ${{ needs.validate.outputs.staging_run_id }}
      staging_run_attempt: ${{ needs.validate.outputs.staging_run_attempt }}
      approval_run_id: ${{ needs.validate.outputs.approval_run_id }}
      approval_run_attempt: ${{ needs.validate.outputs.approval_run_attempt }}
      production_run_id: ${{ github.run_id }}
      production_run_attempt: ${{ github.run_attempt }}
      stripe_readiness_run_id: ${{ needs.validate.outputs.stripe_readiness_run_id }}
      stripe_readiness_run_attempt: ${{ needs.validate.outputs.stripe_readiness_run_attempt }}
      stripe_readiness_sha256: ${{ needs.validate.outputs.stripe_readiness_sha256 }}
      stripe_readiness_artifact_id: ${{ needs.validate.outputs.stripe_readiness_artifact_id }}
      stripe_readiness_artifact_digest: ${{ needs.validate.outputs.stripe_readiness_artifact_digest }}
      artifact_sha256: ${{ needs.validate.outputs.artifact_sha256 }}
      manifest_sha256: ${{ needs.validate.outputs.manifest_sha256 }}
      approval_nonce: ${{ needs.validate.outputs.approval_nonce }}
      mutation_lease_artifact: ${{ needs.validate.outputs.mutation_lease_artifact }}
    secrets:
      RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

  renew-edge-mutation-lease:
    name: Renew Edge mutation lease after database promotion
    needs: [validate, deploy-production-database]
    if: ${{ needs.validate.result == 'success' && needs.deploy-production-database.result == 'success' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mutation_lease_artifact: ${{ steps.edge_lease.outputs.mutation_lease_artifact }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Revalidate approval and create fresh Edge mutation lease
        id: edge_lease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.source_run_attempt }}
          STAGING_RUN_ID: ${{ needs.validate.outputs.staging_run_id }}
          STAGING_RUN_ATTEMPT: ${{ needs.validate.outputs.staging_run_attempt }}
          APPROVAL_RUN_ID: ${{ needs.validate.outputs.approval_run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ needs.validate.outputs.approval_run_attempt }}
          STRIPE_READINESS_RUN_ID: ${{ needs.validate.outputs.stripe_readiness_run_id }}
          STRIPE_READINESS_RUN_ATTEMPT: ${{ needs.validate.outputs.stripe_readiness_run_attempt }}
          STRIPE_READINESS_SHA256: ${{ needs.validate.outputs.stripe_readiness_sha256 }}
          STRIPE_READINESS_ARTIFACT_ID: ${{ needs.validate.outputs.stripe_readiness_artifact_id }}
          STRIPE_READINESS_ARTIFACT_DIGEST: ${{ needs.validate.outputs.stripe_readiness_artifact_digest }}
          STRIPE_READINESS_CHECKED_AT: ${{ needs.validate.outputs.stripe_readiness_checked_at }}
          ARTIFACT_SHA256: ${{ needs.validate.outputs.artifact_sha256 }}
          APPROVAL_NONCE: ${{ needs.validate.outputs.approval_nonce }}
          PRODUCTION_RELEASE_APPROVERS: ${{ vars.PRODUCTION_RELEASE_APPROVERS }}
          DEPLOY_ACTOR: ${{ github.actor }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::Release SHA is no longer current main before Edge lease renewal."
            exit 1
          fi
          node scripts/production-release-validation.mjs github-release-approval \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            > approval-selection.json
          if [ "$(jq -r '.approval_run_id' approval-selection.json)" != "$APPROVAL_RUN_ID" ] ||
             [ "$(jq -r '.approval_run_attempt' approval-selection.json)" != "$APPROVAL_RUN_ATTEMPT" ]; then
            echo "::error::The approved release changed before Edge lease renewal."
            exit 1
          fi
          mkdir -p approval-evidence
          gh run download "$APPROVAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-release-approval-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --dir approval-evidence
          mkdir -p approval-binding approval-binding-metadata
          gh run download "$APPROVAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-release-approval-binding-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --dir approval-binding
          approval_artifact_id="$(jq -er '.artifact.id' approval-binding/release-artifact-binding.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${approval_artifact_id}" \
            > approval-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_RUN_ID}" \
            > approval-binding-metadata/run.json
          approval_actor="$(jq -er '.actor.login' approval-binding-metadata/run.json)"
          approval_triggering_actor="$(jq -er '.triggering_actor.login' approval-binding-metadata/run.json)"
          node scripts/verify-release-artifact-binding.mjs \
            --binding approval-binding/release-artifact-binding.json \
            --payload-root approval-evidence/production-release-approval.json \
            --artifact-metadata approval-binding-metadata/artifact.json \
            --producer-run approval-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/approve-production-release.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/approve-production-release.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event workflow_dispatch \
            --run-id "$APPROVAL_RUN_ID" \
            --run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --actor "$approval_actor" \
            --triggering-actor "$approval_triggering_actor" \
            --artifact-id "$approval_artifact_id" \
            --artifact-name "production-release-approval-${RELEASE_SHA}-${APPROVAL_RUN_ID}-${APPROVAL_RUN_ATTEMPT}" \
            --artifact-digest "$(jq -er '.digest' approval-binding-metadata/artifact.json)" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > approval-evidence/binding-verification.json
          npm run --silent release:validate -- release-approval \
            --file approval-evidence/production-release-approval.json \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$SOURCE_TREE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            --approval-run-id "$APPROVAL_RUN_ID" \
            --approval-run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --deploy-actor "$DEPLOY_ACTOR" \
            --allowed-approvers "$PRODUCTION_RELEASE_APPROVERS"
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";

          const issuedAt = new Date();
          const readinessExpiresAt = new Date(
            new Date(process.env.STRIPE_READINESS_CHECKED_AT).getTime() +
              15 * 60 * 1000,
          );
          const lease = {
            schema_version: 2,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            approval_run_id: process.env.APPROVAL_RUN_ID,
            approval_run_attempt: process.env.APPROVAL_RUN_ATTEMPT,
            stripe_readiness_run_id: process.env.STRIPE_READINESS_RUN_ID,
            stripe_readiness_run_attempt:
              process.env.STRIPE_READINESS_RUN_ATTEMPT,
            stripe_readiness_sha256: process.env.STRIPE_READINESS_SHA256,
            stripe_readiness_artifact_id:
              process.env.STRIPE_READINESS_ARTIFACT_ID,
            stripe_readiness_artifact_digest:
              process.env.STRIPE_READINESS_ARTIFACT_DIGEST,
            stripe_readiness_checked_at:
              process.env.STRIPE_READINESS_CHECKED_AT,
            production_run_id: process.env.GITHUB_RUN_ID,
            production_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            approval_nonce: process.env.APPROVAL_NONCE,
            nonce: randomBytes(32).toString("hex"),
            issued_at: issuedAt.toISOString(),
            expires_at: new Date(Math.min(
              issuedAt.getTime() + 15 * 60 * 1000,
              readinessExpiresAt.getTime(),
            )).toISOString(),
          };
          writeFileSync(
            "production-mutation-lease.json",
            `${JSON.stringify(lease, null, 2)}\n`,
          );
          NODE
          npm run --silent release:validate -- mutation-lease \
            --file production-mutation-lease.json \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$SOURCE_TREE" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --approval-nonce "$APPROVAL_NONCE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            --approval-run-id "$APPROVAL_RUN_ID" \
            --approval-run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --production-run-id "$GITHUB_RUN_ID" \
            --production-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --stripe-readiness-run-id "$STRIPE_READINESS_RUN_ID" \
            --stripe-readiness-run-attempt "$STRIPE_READINESS_RUN_ATTEMPT" \
            --stripe-readiness-sha256 "$STRIPE_READINESS_SHA256" \
            --stripe-readiness-artifact-id "$STRIPE_READINESS_ARTIFACT_ID" \
            --stripe-readiness-artifact-digest "$STRIPE_READINESS_ARTIFACT_DIGEST"
          artifact_name="production-mutation-lease-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-edge"
          echo "mutation_lease_artifact=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload renewed Edge mutation lease
        id: edge_lease_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.edge_lease.outputs.mutation_lease_artifact }}
          path: production-mutation-lease.json
          if-no-files-found: error
          retention-days: 1

      - name: Create signed Edge mutation lease binding
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.edge_lease_upload.outputs.artifact-digest }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.edge_lease_upload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_NAME: ${{ steps.edge_lease.outputs.mutation_lease_artifact }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate.outputs.source_tree }}
        run: |
          set -euo pipefail
          mkdir -p edge-lease-binding edge-lease-binding-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > edge-lease-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > edge-lease-binding-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root production-mutation-lease.json \
            --out edge-lease-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/deploy-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$PAYLOAD_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding edge-lease-binding/release-artifact-binding.json \
            --payload-root production-mutation-lease.json \
            --artifact-metadata edge-lease-binding-metadata/artifact.json \
            --producer-run edge-lease-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/deploy-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$PAYLOAD_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > edge-lease-binding/verification.json

      - name: Upload Edge mutation lease binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.edge_lease.outputs.mutation_lease_artifact }}-binding
          path: edge-lease-binding/
          if-no-files-found: error
          retention-days: 1

  deploy-production-edge:
