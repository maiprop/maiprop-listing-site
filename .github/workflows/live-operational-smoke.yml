name: Live Public Read-Only Smoke

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-public-read-only-smoke
  cancel-in-progress: true

jobs:
  public-read-only-smoke:
    name: Public GET and HEAD health checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_BASE_URL: https://portal.maiprop.co
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.5"

      - name: Run unauthenticated public read-only checks
        shell: bash
        run: |
          node <<'NODE'
          const baseUrl = new URL(process.env.PUBLIC_BASE_URL);
          if (
            baseUrl.protocol !== "https:" ||
            baseUrl.hostname !== "portal.maiprop.co"
          ) {
            throw new Error(`Unexpected public smoke origin: ${baseUrl.origin}`);
          }

          const probes = [
            { path: "/", method: "HEAD", expectsJson: false },
            {
              path: "/api/public/listings?limit=1",
              method: "GET",
              expectsJson: true,
            },
            {
              path: "/api/public/auctions?limit=1",
              method: "GET",
              expectsJson: true,
            },
            {
              path: "/api/public/open-houses?limit=1",
              method: "GET",
              expectsJson: true,
            },
            {
              path: "/api/public/homepage?section=listing_counts",
              method: "GET",
              expectsJson: true,
            },
          ];

          for (const probe of probes) {
            const target = new URL(probe.path, baseUrl);
            let lastFailure = "not attempted";

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(target, {
                  method: probe.method,
                  headers: {
                    Accept: probe.expectsJson
                      ? "application/json"
                      : "text/html,application/xhtml+xml",
                    "User-Agent": "maiprop-public-read-only-smoke/1.0",
                  },
                  signal: AbortSignal.timeout(15_000),
                });

                if (!response.ok) {
                  lastFailure = `HTTP ${response.status}`;
                } else if (probe.expectsJson) {
                  const payload = await response.json();
                  if (!payload || typeof payload !== "object") {
                    lastFailure = "response is not a JSON object";
                  } else {
                    lastFailure = "";
                  }
                } else {
                  lastFailure = "";
                }
              } catch (error) {
                lastFailure =
                  error instanceof Error ? error.message : String(error);
              }

              if (!lastFailure) {
                console.log(
                  `Public read-only probe passed: ${probe.method} ${target.pathname}${target.search}`,
                );
                break;
              }

              if (attempt < 3) {
                await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
              }
            }

            if (lastFailure) {
              throw new Error(
                `Public read-only probe failed: ${probe.method} ${target.pathname}${target.search}: ${lastFailure}`,
              );
            }
          }
          NODE
