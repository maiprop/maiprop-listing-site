name: Live Public Read-Only Smoke

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-public-read-only-smoke
  cancel-in-progress: true

jobs:
  public-read-only-smoke:
    name: Public GET and HEAD health checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_BASE_URL: https://portal.maiprop.co
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.5"

      - name: Run unauthenticated public read-only checks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = new URL(process.env.PUBLIC_BASE_URL);
          const API_MAX_MS = 3_500;
          if (
            baseUrl.protocol !== "https:" ||
            baseUrl.hostname !== "portal.maiprop.co"
          ) {
            throw new Error(`Unexpected public smoke origin: ${baseUrl.origin}`);
          }

          const probes = [
            { path: "/", method: "HEAD", expectsJson: false },
            {
              path: "/api/public/listings?limit=1",
              method: "GET",
              expectsJson: true,
              shape: "data-array",
            },
            {
              path: "/api/public/auctions?limit=1",
              method: "GET",
              expectsJson: true,
              shape: "data-array",
            },
            {
              path: "/api/public/open-houses?limit=1",
              method: "GET",
              expectsJson: true,
              shape: "array",
            },
            {
              path: "/api/public/homepage?section=type-counts",
              method: "GET",
              expectsJson: true,
              shape: "object",
            },
          ];

          for (const probe of probes) {
            const target = new URL(probe.path, baseUrl);
            let lastFailure = "not attempted";
            let lastElapsedMs = 0;
            let lastAttempt = 0;

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const startedAt = performance.now();
              let elapsedMs = 0;
              let retryable = false;
              let responseReceived = false;
              try {
                const response = await fetch(target, {
                  method: probe.method,
                  headers: {
                    Accept: probe.expectsJson
                      ? "application/json"
                      : "text/html,application/xhtml+xml",
                    "User-Agent": "maiprop-public-read-only-smoke/1.0",
                  },
                  signal: AbortSignal.timeout(15_000),
                });
                responseReceived = true;

                if (!response.ok) {
                  lastFailure = `HTTP ${response.status}`;
                  retryable = response.status >= 500 && response.status <= 599;
                } else if (probe.expectsJson) {
                  const payload = await response.json();
                  if (!payload || typeof payload !== "object") {
                    lastFailure = "response is not a JSON object or array";
                  } else if (
                    Object.prototype.hasOwnProperty.call(payload, "error")
                  ) {
                    lastFailure = "response contains an application error";
                  } else if (
                    probe.shape === "data-array" &&
                    !Array.isArray(payload.data)
                  ) {
                    lastFailure = "response data is not an array";
                  } else if (
                    probe.shape === "array" &&
                    !Array.isArray(payload)
                  ) {
                    lastFailure = "response is not an array";
                  } else if (
                    probe.shape === "object" &&
                    Array.isArray(payload)
                  ) {
                    lastFailure = "response is an array, expected an object";
                  } else {
                    lastFailure = "";
                  }
                } else {
                  lastFailure = "";
                }
              } catch (error) {
                lastFailure =
                  error instanceof Error ? error.message : String(error);
                retryable = !responseReceived;
              }

              elapsedMs = Math.round(performance.now() - startedAt);
              if (probe.expectsJson && elapsedMs > API_MAX_MS) {
                lastFailure = `elapsed ${elapsedMs} ms exceeded API ceiling ${API_MAX_MS} ms`;
                retryable = false;
              }
              lastElapsedMs = elapsedMs;
              lastAttempt = attempt;

              console.log(
                `Public read-only probe attempt: ${probe.method} ${target.pathname}${target.search} (attempt ${attempt}, ${elapsedMs} ms): ${lastFailure || "passed"}`,
              );

              if (!lastFailure) {
                console.log(
                  `Public read-only probe passed: ${probe.method} ${target.pathname}${target.search} (attempt ${attempt}, ${elapsedMs} ms)`,
                );
                break;
              }

              if (retryable && attempt < 3) {
                await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
              } else {
                break;
              }
            }

            if (lastFailure) {
              throw new Error(
                `Public read-only probe failed: ${probe.method} ${target.pathname}${target.search} (attempt ${lastAttempt}, ${lastElapsedMs} ms): ${lastFailure}`,
              );
            }
          }
          NODE
