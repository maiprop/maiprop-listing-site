            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$STAGING_SUPABASE_PROJECT_ID/api-keys" \
            > /tmp/staging-api-keys.json
          service_role_key="$(jq -r '
            (if type == "array" then . else (.keys // .result // []) end)
            | map(select((.name // .role // .id // "") == "service_role"))
            | .[0]
            | (.api_key // .key // .value // empty)
          ' /tmp/staging-api-keys.json)"
          if [ -z "$service_role_key" ]; then
            echo "::error::Could not resolve the staging service-role key."
            exit 1
          fi
          echo "::add-mask::$service_role_key"
          STAGING_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            npm run staging:prove-storage-cleanup \
            > staging-storage-cleanup-proof.json
          jq -e '.ok == true' staging-storage-cleanup-proof.json >/dev/null

      - name: Create staged business proof envelope
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          ARTIFACT_SHA256: ${{ needs.validate-source.outputs.artifact_sha256 }}
        run: |
          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg artifact_sha256 "$ARTIFACT_SHA256" \
            --slurpfile listings staging-listing-tenant-proof.json \
            --slurpfile projects staging-project-tenant-proof.json \
            --slurpfile promotions staging-promotion-proof.json \
            --slurpfile storage staging-storage-cleanup-proof.json \
            '{
              schema_version: 1,
              evidence_type: "maiprop-staging-business-proofs",
              release_sha: $release_sha,
              artifact_sha256: $artifact_sha256,
              proofs: {
                listings: $listings[0],
                projects: $projects[0],
                promotions: $promotions[0],
                storage: $storage[0]
              }
            }' > staging-business-proof.json

      - name: Upload staged business proofs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-business-proofs-${{ needs.validate-source.outputs.release_sha }}
          path: staging-*-proof.json
          if-no-files-found: error
          retention-days: 30

