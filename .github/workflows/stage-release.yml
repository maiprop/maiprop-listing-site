      - name: Upload final release candidate attestation
        id: final_attestation_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-attestation-${{ needs.validate-source.outputs.release_sha }}-${{ github.run_attempt }}
          path: release-candidate-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Create and verify final release candidate binding
        env:
          FINAL_ARTIFACT_DIGEST: ${{ steps.final_attestation_upload.outputs.artifact-digest }}
          FINAL_ARTIFACT_ID: ${{ steps.final_attestation_upload.outputs.artifact-id }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate-source.outputs.source_tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$FINAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The staging evidence upload did not return an immutable artifact ID."
            exit 1
          fi
          mkdir -p final-release-binding final-release-binding-metadata
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_ARTIFACT_ID" \
            > final-release-binding-metadata/artifact.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > final-release-binding-metadata/run.json
          artifact_name="release-candidate-attestation-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}"
          node scripts/create-release-artifact-binding.mjs \
            --payload-root release-candidate-attestation.json \
            --out final-release-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/stage-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$FINAL_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$FINAL_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding final-release-binding/release-artifact-binding.json \
            --payload-root release-candidate-attestation.json \
            --artifact-metadata final-release-binding-metadata/artifact.json \
            --producer-run final-release-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/stage-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$FINAL_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$FINAL_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > final-release-binding/verification.json

      - name: Upload final release candidate binding
        id: final_binding_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-attestation-${{ needs.validate-source.outputs.release_sha }}-${{ github.run_attempt }}-binding
          path: final-release-binding/
          if-no-files-found: error
          retention-days: 30

      - name: Record attested staging release
        run: |
          {
            echo "### Release candidate attested"
            echo
            echo "Exact SHA: \`${{ needs.validate-source.outputs.release_sha }}\`"
            echo "Artifact digest: \`${{ needs.validate-source.outputs.artifact_sha256 }}\`"
            echo "Staging Pages deployment: \`${{ needs.cloudflare-staging.outputs.deployment_id }}\`"
            echo "Signed staging binding artifact ID: ${{ steps.final_binding_upload.outputs.artifact-id }}"
            echo
            echo "Production remains disabled until an independent approval artifact and protected production gate are available."
          } >> "$GITHUB_STEP_SUMMARY"
