  release-candidate-attested:
    name: Release candidate attested
    needs:
      - validate-source
      - supabase-staging
      - cloudflare-staging
      - staging-business-proofs
      - staging-live-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-source.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download source provenance verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-provenance-verification-${{ needs.validate-source.outputs.release_sha }}
          path: evidence/provenance

      - name: Download Supabase staging attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supabase-staging-edge-attestation-${{ needs.validate-source.outputs.release_sha }}
          path: evidence/supabase

      - name: Download Cloudflare staging attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudflare-staging-attestation-${{ needs.validate-source.outputs.release_sha }}
          path: evidence/cloudflare

      - name: Download staged business proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-business-proofs-${{ needs.validate-source.outputs.release_sha }}
          path: evidence/business

      - name: Download staging live security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-live-security-${{ needs.validate-source.outputs.release_sha }}
          path: evidence/security

      - name: Revalidate main lease before final attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/production-release-validation.mjs github-staging-lease \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ needs.validate-source.outputs.release_sha }}" \
            --source-run-id "${{ needs.validate-source.outputs.source_run_id }}" \
            --source-run-attempt "${{ needs.validate-source.outputs.source_run_attempt }}"

      - name: Require exact signer workflow digest
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::The staging signer workflow SHA $GITHUB_SHA does not match release SHA $RELEASE_SHA."
            exit 1
          fi

      - name: Create final exact-SHA staging attestation
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate-source.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ needs.validate-source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate-source.outputs.source_run_attempt }}
          ARTIFACT_SHA256: ${{ needs.validate-source.outputs.artifact_sha256 }}
          MANIFEST_SHA256: ${{ needs.validate-source.outputs.manifest_sha256 }}
          PAYLOAD_SHA256: ${{ needs.validate-source.outputs.payload_sha256 }}
          STAGING_RUN_ID: ${{ github.run_id }}
          STAGING_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const read = (path) => {
            const bytes = readFileSync(path);
            return {
              value: JSON.parse(bytes.toString("utf8")),
              sha256: createHash("sha256").update(bytes).digest("hex"),
            };
          };
          const provenanceEvidence = read("evidence/provenance/provenance-verification.json");
          const supabaseEvidence = read("evidence/supabase/supabase-staging-edge-attestation.json");
          const cloudflareEvidence = read("evidence/cloudflare/cloudflare-staging-attestation.json");
          const businessEvidence = read("evidence/business/staging-business-proof.json");
          const securityEvidence = read("evidence/security/staging-live-security-proof.json");
          const provenance = provenanceEvidence.value;
          const supabase = supabaseEvidence.value;
          const cloudflare = cloudflareEvidence.value;
          const business = businessEvidence.value;
          const security = securityEvidence.value;
          const database = supabase.database;
          const expectedSha = process.env.RELEASE_SHA;
          const expectedArtifact = process.env.ARTIFACT_SHA256;
          const expectedManifest = process.env.MANIFEST_SHA256;
          const provenanceSubjects = Array.isArray(provenance)
            ? provenance.flatMap(
                (entry) => entry?.verificationResult?.statement?.subject ?? [],
              )
            : [];
          const expectedProofNames = [
            "listings",
            "projects",
            "promotions",
            "storage",
          ];
           const proofNames = Object.keys(business.proofs ?? {}).sort();
           const stableHostname = new URL(cloudflare.stable_url).hostname;
           const stableOriginBound =
             cloudflare.project_subdomain === stableHostname ||
             (cloudflare.project_domains ?? []).some(
               (domain) =>
                 domain?.name === stableHostname && domain?.status === "active",
             );
          for (const [label, evidence] of Object.entries({
            supabase,
            cloudflare,
            business,
            security,
          })) {
            if (
              evidence.release_sha !== expectedSha ||
              evidence.artifact_sha256 !== expectedArtifact
            ) {
              throw new Error(`${label} staging evidence does not match the exact candidate.`);
            }
          }
          if (
             !database ||
             !provenanceSubjects.some(
               (subject) => subject?.digest?.sha256 === expectedManifest,
             ) ||
             database.release_sha !== expectedSha ||
             database.artifact_sha256 !== expectedArtifact ||
             database.manifest_sha256 !== expectedManifest ||
             supabase.manifest_sha256 !== expectedManifest ||
             database.supabase_sha256 !== supabase.supabase_sha256 ||
             !/^[0-9a-f]{64}$/.test(supabase.supabase_sha256 ?? "") ||
             supabase.edge_source_manifest?.release_sha !== expectedSha ||
             !/^[0-9a-f]{64}$/.test(
               supabase.edge_source_manifest?.manifest_sha256 ?? "",
             ) ||
             database.schema_version !== 2 ||
             !Number.isSafeInteger(database.pgtap_plan) ||
             database.pgtap_plan < 1 ||
             database.pgtap_ok_count !== database.pgtap_plan ||
             !/^[0-9a-f]{64}$/.test(database.pgtap_sha256 ?? "") ||
             !Number.isSafeInteger(database.scale_pgtap_plan) ||
             database.scale_pgtap_plan < 1 ||
             database.scale_pgtap_ok_count !== database.scale_pgtap_plan ||
             !/^[0-9a-f]{64}$/.test(
