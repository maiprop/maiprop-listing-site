          STAGING_STORAGE_PROOF_ACK: staging-only
          STAGING_MUTATION_ACKNOWLEDGEMENT: ${{ vars.STAGING_MUTATION_ACKNOWLEDGEMENT }}
        run: |
          set -euo pipefail
          node scripts/assert-staging-mutation-target.mjs
