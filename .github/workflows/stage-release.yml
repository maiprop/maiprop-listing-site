          PLAYWRIGHT_BASE_URL: ${{ needs.cloudflare-staging.outputs.stable_url }}
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/maiprop-staging-live-security-results
          PLAYWRIGHT_JSON_OUTPUT_FILE: staging-live-security-playwright.json
          E2E_SECURITY_USE_ISOLATED_STAGING: "true"
          E2E_ALLOW_DESTRUCTIVE_LIVE_TESTS: "true"
          E2E_ALLOWED_DESTRUCTIVE_PROJECT_REFS: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          RLS_USER_A_EMAIL: buyer.free@maiprop.demo
          RLS_USER_B_EMAIL: seller.pro@maiprop.demo
          RLS_USER_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          RLS_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
