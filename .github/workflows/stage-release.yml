        run: |
          set -euo pipefail
          node scripts/assert-staging-mutation-target.mjs
          service_role_key="$(
            curl -fsS --retry 3 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$STAGING_SUPABASE_PROJECT_ID/api-keys?reveal=true" \
              | jq -er '
                  (if type == "array" then . else (.keys // .result // []) end)
                  | map(select(
                      (.type // "") == "secret" or
                      (.name // .role // .id // "") == "service_role"
                    ))
                  | sort_by(if (.type // "") == "secret" then 0 else 1 end)
                  | .[0]
                  | (.api_key // .key // .value // empty)
                '
          )"
          if [ "$service_role_key" = "$STAGING_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Resolved staging service credential equals the publishable key."
            exit 1
          fi
          echo "::add-mask::$service_role_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            npx playwright test \
              e2e/rls-security.spec.ts \
              e2e/gdpr-delete-account.spec.ts \
              e2e/onboarding-role-selection.spec.ts \
              --project=chromium \
              --reporter=json
          unset service_role_key

      - name: Create minimized staging live security evidence
        id: evidence
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          ARTIFACT_SHA256: ${{ needs.validate-source.outputs.artifact_sha256 }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_APP_URL: ${{ needs.cloudflare-staging.outputs.stable_url }}
          PLAYWRIGHT_JSON_REPORT: staging-live-security-playwright.json
          STAGING_LIVE_SECURITY_EVIDENCE: staging-live-security-proof.json
        run: |
          set -euo pipefail
          node scripts/staging-live-security-evidence.mjs
          jq -e '.ok == true' staging-live-security-proof.json >/dev/null
          artifact_name="staging-live-security-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload staging live security evidence and raw report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: |
            staging-live-security-proof.json
            staging-live-security-playwright.json
          if-no-files-found: error
          retention-days: 30

  staging-catalogue-performance:
    name: Prove exact-SHA staging catalogues and performance
    environment: staging
    needs:
      - validate-source
      - supabase-staging
      - cloudflare-staging
      - staging-n-minus-one-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.proof.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-source.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned catalogue proof tooling
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Install Chromium for catalogue proof
        run: npx playwright install --with-deps chromium

      - name: Resolve IPv4 staging auction database endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          STAGING_MUTATION_ACKNOWLEDGEMENT: ${{ vars.STAGING_MUTATION_ACKNOWLEDGEMENT }}
        run: |
          set -euo pipefail
          project_json="$(mktemp "$RUNNER_TEMP/staging-auction-project.XXXXXX.json")"
          trap 'rm -f -- "$project_json"' EXIT
          curl -fsS --retry 3 --connect-timeout 10 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$STAGING_SUPABASE_PROJECT_ID" \
            > "$project_json"
          resolved_url="$(PROJECT_JSON_FILE="$project_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { normalizeDatabaseUrlTls } from "./scripts/catalogue-hotfix-workflow-helpers.mjs";

          const projectRef = process.env.STAGING_SUPABASE_PROJECT_ID;
          const current = new URL(
            normalizeDatabaseUrlTls(process.env.SUPABASE_STAGING_DB_URL),
          );
          if (current.hostname.endsWith(".pooler.supabase.com")) {
            process.stdout.write(current.toString());
            process.exit(0);
          }
          if (current.hostname !== `db.${projectRef}.supabase.co`) {
            throw new Error("Staging database URL is not bound to the staging project.");
          }
          const project = JSON.parse(
            readFileSync(process.env.PROJECT_JSON_FILE, "utf8"),
          );
          const region = String(project.region ?? "");
          if (!/^[a-z0-9-]+$/.test(region)) {
            throw new Error("Could not resolve the staging Supabase region.");
          }
          const pooler = new URL("postgresql://postgres:postgres@example.invalid/postgres");
          pooler.username = `postgres.${projectRef}`;
          pooler.password = decodeURIComponent(current.password);
          pooler.hostname = `aws-0-${region}.pooler.supabase.com`;
          pooler.port = "5432";
          pooler.searchParams.set("sslmode", "require");
          process.stdout.write(pooler.toString());
          NODE
          )"
          echo "::add-mask::$resolved_url"
          node scripts/assert-staging-mutation-target.mjs \
            --project-ref "$STAGING_SUPABASE_PROJECT_ID" \
            --database-url "$resolved_url" \
            --acknowledgement "$STAGING_MUTATION_ACKNOWLEDGEMENT"
          echo "SUPABASE_STAGING_EFFECTIVE_DB_URL=$resolved_url" >> "$GITHUB_ENV"

      - name: Seed exact-SHA staging auction proof fixtures
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_MUTATION_ACKNOWLEDGEMENT: ${{ vars.STAGING_MUTATION_ACKNOWLEDGEMENT }}
        run: node scripts/staging-auction-fixtures.mjs seed

      - name: Run endpoint, route, CWV, and query proofs
        id: proof
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          ARTIFACT_SHA256: ${{ needs.validate-source.outputs.artifact_sha256 }}
          DEPLOYMENT_URL: ${{ needs.cloudflare-staging.outputs.deployment_url }}
          STABLE_URL: ${{ needs.cloudflare-staging.outputs.stable_url }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          PRODUCTION_DEPLOY_SITE_LOCK_PASSWORD: ${{ secrets.STAGING_SITE_LOCK_PASSWORD }}
          STAGING_SITE_LOCK_PASSWORD: ${{ secrets.STAGING_SITE_LOCK_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for value in \
            "$RELEASE_SHA" \
            "$ARTIFACT_SHA256" \
            "$DEPLOYMENT_URL" \
            "$STABLE_URL" \
            "$STAGING_SUPABASE_PROJECT_ID"; do
            if [ -z "$value" ]; then
              echo "::error::Exact-SHA catalogue proof requires immutable staging identity."
              exit 1
            fi
          done
          if { [ -z "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; } ||
             { [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -z "$CF_ACCESS_CLIENT_SECRET" ]; }; then
            echo "::error::Cloudflare Access service-token credentials must be configured together."
            exit 1
          fi
          for secret in \
            "$PRODUCTION_DEPLOY_SITE_LOCK_PASSWORD" \
            "$CF_ACCESS_CLIENT_ID" \
            "$CF_ACCESS_CLIENT_SECRET"; do
            if [ -n "$secret" ]; then
              echo "::add-mask::$secret"
            fi
          done
          mkdir -p staging-catalogue-performance

          PRODUCTION_DEPLOY_EXPECTED_SHA="$RELEASE_SHA" \
          PRODUCTION_DEPLOY_CHECK_ATTEMPTS=12 \
          PRODUCTION_DEPLOY_CHECK_DELAY_MS=10000 \
            npm run --silent check:production-deploy -- \
              "$DEPLOYMENT_URL" \
              "$STABLE_URL" \
              --browser \
              --public-api \
              > staging-catalogue-performance/endpoint-budget-report.json

          CI=true \
          MAIPROP_RUN_STAGING_CATALOGUE_GATES=1 \
          MAIPROP_STAGING_RELEASE_SHA="$RELEASE_SHA" \
          PLAYWRIGHT_BASE_URL="$DEPLOYMENT_URL" \
          PLAYWRIGHT_JSON_OUTPUT_FILE=staging-catalogue-performance/route-e2e-report.json \
            npx playwright test \
              e2e/staging-catalogue-gates.spec.ts \
              --project=chromium \
              --workers=1 \
              --reporter=json

          CI=true \
          MAIPROP_RUNNING_PERF_GATE=1 \
          MAIPROP_STAGING_RELEASE_SHA="$RELEASE_SHA" \
          MAIPROP_CWV_EVIDENCE_PATH=staging-catalogue-performance/cwv-measurements.json \
          MAIPROP_QUERY_EVIDENCE_PATH=staging-catalogue-performance/query-measurements.json \
          PLAYWRIGHT_BASE_URL="$DEPLOYMENT_URL" \
          PLAYWRIGHT_JSON_OUTPUT_FILE=staging-catalogue-performance/cwv-query-report.json \
            npx playwright test \
              e2e/performance-gates.spec.ts \
              e2e/query-budget-gates.spec.ts \
              --project=chromium \
              --workers=1 \
              --reporter=json

          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const root = "staging-catalogue-performance";
          const read = (name) => {
            const bytes = readFileSync(`${root}/${name}`);
            return {
              value: JSON.parse(bytes.toString("utf8")),
              sha256: createHash("sha256").update(bytes).digest("hex"),
            };
          };
          const completeStats = (report, minimum = 1) => {
            const stats = report.value.stats ?? {};
            return Number.isSafeInteger(stats.expected) &&
              stats.expected >= minimum &&
              stats.skipped === 0 &&
              stats.unexpected === 0 &&
              stats.flaky === 0;
          };
          const endpoint = read("endpoint-budget-report.json");
          const routeReport = read("route-e2e-report.json");
          const perfReport = read("cwv-query-report.json");
          const cwv = read("cwv-measurements.json");
          const query = read("query-measurements.json");
          const releaseSha = process.env.RELEASE_SHA;
          const deploymentOrigin = new URL(process.env.DEPLOYMENT_URL).origin;
          const stableOrigin = new URL(process.env.STABLE_URL).origin;
          const endpointTargets = new Map(
            (endpoint.value.targets ?? []).map((target) => [
              new URL(target.baseUrl).origin,
              target,
            ]),
          );
          const deploymentTarget = endpointTargets.get(deploymentOrigin);
          const stableTarget = endpointTargets.get(stableOrigin);
          const endpointsPass = (target) =>
            target?.status === "passed" &&
            target?.publicApi?.status === "passed" &&
            Array.isArray(target.publicApi.endpoints) &&
            target.publicApi.endpoints.length > 0 &&
            target.publicApi.endpoints.every((entry) => entry?.status === "passed");
          if (
            endpoint.value.status !== "passed" ||
            !endpointsPass(deploymentTarget) ||
            !endpointsPass(stableTarget) ||
            !completeStats(routeReport) ||
            !completeStats(perfReport, 4) ||
            cwv.value.schema_version !== 1 ||
            cwv.value.evidence_type !== "maiprop-cwv-route-measurements" ||
            cwv.value.release_sha !== releaseSha ||
            cwv.value.complete !== true ||
            query.value.schema_version !== 1 ||
            query.value.evidence_type !== "maiprop-query-route-measurements" ||
            query.value.release_sha !== releaseSha ||
            query.value.complete !== true
          ) {
            throw new Error("Exact-SHA catalogue proof reports are incomplete.");
          }
          const requiredRoutes = ["/", "/listings", "/auctions", "/open-houses"];
          const cwvByRoute = new Map(
            (cwv.value.routes ?? []).map((entry) => [entry.path, entry]),
          );
          const queryByRoute = new Map(
            (query.value.routes ?? []).map((entry) => [entry.path, entry]),
          );
          const routes = {};
          for (const route of requiredRoutes) {
            const cwvEntry = cwvByRoute.get(route);
            const queryEntry = queryByRoute.get(route);
            if (!cwvEntry?.passed || !queryEntry?.passed) {
              throw new Error(`Catalogue route ${route} did not satisfy its performance budget.`);
            }
            routes[route] = {
              lcp_ms: cwvEntry.measurements.lcp_ms,
              cls: cwvEntry.measurements.cls,
              inp_ms: cwvEntry.measurements.inp_ms,
              forbidden_authority_requests:
                queryEntry.measurements.forbidden_authority_fallbacks,
              query: {
                auth: queryEntry.measurements.auth,
                rest: queryEntry.measurements.rest,
                functions: queryEntry.measurements.functions,
                total: queryEntry.measurements.total,
                budget: queryEntry.budgets,
              },
            };
          }
          const measurements = {
            schema_version: 1,
            evidence_type: "maiprop-staging-catalogue-route-measurements",
            release_sha: releaseSha,
            routes,
            source_sha256: {
              cwv: cwv.sha256,
              query: query.sha256,
            },
          };
          const measurementBytes = Buffer.from(
            `${JSON.stringify(measurements, null, 2)}\n`,
          );
          writeFileSync(`${root}/catalogue-route-measurements.json`, measurementBytes);
          const stats = (report) => report.value.stats ?? {};
          const routeStats = stats(routeReport);
          const perfStats = stats(perfReport);
          const budget = cwvByRoute.get("/").budgets;
          const evidence = {
            schema_version: 1,
            evidence_type: "maiprop-staging-catalogue-performance",
            release_sha: releaseSha,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            ok: true,
            target: {
              supabase_project_ref: process.env.STAGING_SUPABASE_PROJECT_ID,
              deployment_origin: deploymentOrigin,
              stable_origin: stableOrigin,
            },
            endpoint_budget: {
              deployment_status: deploymentTarget.status,
              stable_status: stableTarget.status,
              deployment_report_sha256: endpoint.sha256,
              stable_report_sha256: endpoint.sha256,
            },
            route_e2e: {
              expected: routeStats.expected,
              skipped: routeStats.skipped,
              unexpected: routeStats.unexpected,
              flaky: routeStats.flaky,
              report_sha256: routeReport.sha256,
              forbidden_authority_requests: 0,
            },
            cwv_query: {
              expected: perfStats.expected,
              skipped: perfStats.skipped,
              unexpected: perfStats.unexpected,
              flaky: perfStats.flaky,
              report_sha256: perfReport.sha256,
              measurements_sha256: createHash("sha256")
                .update(measurementBytes)
                .digest("hex"),
              budgets: {
                lcp_ms: budget.lcp_ms,
                cls: budget.cls,
                inp_ms: budget.inp_ms,
              },
              routes,
            },
          };
          writeFileSync(
            `${root}/catalogue-performance-evidence.json`,
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
          artifact_name="staging-catalogue-performance-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Cleanup exact-SHA staging auction proof fixtures
        if: always()
        env:
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_MUTATION_ACKNOWLEDGEMENT: ${{ vars.STAGING_MUTATION_ACKNOWLEDGEMENT }}
        run: node scripts/staging-auction-fixtures.mjs cleanup

      - name: Upload exact-SHA catalogue performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: staging-catalogue-performance/
          if-no-files-found: error
          retention-days: 30

  release-candidate-attested:
    name: Release candidate attested
    environment: staging
    if: github.run_attempt == 1 && github.actor == github.triggering_actor
    needs:
      - validate-source
      - supabase-staging
      - cloudflare-staging
      - staging-business-proofs
      - staging-stripe-payment
      - staging-live-security
      - staging-n-minus-one-compatibility
      - staging-catalogue-performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-source.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download source provenance verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate-source.outputs.provenance_artifact }}
          path: evidence/provenance

      - name: Download Supabase staging attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.supabase-staging.outputs.edge_attestation_artifact_id }}
          merge-multiple: true
          path: evidence/supabase

      - name: Download Cloudflare staging attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.cloudflare-staging.outputs.attestation_artifact }}
          path: evidence/cloudflare

      - name: Download staged business proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.staging-business-proofs.outputs.artifact_name }}
          path: evidence/business

      - name: Download staged Stripe payment proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.staging-stripe-payment.outputs.artifact_name }}
          path: evidence/stripe-payment

      - name: Download staging live security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.staging-live-security.outputs.artifact_name }}
          path: evidence/security

      - name: Download staging N-1 compatibility evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.staging-n-minus-one-compatibility.outputs.artifact_name }}
          path: evidence/n-minus-one

      - name: Download exact-SHA catalogue performance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.staging-catalogue-performance.outputs.artifact_name }}
          path: evidence/catalogue-performance

      - name: Revalidate main lease before final attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/production-release-validation.mjs github-staging-lease \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ needs.validate-source.outputs.release_sha }}" \
            --source-run-id "${{ needs.validate-source.outputs.source_run_id }}" \
            --source-run-attempt "${{ needs.validate-source.outputs.source_run_attempt }}"

      - name: Require exact signer workflow digest
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::The staging signer workflow SHA $GITHUB_SHA does not match release SHA $RELEASE_SHA."
            exit 1
          fi

      - name: Create final exact-SHA staging attestation
        env:
          RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          SOURCE_TREE: ${{ needs.validate-source.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ needs.validate-source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate-source.outputs.source_run_attempt }}
          ARTIFACT_SHA256: ${{ needs.validate-source.outputs.artifact_sha256 }}
          MANIFEST_SHA256: ${{ needs.validate-source.outputs.manifest_sha256 }}
          PAYLOAD_SHA256: ${{ needs.validate-source.outputs.payload_sha256 }}
          STAGING_RUN_ID: ${{ github.run_id }}
          STAGING_RUN_ATTEMPT: ${{ github.run_attempt }}
          SUPABASE_ARTIFACT_NAME: ${{ needs.supabase-staging.outputs.edge_attestation_artifact }}
          SUPABASE_ARTIFACT_ID: ${{ needs.supabase-staging.outputs.edge_attestation_artifact_id }}
          SUPABASE_ARTIFACT_DIGEST: ${{ needs.supabase-staging.outputs.edge_attestation_artifact_digest }}
          SUPABASE_ARTIFACT_RUN_ID: ${{ needs.supabase-staging.outputs.edge_attestation_run_id }}
          SUPABASE_ARTIFACT_RUN_ATTEMPT: ${{ needs.supabase-staging.outputs.edge_attestation_run_attempt }}
          SUPABASE_ARTIFACT_RELEASE_SHA: ${{ needs.supabase-staging.outputs.edge_attestation_release_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const read = (path) => {
            const bytes = readFileSync(path);
            return {
              value: JSON.parse(bytes.toString("utf8")),
              sha256: createHash("sha256").update(bytes).digest("hex"),
            };
          };
          const provenanceEvidence = read("evidence/provenance/provenance-verification.json");
          const supabaseEvidence = read("evidence/supabase/supabase-staging-edge-attestation.json");
          const cloudflareEvidence = read("evidence/cloudflare/cloudflare-staging-attestation.json");
          const businessEvidence = read("evidence/business/staging-business-proof.json");
          const stripePaymentEvidence = read(
            "evidence/stripe-payment/staging-stripe-payment-proof.json",
          );
          const stripePaymentPlaywright = read(
            "evidence/stripe-payment/staging-stripe-payment-playwright.json",
          );
          const securityEvidence = read("evidence/security/staging-live-security-proof.json");
          const nMinusOneEvidence = read("evidence/n-minus-one/compatibility-evidence.json");
          const cataloguePerformanceEvidence = read(
            "evidence/catalogue-performance/catalogue-performance-evidence.json",
          );
          const securityPlaywright = read(
            "evidence/security/staging-live-security-playwright.json",
          );
          const nMinusOnePlaywright = read(
            "evidence/n-minus-one/playwright-report.json",
          );
          const nMinusOneDeployment = read(
            "evidence/n-minus-one/deploy-verification.json",
          );
          const catalogueEndpoint = read(
            "evidence/catalogue-performance/endpoint-budget-report.json",
          );
          const catalogueRouteReport = read(
            "evidence/catalogue-performance/route-e2e-report.json",
          );
          const catalogueCwvQueryReport = read(
            "evidence/catalogue-performance/cwv-query-report.json",
          );
          const catalogueRouteMeasurements = read(
            "evidence/catalogue-performance/catalogue-route-measurements.json",
          );
          const provenance = provenanceEvidence.value;
          const supabase = supabaseEvidence.value;
          const cloudflare = cloudflareEvidence.value;
          const business = businessEvidence.value;
          const stripePayment = stripePaymentEvidence.value;
          const security = securityEvidence.value;
          const nMinusOne = nMinusOneEvidence.value;
          const cataloguePerformance = cataloguePerformanceEvidence.value;
          const database = supabase.database;
          const expectedSha = process.env.RELEASE_SHA;
          const expectedArtifact = process.env.ARTIFACT_SHA256;
          const expectedManifest = process.env.MANIFEST_SHA256;
          const supabaseArtifactBinding = {
            name: process.env.SUPABASE_ARTIFACT_NAME,
            id: process.env.SUPABASE_ARTIFACT_ID,
            digest: process.env.SUPABASE_ARTIFACT_DIGEST?.toLowerCase(),
            run_id: process.env.SUPABASE_ARTIFACT_RUN_ID,
            run_attempt: process.env.SUPABASE_ARTIFACT_RUN_ATTEMPT,
            release_sha: process.env.SUPABASE_ARTIFACT_RELEASE_SHA?.toLowerCase(),
          };
          const expectedSupabaseArtifactName =
            `supabase-staging-edge-attestation-${expectedSha}-${process.env.STAGING_RUN_ATTEMPT}`;
          if (
            supabaseArtifactBinding.name !== expectedSupabaseArtifactName ||
            !/^[1-9][0-9]*$/.test(supabaseArtifactBinding.id ?? "") ||
            !/^[0-9a-f]{64}$/.test(supabaseArtifactBinding.digest ?? "") ||
            supabaseArtifactBinding.run_id !== process.env.STAGING_RUN_ID ||
            supabaseArtifactBinding.run_attempt !==
              process.env.STAGING_RUN_ATTEMPT ||
            supabaseArtifactBinding.release_sha !== expectedSha
          ) {
            throw new Error(
              "Supabase staging artifact binding does not match the exact staging run and release SHA.",
            );
          }
          const provenanceManifest = Array.isArray(provenance.files)
            ? provenance.files.find(
                (entry) => entry?.path === "release-manifest.json",
              )
            : null;
          const expectedProofNames = [
            "listings",
            "projects",
            "promotions",
            "storage",
          ];
           const proofNames = Object.keys(business.proofs ?? {}).sort();
           const stableHostname = new URL(cloudflare.stable_url).hostname;
           const stableOriginBound =
             cloudflare.project_subdomain === stableHostname ||
             (cloudflare.project_domains ?? []).some(
               (domain) =>
                 domain?.name === stableHostname && domain?.status === "active",
             );
          const requiredCatalogueRoutes = [
            "/",
            "/listings",
            "/auctions",
            "/open-houses",
          ];
          const catalogueRoutes = cataloguePerformance.cwv_query?.routes;
          const catalogueRouteEvidenceComplete = requiredCatalogueRoutes.every(
            (route) => {
              const measurement = catalogueRoutes?.[route];
              const query = measurement?.query;
              const budget = query?.budget;
