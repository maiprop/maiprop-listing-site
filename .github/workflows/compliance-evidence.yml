name: Standards Evidence

on:
  workflow_dispatch:
    inputs:
      cloudflare_git_deploy_action:
        description: "Verify Git deploy lockout, or explicitly lock both Pages projects before verification"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - lock
      cloudflare_git_deploy_confirmation:
        description: "For lock mode only, type DISABLE_CLOUDFLARE_GIT_DEPLOYS"
        required: false
        type: string
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: read

concurrency:
  group: standards-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect standards evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      SENTRY_ENVIRONMENT: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_STAGING_PAGES_PROJECT: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT }}
      CLOUDFLARE_DNS_MODE: registrar
      CLOUDFLARE_ZONE_NAME: maiprop.co

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run local standards gates
        run: |
          mkdir -p compliance-evidence
          npm run check:standards-readiness | tee compliance-evidence/standards-readiness.txt
          npm run check:github-governance | tee compliance-evidence/github-governance.txt

      - name: Capture GitHub governance evidence
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          gh run list --branch main --limit 20 --json databaseId,workflowName,status,conclusion,createdAt,headSha,url > compliance-evidence/github-actions-main-runs.json
          gh pr list --state open --limit 50 --json number,title,headRefName,baseRefName,mergeStateStatus,isDraft,url > compliance-evidence/github-open-prs.json

          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" > compliance-evidence/main-branch-protection.json 2> compliance-evidence/main-branch-protection.error; then
            node - <<'NODE'
          const fs = require("fs");
          const reason = fs.readFileSync("compliance-evidence/main-branch-protection.error", "utf8").slice(0, 1500);
          fs.writeFileSync("compliance-evidence/main-branch-protection.json", JSON.stringify({
            status: "unverifiable",
            reason,
            remediation: "Verify branch protection in GitHub repository settings or rerun this workflow with an account/plan that can read the endpoint."
          }, null, 2));
          NODE
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > compliance-evidence/code-scanning-open-alerts.json 2> compliance-evidence/code-scanning-open-alerts.error; then
            node - <<'NODE'
          const fs = require("fs");
          const reason = fs.readFileSync("compliance-evidence/code-scanning-open-alerts.error", "utf8").slice(0, 1500);
          fs.writeFileSync("compliance-evidence/code-scanning-open-alerts.json", JSON.stringify({
            status: "unverifiable",
            reason
          }, null, 2));
          NODE
          fi

          npm run capture:github-admin-posture -- --out compliance-evidence/github-admin-posture.json

      - name: Capture Supabase live security evidence
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          npm run check:live-security-posture > compliance-evidence/supabase-live-security.txt

      - name: Capture Sentry live telemetry status
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          npm run capture:sentry-live-evidence -- --strict --out compliance-evidence/sentry-live-evidence.json

      - name: Lock Cloudflare Pages Git deployments
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_git_deploy_action == 'lock' }}
        env:
          LOCK_CONFIRMATION: ${{ inputs.cloudflare_git_deploy_confirmation }}
        run: |
          set -euo pipefail
          if [ "$LOCK_CONFIRMATION" != "DISABLE_CLOUDFLARE_GIT_DEPLOYS" ]; then
            echo "::error::Lock mode requires exact confirmation DISABLE_CLOUDFLARE_GIT_DEPLOYS."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials are required to lock Git deployments."
            exit 1
          fi
          if [ "$CLOUDFLARE_PAGES_PROJECT" != "maiprop-listing-site" ] ||
             [ "$CLOUDFLARE_STAGING_PAGES_PROJECT" != "maiprop-listing-site-staging" ]; then
            echo "::error::Lock mode is restricted to the fixed MaiProp production and staging Pages projects."
            exit 1
          fi

          lock_project() {
            local project="$1"
            curl -fsS --retry 3 \
              --request PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"source":{"config":{"deployments_enabled":false,"production_deployments_enabled":false,"preview_deployment_setting":"none"}}}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
              | jq -e '.success == true' > /dev/null
          }

          lock_project "$CLOUDFLARE_PAGES_PROJECT"
          lock_project "$CLOUDFLARE_STAGING_PAGES_PROJECT"

      - name: Capture strict two-project Cloudflare Pages posture
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          STAGING_PROJECT: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT }}
          PRODUCTION_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials are required to verify Git deployment posture."
            exit 1
          fi
          if [ -z "$STAGING_PROJECT" ] || [ -z "$PRODUCTION_PROJECT" ] ||
             [ "$STAGING_PROJECT" = "$PRODUCTION_PROJECT" ]; then
            echo "::error::Distinct production and staging Pages projects are required."
            exit 1
          fi

          mkdir -p compliance-evidence
          STAGING_PROJECT_FILE="$RUNNER_TEMP/cloudflare-staging-project.json"
          PRODUCTION_PROJECT_FILE="$RUNNER_TEMP/cloudflare-production-project.json"
          trap 'rm -f "$STAGING_PROJECT_FILE" "$PRODUCTION_PROJECT_FILE"' EXIT

          curl -fsS --retry 3 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_STAGING_PAGES_PROJECT" \
            > "$STAGING_PROJECT_FILE"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            > "$PRODUCTION_PROJECT_FILE"

          node scripts/validate-cloudflare-pages-staging-posture.mjs \
            --staging-project-file "$STAGING_PROJECT_FILE" \
            --production-project-file "$PRODUCTION_PROJECT_FILE" \
            --post-state-out compliance-evidence/cloudflare-pages-git-auto-deploy-post-state.json \
            --out compliance-evidence/cloudflare-pages-git-auto-deploy-posture.json

      - name: Capture Cloudflare admin posture
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          npm run capture:cloudflare-admin-posture -- --strict --out compliance-evidence/cloudflare-admin-posture.json

      - name: Check ECAS live evidence rollup
        if: always()
        run: |
          set -euo pipefail
          npm run check:ecas-live-evidence -- --strict --dir compliance-evidence

      - name: Upload standards evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standards-evidence
          path: compliance-evidence/
          if-no-files-found: error
          retention-days: 30
