name: Standards Evidence

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: read

concurrency:
  group: standards-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-current-main:
    name: Verify current main workflow identity
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main_sha: ${{ steps.main.outputs.main_sha }}
    steps:
      - name: Verify workflow SHA is current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if ! [[ "$CURRENT_MAIN" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GitHub returned an invalid current main SHA."
            exit 1
          fi
          if [ "$CURRENT_MAIN" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "::error::Workflow SHA $GITHUB_WORKFLOW_SHA is not current main $CURRENT_MAIN."
            exit 1
          fi
          echo "main_sha=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"

  cloudflare-pages-verify:
    name: Verify Cloudflare Pages Git deployment lockout
    needs: verify-current-main
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cloudflare_pages_post_state_json: ${{ steps.cloudflare_verify.outputs.cloudflare_pages_post_state_json }}
      cloudflare_pages_posture_json: ${{ steps.cloudflare_verify.outputs.cloudflare_pages_posture_json }}
      cloudflare_admin_posture_json: ${{ steps.cloudflare_verify.outputs.cloudflare_admin_posture_json }}
    concurrency:
      group: maiprop-cloudflare-pages-git-deploy-verify
      cancel-in-progress: false
    steps:
      - name: Verify Cloudflare Pages Git deployment lockout
        id: cloudflare_verify
        continue-on-error: true
        env:
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STAGING_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_PAGES_READ_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          EXPECTED_PRODUCTION_PROJECT_ID: ${{ vars.CLOUDFLARE_PAGES_PROJECT_ID }}
          EXPECTED_STAGING_PROJECT_ID: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT_ID }}
        run: |
          set -euo pipefail
          PRODUCTION_PROJECT="maiprop-listing-site"
          STAGING_PROJECT="maiprop-listing-site-staging"
          API_BASE="https://api.cloudflare.com/client/v4"
          RAW_DIR="$RUNNER_TEMP/cloudflare-pages-posture-raw"
          EVIDENCE_DIR="$RUNNER_TEMP/cloudflare-pages-posture-evidence"
          mkdir -p "$RAW_DIR" "$EVIDENCE_DIR"
          trap 'rm -rf "$RAW_DIR"' EXIT

          if [ -z "$CLOUDFLARE_PAGES_READ_TOKEN" ] ||
             [ -z "$CLOUDFLARE_ACCOUNT_ID" ] ||
             [ -z "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" ] ||
             [ -z "$CLOUDFLARE_STAGING_ACCOUNT_ID" ]; then
            echo "::error::Distinct production and staging Cloudflare read credentials and account IDs are required."
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "$CLOUDFLARE_STAGING_ACCOUNT_ID" ]; then
            echo "::error::Production and staging Cloudflare account IDs must be distinct."
            exit 1
          fi
          if [ "$CLOUDFLARE_PAGES_READ_TOKEN" = "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" ]; then
            echo "::error::Production and staging Cloudflare read credentials must be distinct."
            exit 1
          fi
          bootstrap_required=0
          if [ -z "$EXPECTED_PRODUCTION_PROJECT_ID" ] ||
             [ -z "$EXPECTED_STAGING_PROJECT_ID" ]; then
            bootstrap_required=1
          elif [ "$EXPECTED_PRODUCTION_PROJECT_ID" = "$EXPECTED_STAGING_PROJECT_ID" ]; then
            echo "::error::Production and staging Pages project IDs must be distinct."
            exit 1
          fi

          get_project() {
            local read_token="$1"
            local account_id="$2"
            local name="$3"
            local out="$4"
            curl -fsS --retry 3 \
              -H "Authorization: Bearer $read_token" \
              -H "Accept: application/json" \
              "$API_BASE/accounts/$account_id/pages/projects/$name" \
              > "$out"
          }

          validate_identity() {
            local file="$1"
            local name="$2"
            local id="$3"
            jq -e --arg name "$name" --arg id "$id" '
              .success == true and .result.name == $name and
              (.result.id | type == "string" and length > 0) and
              ($id == "" or .result.id == $id) and
              (
                .result.source == null or
                (
                  (.result.source | type == "object") and
                  (.result.source.type == "github" or .result.source.type == "gitlab")
                )
              )
            ' "$file" > /dev/null
          }

          validate_locked() {
            jq -e '
              .result.source == null or
              (
                .result.source.config.deployments_enabled == false and
                .result.source.config.production_deployments_enabled == false and
                .result.source.config.preview_deployment_setting == "none"
              )
            ' "$1" > /dev/null
          }

          minimize_project() {
            local file="$1"
            local out="$2"
            jq '{
              id: .result.id,
              name: .result.name,
              source: (
                if .result.source == null then null else {
                  type: .result.source.type,
                  config: {
                    deployments_enabled: .result.source.config.deployments_enabled,
                    production_deployments_enabled: .result.source.config.production_deployments_enabled,
                    preview_deployment_setting: .result.source.config.preview_deployment_setting
                  }
                } end
              )
            }' "$file" > "$out"
          }

          PRODUCTION_RAW="$RAW_DIR/production.json"
          STAGING_RAW="$RAW_DIR/staging.json"
          PRODUCTION_MIN="$RAW_DIR/production-min.json"
          STAGING_MIN="$RAW_DIR/staging-min.json"
          get_project "$CLOUDFLARE_PAGES_READ_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$PRODUCTION_PROJECT" "$PRODUCTION_RAW"
          get_project "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" "$CLOUDFLARE_STAGING_ACCOUNT_ID" "$STAGING_PROJECT" "$STAGING_RAW"
          validate_identity \
            "$PRODUCTION_RAW" \
            "$PRODUCTION_PROJECT" \
            "$EXPECTED_PRODUCTION_PROJECT_ID"
          validate_identity \
            "$STAGING_RAW" \
            "$STAGING_PROJECT" \
            "$EXPECTED_STAGING_PROJECT_ID"
          PRODUCTION_ACTUAL_ID="$(jq -r '.result.id' "$PRODUCTION_RAW")"
          STAGING_ACTUAL_ID="$(jq -r '.result.id' "$STAGING_RAW")"
          if [ "$PRODUCTION_ACTUAL_ID" = "$STAGING_ACTUAL_ID" ]; then
            echo "::error::Cloudflare returned the same project ID for production and staging."
            exit 1
          fi
          minimize_project "$PRODUCTION_RAW" "$PRODUCTION_MIN"
          minimize_project "$STAGING_RAW" "$STAGING_MIN"

          jq -n \
            --argjson bootstrap_required "$bootstrap_required" \
            --slurpfile production "$PRODUCTION_MIN" \
            --slurpfile staging "$STAGING_MIN" \
            '{
              schema_version: 1,
              evidence_type: "cloudflare-pages-git-auto-deploy-post-state",
             verified: (
               $bootstrap_required == 0 and
               (
                 $production[0].source == null or
                 (
                   $production[0].source.config.deployments_enabled == false and
                   $production[0].source.config.production_deployments_enabled == false and
                   $production[0].source.config.preview_deployment_setting == "none"
                 )
               ) and
               (
                 $staging[0].source == null or
                 (
                   $staging[0].source.config.deployments_enabled == false and
                   $staging[0].source.config.production_deployments_enabled == false and
                   $staging[0].source.config.preview_deployment_setting == "none"
                 )
               )
             ),
              bootstrap_required: ($bootstrap_required == 1),
              projects: {
                production: $production[0],
                staging: $staging[0]
              }
            }' \
            > "$EVIDENCE_DIR/cloudflare-pages-git-auto-deploy-post-state.json"

          jq -n \
            --argjson bootstrap_required "$bootstrap_required" \
            --slurpfile production "$PRODUCTION_MIN" \
            --slurpfile staging "$STAGING_MIN" \
            '{
              schema_version: 1,
              evidence_type: "cloudflare-pages-git-auto-deploy-posture",
             verified: (
               $bootstrap_required == 0 and
               (
                 $production[0].source == null or
                 (
                   $production[0].source.config.deployments_enabled == false and
                   $production[0].source.config.production_deployments_enabled == false and
                   $production[0].source.config.preview_deployment_setting == "none"
                 )
               ) and
               (
                 $staging[0].source == null or
                 (
                   $staging[0].source.config.deployments_enabled == false and
                   $staging[0].source.config.production_deployments_enabled == false and
                   $staging[0].source.config.preview_deployment_setting == "none"
                 )
               )
             ),
              bootstrap_required: ($bootstrap_required == 1),
             allAutomaticDeploymentsDisabled: (
               (
                 $production[0].source == null or
                 (
                   $production[0].source.config.deployments_enabled == false and
                   $production[0].source.config.production_deployments_enabled == false and
                   $production[0].source.config.preview_deployment_setting == "none"
                 )
               ) and
               (
                 $staging[0].source == null or
                 (
                   $staging[0].source.config.deployments_enabled == false and
                   $staging[0].source.config.production_deployments_enabled == false and
                   $staging[0].source.config.preview_deployment_setting == "none"
                 )
               )
             ),
              projects: {
                production: $production[0],
                staging: $staging[0]
              }
            }' \
            > "$EVIDENCE_DIR/cloudflare-pages-git-auto-deploy-posture.json"

          jq '{
            provider: "cloudflare",
            status: "captured",
            queriedAt: (now | todateiso8601),
            pagesProject: {
              idPresent: (.result.id | type == "string" and length > 0),
              name: .result.name,
              productionBranch: .result.production_branch,
               domains: (.result.domains // []),
               gitAutoDeploy: {
                 sourceConnected: (.result.source != null),
                 productionDeploymentsEnabled: .result.source.config.production_deployments_enabled,
                 previewDeploymentSetting: (.result.source.config.preview_deployment_setting // null),
                 allAutomaticDeploymentsDisabled: (
                   .result.source == null or
                   (
                     .result.source.config.deployments_enabled == false and
                     .result.source.config.production_deployments_enabled == false and
                     .result.source.config.preview_deployment_setting == "none"
                   )
                 ),
                 status: (
                   if (
                     .result.source == null or
                     (
                       .result.source.config.deployments_enabled == false and
                       .result.source.config.production_deployments_enabled == false and
                       .result.source.config.preview_deployment_setting == "none"
                     )
                   )
                  then "disabled"
                  else "enabled"
                  end
                )
              },
              latestProductionDeployment: (
                if .result.latest_deployment.environment == "production"
                then {
                  status: (
                    .result.latest_deployment.latest_stage.status //
                    .result.latest_deployment.latest_stage.name //
                    null
                  ),
                  commitHash: (
                    .result.latest_deployment.deployment_trigger.metadata.commit_hash //
                    .result.latest_deployment.source.config.commit_hash //
                    null
                  )
                }
                else null
                end
              )
            }
          }' "$PRODUCTION_RAW" \
            > "$EVIDENCE_DIR/cloudflare-admin-posture.json"

          echo "cloudflare_pages_post_state_json=$(jq -c . "$EVIDENCE_DIR/cloudflare-pages-git-auto-deploy-post-state.json")" \
            >> "$GITHUB_OUTPUT"
          echo "cloudflare_pages_posture_json=$(jq -c . "$EVIDENCE_DIR/cloudflare-pages-git-auto-deploy-posture.json")" \
            >> "$GITHUB_OUTPUT"
          echo "cloudflare_admin_posture_json=$(jq -c . "$EVIDENCE_DIR/cloudflare-admin-posture.json")" \
            >> "$GITHUB_OUTPUT"

          if [ "$bootstrap_required" -eq 1 ]; then
            echo "::error::Set CLOUDFLARE_PAGES_PROJECT_ID and CLOUDFLARE_STAGING_PAGES_PROJECT_ID from the minimized posture artifact, then rerun verification."
            exit 1
          fi

          lock_failed=0
          if ! validate_locked "$PRODUCTION_RAW"; then
            echo "::error::Production Pages Git deployments are not fully disabled."
            lock_failed=1
          fi
          if ! validate_locked "$STAGING_RAW"; then
            echo "::error::Staging Pages Git deployments are not fully disabled."
            lock_failed=1
          fi
          if [ "$lock_failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload minimized Cloudflare Pages posture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-pages-posture-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-pages-posture-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Cloudflare Pages posture verification
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.cloudflare_verify.outcome }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            exit 0
          fi
          if jq -e '.bootstrap_required == true' \
            "$RUNNER_TEMP/cloudflare-pages-posture-evidence/cloudflare-pages-git-auto-deploy-posture.json" \
            > /dev/null 2>&1; then
            echo "::error::Cloudflare project identity bootstrap is required. Set CLOUDFLARE_PAGES_PROJECT_ID and CLOUDFLARE_STAGING_PAGES_PROJECT_ID from the uploaded minimized posture artifact."
          else
            echo "::error::Cloudflare Pages read-only posture verification failed. Inspect the minimized artifact."
          fi
          exit 1

  collect:
    name: Collect standards evidence
    needs:
      - verify-current-main
      - cloudflare-pages-verify
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.verify-current-main.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-current-main.outputs.main_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run local standards gates
        run: |
          mkdir -p compliance-evidence
          npm run check:standards-readiness | tee compliance-evidence/standards-readiness.txt
          npm run check:github-governance | tee compliance-evidence/github-governance.txt

      - name: Capture GitHub governance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          gh run list --branch main --limit 20 --json databaseId,workflowName,status,conclusion,createdAt,headSha,url > compliance-evidence/github-actions-main-runs.json
          gh pr list --state open --limit 50 --json number,title,headRefName,baseRefName,mergeStateStatus,isDraft,url > compliance-evidence/github-open-prs.json

          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" > compliance-evidence/main-branch-protection.json 2> compliance-evidence/main-branch-protection.error; then
            node - <<'NODE'
          const fs = require("fs");
          const reason = fs.readFileSync("compliance-evidence/main-branch-protection.error", "utf8").slice(0, 1500);
          fs.writeFileSync("compliance-evidence/main-branch-protection.json", JSON.stringify({
            status: "unverifiable",
            reason,
            remediation: "Verify branch protection in GitHub repository settings or rerun this workflow with an account/plan that can read the endpoint."
          }, null, 2));
          NODE
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > compliance-evidence/code-scanning-open-alerts.json 2> compliance-evidence/code-scanning-open-alerts.error; then
            node - <<'NODE'
          const fs = require("fs");
          const reason = fs.readFileSync("compliance-evidence/code-scanning-open-alerts.error", "utf8").slice(0, 1500);
          fs.writeFileSync("compliance-evidence/code-scanning-open-alerts.json", JSON.stringify({
            status: "unverifiable",
            reason
          }, null, 2));
          NODE
          fi

          npm run capture:github-admin-posture -- --out compliance-evidence/github-admin-posture.json

      - name: Capture Supabase live security evidence
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          npm run check:live-security-posture > compliance-evidence/supabase-live-security.txt

      - name: Capture Sentry live telemetry status
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
          SENTRY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          npm run capture:sentry-live-evidence -- --strict --out compliance-evidence/sentry-live-evidence.json

      - name: Materialize minimized Cloudflare Pages posture evidence
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_PAGES_POST_STATE_JSON: ${{ needs.cloudflare-pages-verify.outputs.cloudflare_pages_post_state_json }}
          CLOUDFLARE_PAGES_POSTURE_JSON: ${{ needs.cloudflare-pages-verify.outputs.cloudflare_pages_posture_json }}
          CLOUDFLARE_ADMIN_POSTURE_JSON: ${{ needs.cloudflare-pages-verify.outputs.cloudflare_admin_posture_json }}
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          if [ -z "$CLOUDFLARE_PAGES_POST_STATE_JSON" ] ||
             [ -z "$CLOUDFLARE_PAGES_POSTURE_JSON" ] ||
             [ -z "$CLOUDFLARE_ADMIN_POSTURE_JSON" ]; then
            echo "::error::Minimized Cloudflare posture outputs are unavailable."
            exit 1
          fi
          printf '%s\n' "$CLOUDFLARE_PAGES_POST_STATE_JSON" |
            jq -e '.' > compliance-evidence/cloudflare-pages-git-auto-deploy-post-state.json
          printf '%s\n' "$CLOUDFLARE_PAGES_POSTURE_JSON" |
            jq -e '.' > compliance-evidence/cloudflare-pages-git-auto-deploy-posture.json
          printf '%s\n' "$CLOUDFLARE_ADMIN_POSTURE_JSON" |
            jq -e '.' > compliance-evidence/cloudflare-admin-posture.json

      - name: Check ECAS live evidence rollup
        if: always()
        run: |
          set -euo pipefail
          npm run check:ecas-live-evidence -- --strict --dir compliance-evidence

      - name: Upload standards evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standards-evidence
          path: compliance-evidence/
          if-no-files-found: error
          retention-days: 30
