          SUPABASE_PROJECT_REF: qvvicunqcrwpioqnvzxf
        run: npm run check:supabase-advisor -- --fail-on-error --fail-on-unknown --index-stats supabase-index-stats-production.json --out supabase-advisor-production-summary.json

      - name: Check production schema lint
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: npx --no-install supabase --workdir release-candidate db lint --db-url "$SUPABASE_PRODUCTION_DB_URL" --level error --fail-on error

      - name: Check production live security posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qvvicunqcrwpioqnvzxf
        run: npm run check:live-security-posture | tee supabase-live-security-production.txt

      - name: Create production database attestation
        id: database_attestation
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const read = (path) => {
            const bytes = readFileSync(path);
            return {
              sha256: createHash("sha256").update(bytes).digest("hex"),
              value: JSON.parse(bytes.toString("utf8")),
            };
          };
          const digest = (path) =>
            createHash("sha256").update(readFileSync(path)).digest("hex");
          const staging = read(
            "evidence/staging-supabase/supabase-staging-db-attestation.json",
          );
          const before = read("production-migrations-before.json");
          const preApply = read("production-migrations-pre-apply.json");
          const after = read("production-migrations-after.json");
          const legacySchemaBefore = read(
            "production-legacy-migration-schema-evidence-before.json",
          );
          const legacySchemaAfter = read(
            "production-legacy-migration-schema-evidence-after.json",
          );
          const plan = read("production-migration-plan.json");
          const reconciliation = read(
            "production-migration-history-reconciliation.json",
          );
          const roleSwitchIndexStateBefore = read(
            "production-role-switch-index-state-before.json",
          );
          const roleSwitchIndexPreflightBefore = read(
            "production-role-switch-index-preflight-before.json",
          );
          const roleSwitchIndexStateMutationBoundary = read(
            "production-role-switch-index-state-mutation-boundary.json",
          );
          const roleSwitchIndexPreflightMutationBoundary = read(
            "production-role-switch-index-preflight-mutation-boundary.json",
          );
          const roleSwitchOnlineFinalization = read(
            "production-role-switch-online-finalization.json",
          );
          const roleSwitchIndexStateAfter = read(
            "production-role-switch-index-state-after.json",
          );
          const roleSwitchIndexPreflightAfter = read(
            "production-role-switch-index-preflight-after.json",
          );
          const roleSwitchForeignKeyStateAfter = read(
            "production-role-switch-fk-state-after.json",
          );
          const roleSwitchForeignKeyPostApply = read(
            "production-role-switch-fk-post-apply.json",
          );
          const indexStats = read("supabase-index-stats-production.json");
          const advisor = read("supabase-advisor-production-summary.json");
          const securitySha256 = digest(
            "supabase-live-security-production.txt",
          );
          const manifest = read("release-candidate/release-manifest.json");
          if (
            staging.value.supabase_sha256 !==
              manifest.value.supabase_sha256 ||
            reconciliation.value.ok !== true ||
            reconciliation.value.staging_is_exact_candidate !== true ||
            reconciliation.value.production_is_canonical_prefix !== true ||
            roleSwitchIndexPreflightBefore.value.ok !== true ||
            roleSwitchIndexPreflightBefore.value.release_sha !==
              process.env.RELEASE_SHA ||
            roleSwitchIndexPreflightMutationBoundary.value.ok !== true ||
            roleSwitchIndexPreflightMutationBoundary.value.release_sha !==
              process.env.RELEASE_SHA ||
            roleSwitchOnlineFinalization.value.release_sha !==
              process.env.RELEASE_SHA ||
            roleSwitchOnlineFinalization.value.source_tree !==
              process.env.SOURCE_TREE ||
            roleSwitchOnlineFinalization.value.evidence_type !==
              "maiprop-role-switch-online-finalization" ||
            roleSwitchIndexPreflightAfter.value.ok !== true ||
            roleSwitchIndexPreflightAfter.value.verification_phase !==
              "post_apply" ||
            roleSwitchIndexPreflightAfter.value.release_sha !==
              process.env.RELEASE_SHA ||
            roleSwitchForeignKeyPostApply.value.ok !== true ||
            roleSwitchForeignKeyPostApply.value.release_sha !==
              process.env.RELEASE_SHA ||
            legacySchemaAfter.value.ok !== true ||
            legacySchemaAfter.sha256 !==
              staging.value.legacy_migration_schema_evidence_sha256
          ) {
            throw new Error(
              "Production database evidence requires canonical staged and production migration history.",
            );
          }
          const attestation = {
            schema_version: 1,
            evidence_type: "maiprop-production-database-promotion",
            authorization_mode: process.env.AUTHORIZATION_MODE,
            authorization_sha256: process.env.AUTHORIZATION_SHA256,
            consumption_sha256: process.env.AUTHORIZATION_MODE === "break_glass"
              ? process.env.CONSUMPTION_PAYLOAD_SHA256
              : null,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            approval_run_id: process.env.APPROVAL_RUN_ID,
            approval_run_attempt: process.env.APPROVAL_RUN_ATTEMPT,
            production_run_id: process.env.PRODUCTION_RUN_ID,
            production_run_attempt: process.env.PRODUCTION_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            manifest_sha256: process.env.MANIFEST_SHA256,
            supabase_sha256: manifest.value.supabase_sha256,
            project_ref: "qvvicunqcrwpioqnvzxf",
            staging_database_sha256: staging.sha256,
            staging_migration_inventory_sha256:
              staging.value.migration_inventory_sha256,
            migrations_before_sha256: before.sha256,
            migrations_pre_apply_sha256: preApply.sha256,
            migrations_after_sha256: after.sha256,
            legacy_migration_schema_evidence_before_sha256:
              legacySchemaBefore.sha256,
            legacy_migration_schema_evidence:
              legacySchemaAfter.value,
            legacy_migration_schema_evidence_sha256:
              legacySchemaAfter.sha256,
            migration_plan_sha256: plan.sha256,
            canonical_history_reconciliation: {
              ok: reconciliation.value.ok,
              candidate_count: reconciliation.value.candidate_count,
              staging_count: reconciliation.value.staging_count,
              production_count: reconciliation.value.production_count,
              staging_is_exact_candidate:
                reconciliation.value.staging_is_exact_candidate,
              production_is_canonical_prefix:
                reconciliation.value.production_is_canonical_prefix,
            },
            canonical_history_reconciliation_sha256: reconciliation.sha256,
            role_switch_index_state_before_sha256:
              roleSwitchIndexStateBefore.sha256,
            role_switch_index_preflight_before_sha256:
              roleSwitchIndexPreflightBefore.sha256,
            role_switch_index_state_mutation_boundary_sha256:
              roleSwitchIndexStateMutationBoundary.sha256,
            role_switch_index_preflight_mutation_boundary_sha256:
              roleSwitchIndexPreflightMutationBoundary.sha256,
            role_switch_online_finalization_sha256:
              roleSwitchOnlineFinalization.sha256,
            role_switch_index_state_after_sha256:
              roleSwitchIndexStateAfter.sha256,
            role_switch_index_preflight_after_sha256:
              roleSwitchIndexPreflightAfter.sha256,
            role_switch_foreign_key_state_after_sha256:
              roleSwitchForeignKeyStateAfter.sha256,
            role_switch_foreign_key_post_apply_sha256:
              roleSwitchForeignKeyPostApply.sha256,
            migration_count: after.value.length,
            pending_migration_count: plan.value.pending.length,
            index_stats_sha256: indexStats.sha256,
            advisor_sha256: advisor.sha256,
            live_security_sha256: securitySha256,
            promoted_at: new Date().toISOString(),
          };
          writeFileSync(
            "production-supabase-db-attestation.json",
            `${JSON.stringify(attestation, null, 2)}\n`,
          );
          NODE
          artifact_name="production-supabase-db-attestation-$RELEASE_SHA-$PRODUCTION_RUN_ID-$PRODUCTION_RUN_ATTEMPT"
          attestation_sha256="$(sha256sum production-supabase-db-attestation.json | awk '{print $1}')"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "attestation_sha256=$attestation_sha256" >> "$GITHUB_OUTPUT"
          payload_root="production-database-evidence-payload"
          mkdir -p "$payload_root"
          for file in \
            production-supabase-db-attestation.json \
            production-supabase-target.json \
            production-supabase-target-pre-apply.json \
            production-supabase-target-mutation-boundary.json \
            production-migrations-before.json \
            production-migrations-pre-apply.json \
            production-migrations-mutation-boundary.json \
            production-migrations-after.json \
            production-legacy-migration-schema-evidence-before.json \
            production-legacy-migration-schema-evidence-after.json \
            staging-legacy-migration-schema-evidence.json \
            production-migration-plan.json \
            production-migration-history-reconciliation.json \
            production-role-switch-index-state-before.json \
            production-role-switch-index-preflight-before.json \
            production-role-switch-index-state-mutation-boundary.json \
            production-role-switch-index-preflight-mutation-boundary.json \
            production-role-switch-online-finalization.json \
            production-role-switch-index-state-after.json \
            production-role-switch-index-preflight-after.json \
            production-role-switch-fk-state-after.json \
            production-role-switch-fk-post-apply.json \
            production-migration-dry-run.txt \
            production-supabase-db-pre-mutation-evidence.json \
            production-expected-pending-migrations.txt \
            production-actual-pending-migrations.txt \
            supabase-index-stats-production.json \
            supabase-advisor-production-summary.json \
            supabase-live-security-production.txt; do
            cp -- "$file" "$payload_root/$file"
          done

      - name: Upload production database evidence
        id: database_payload_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.database_attestation.outputs.artifact_name }}
          path: production-database-evidence-payload/
          if-no-files-found: error
          retention-days: 30

      - name: Create signed production database evidence binding
        id: database_binding
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.database_payload_upload.outputs.artifact-digest }}
