            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > "$binding_root/verification.json"
          echo "binding_artifact_name=$binding_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed production database evidence binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.database_binding.outputs.binding_artifact_name }}
          path: production-database-evidence-binding/
          if-no-files-found: error
          retention-days: 30

      - name: Create production database terminal evidence
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          production_history_capture_status="captured"
          if ! psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --command "
              SELECT COALESCE(
                json_agg(
                  json_build_object(
                    'version', version,
                    'name', COALESCE(name, ''),
                    'statement_count', COALESCE(cardinality(statements), 0),
                    'statement_marker_only', COALESCE(
                      cardinality(statements) = 1 AND
                      statements[1] = version || '_' || COALESCE(name, '') || '.sql',
                      FALSE
                    ),
                    'statements_sha256', encode(
                      extensions.digest(
                        convert_to(COALESCE(to_json(statements)::text, '[]'), 'UTF8'),
                        'sha256'
                      ),
                      'hex'
                    )
                  )
                  ORDER BY version
                ),
                '[]'::json
              )::text
              FROM supabase_migrations.schema_migrations;
            " > production-migrations-terminal.json; then
            production_history_capture_status="query_failed"
            rm -f production-migrations-terminal.json
          elif ! node -e "JSON.parse(require('fs').readFileSync('production-migrations-terminal.json','utf8'))"; then
            production_history_capture_status="invalid_json"
            rm -f production-migrations-terminal.json
          fi
          export PRODUCTION_HISTORY_CAPTURE_STATUS="$production_history_capture_status"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, statSync, writeFileSync } from "node:fs";

          const record = (path) => {
            if (!existsSync(path)) return { path, present: false };
            try {
              const bytes = readFileSync(path);
              return {
                path,
                present: true,
                size: statSync(path).size,
                sha256: createHash("sha256").update(bytes).digest("hex"),
              };
            } catch (error) {
              return {
                path,
                present: true,
                read_error: error instanceof Error ? error.message : String(error),
              };
            }
          };
          const readJsonIfValid = (path) => {
            if (!existsSync(path)) return { value: {}, error: null };
            try {
              return {
                value: JSON.parse(readFileSync(path, "utf8")),
                error: null,
              };
            } catch (error) {
              return {
                value: {},
                error: error instanceof Error ? error.message : String(error),
              };
            }
          };
          const manifestPath = "release-candidate/release-manifest.json";
          const manifestResult = readJsonIfValid(manifestPath);
          const manifest = manifestResult.value;
          const terminalHistoryResult = readJsonIfValid(
            "production-migrations-terminal.json",
          );
          const jobStatus = process.env.JOB_STATUS || "unknown";
          const evidence = {
            schema_version: 1,
            evidence_type: "maiprop-production-database-terminal",
            job_status: jobStatus,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            production_run_id: process.env.PRODUCTION_RUN_ID,
            production_run_attempt: process.env.PRODUCTION_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            manifest_sha256: process.env.MANIFEST_SHA256,
            supabase_sha256: manifest.supabase_sha256 ?? null,
            manifest_parse_error: manifestResult.error,
            target_project_ref: "qvvicunqcrwpioqnvzxf",
            production_history_capture_status:
              process.env.PRODUCTION_HISTORY_CAPTURE_STATUS || "not_attempted",
            production_history: terminalHistoryResult.value,
            production_history_parse_error: terminalHistoryResult.error,
            phase_evidence: [
              record("production-supabase-target.json"),
              record("production-supabase-target-pre-apply.json"),
              record("production-supabase-target-mutation-boundary.json"),
              record("production-migrations-before.json"),
              record("production-migrations-pre-apply.json"),
              record("production-migrations-mutation-boundary.json"),
               record("production-migrations-after.json"),
               record("production-legacy-migration-schema-evidence-before.json"),
               record("production-legacy-migration-schema-evidence-after.json"),
              record("production-migrations-terminal.json"),
              record("production-migration-plan.json"),
               record("production-migration-history-reconciliation.json"),
               record("production-role-switch-index-state-before.json"),
               record("production-role-switch-index-preflight-before.json"),
                record("production-role-switch-index-state-mutation-boundary.json"),
                record("production-role-switch-index-preflight-mutation-boundary.json"),
                record("production-role-switch-online-finalization.json"),
                record("production-role-switch-index-state-after.json"),
                record("production-role-switch-index-preflight-after.json"),
                record("production-role-switch-fk-state-after.json"),
                record("production-role-switch-fk-post-apply.json"),
               record("production-migration-dry-run.txt"),
              record("production-supabase-db-pre-mutation-evidence.json"),
              record("production-supabase-db-attestation.json"),
            ],
            recovery: jobStatus === "success" ? null : {
               strategy: "forward-only",
               instruction:
                 "Rerun this exact release. Production must satisfy the signed legacy reconciliation and exact post-cutover staged history; no automatic rollback or migration repair is permitted.",
            },
            captured_at: new Date().toISOString(),
          };
          writeFileSync(
            "production-supabase-db-terminal-evidence.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
          terminal_root="production-database-terminal-evidence-payload"
          mkdir -p "$terminal_root"
          for pattern in \
            production-supabase-db-terminal-evidence.json \
            'production-supabase-target*.json' \
             'production-migrations-*.json' \
             'production-legacy-migration-schema-evidence-*.json' \
              production-migration-history-reconciliation.json \
              'production-role-switch-index-*.json' \
              production-role-switch-online-finalization.json \
              'production-role-switch-fk-*.json' \
             'production-migration-*.txt' \
            production-supabase-db-pre-mutation-evidence.json \
            production-supabase-db-attestation.json; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                cp -- "$file" "$terminal_root/$(basename "$file")"
              fi
            done
          done

      - name: Upload production database terminal evidence
        id: database_terminal_payload_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-supabase-db-terminal-${{ inputs.release_sha }}-${{ inputs.production_run_id }}-${{ inputs.production_run_attempt }}
          path: production-database-terminal-evidence-payload/
          if-no-files-found: error
          retention-days: 30

      - name: Create signed production database terminal binding
        id: database_terminal_binding
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.database_terminal_payload_upload.outputs.artifact-digest }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.database_terminal_payload_upload.outputs.artifact-id }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          payload_root="production-database-terminal-evidence-payload"
          binding_root="production-database-terminal-evidence-binding"
          payload_artifact_name="production-supabase-db-terminal-${RELEASE_SHA}-${PRODUCTION_RUN_ID}-${PRODUCTION_RUN_ATTEMPT}"
          binding_artifact_name="${payload_artifact_name}-binding"
          mkdir -p "$binding_root" production-database-terminal-evidence-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > production-database-terminal-evidence-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > production-database-terminal-evidence-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root "$payload_root" \
            --file-root "$payload_root" \
            --file production-supabase-db-terminal-evidence.json \
            --out "$binding_root/release-artifact-binding.json" \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path "$PRODUCTION_CALLER_WORKFLOW_PATH" \
            --workflow-ref "$GITHUB_REPOSITORY/$PRODUCTION_CALLER_WORKFLOW_PATH@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$payload_artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          echo "binding_artifact_name=$binding_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed production database terminal binding
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.database_terminal_binding.outputs.binding_artifact_name }}
          path: production-database-terminal-evidence-binding/
          if-no-files-found: error
          retention-days: 30
