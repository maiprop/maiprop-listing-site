name: Deploy Supabase Production DB

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only - list pending migrations without applying them"
        required: true
        type: boolean
        default: true
      confirm_apply:
        description: "Required with dry_run=false to apply production migrations"
        required: true
        type: boolean
        default: false
      include_all:
        description: "Include pending local migrations that are older than the newest recorded remote migration"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-db
  cancel-in-progress: false

jobs:
  deploy:
    name: Production database migration gate
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      INCLUDE_ALL_MIGRATIONS: ${{ github.event.inputs.include_all }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.1

      - name: Validate production database secrets
        run: |
          required=(
            "SUPABASE_ACCESS_TOKEN"
            "SUPABASE_PROJECT_REF"
            "SUPABASE_PRODUCTION_DB_URL"
          )
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Guard production apply
        if: inputs.dry_run != true
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production DB applies must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          if [ "${CONFIRM_APPLY}" != "true" ]; then
            echo "::error::Set confirm_apply=true when dry_run=false."
            exit 1
          fi
          {
            echo "### Supabase production DB migration apply"
            echo "- Ref: ${GITHUB_REF}"
            echo "- SHA: ${GITHUB_SHA}"
            echo "- Project ref: ${SUPABASE_PROJECT_REF}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CONFIRM_APPLY: ${{ github.event.inputs.confirm_apply }}

      - name: Capture migration list before
        run: supabase migration list --db-url "$SUPABASE_PRODUCTION_DB_URL" > supabase-production-migrations-before.txt

      - name: Lint production schema
        run: supabase db lint --db-url "$SUPABASE_PRODUCTION_DB_URL" --fail-on error > supabase-production-db-lint.txt

      - name: Check Supabase advisors
        run: npm run check:supabase-advisor -- --fail-on-error --fail-on-unknown --out supabase-production-advisor-summary.json

      - name: Dry-run production migrations
        if: inputs.dry_run == true
        run: |
          args=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          if [ "$INCLUDE_ALL_MIGRATIONS" = "true" ]; then
            args+=(--include-all)
          fi
          supabase db push "${args[@]}" --dry-run | tee supabase-production-db-push.txt

      - name: Apply production migrations
        if: inputs.dry_run != true
        run: |
          args=(--db-url "$SUPABASE_PRODUCTION_DB_URL")
          if [ "$INCLUDE_ALL_MIGRATIONS" = "true" ]; then
            args+=(--include-all)
          fi
          supabase db push "${args[@]}" --yes | tee supabase-production-db-push.txt

      - name: Capture migration list after
        if: always()
        run: supabase migration list --db-url "$SUPABASE_PRODUCTION_DB_URL" > supabase-production-migrations-after.txt

      - name: Upload production DB release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-production-db-release-evidence
          path: |
            supabase-production-migrations-before.txt
            supabase-production-migrations-after.txt
            supabase-production-db-lint.txt
            supabase-production-db-push.txt
            supabase-production-advisor-summary.json
          if-no-files-found: ignore
          retention-days: 30
