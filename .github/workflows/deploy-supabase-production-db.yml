name: Deploy Supabase Production DB

on:
  workflow_call:
    inputs:
      dry_run:
        description: Reserved; production database access is disabled.
        required: false
        type: boolean
        default: true
      confirm_apply:
        description: Reserved; production database mutations are disabled.
        required: false
        type: boolean
        default: false
      include_all:
        description: Reserved; production database mutations are disabled.
        required: false
        type: boolean
        default: false
      release_sha:
        description: Immutable repository commit submitted for validation.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable repository commit submitted for validation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-disabled:
    name: Production database deployment disabled
    runs-on: ubuntu-latest
    steps:
      - name: Reject production database mutation
        run: |
          echo "::error::Production database mutations are disabled. Staging evidence and a separately reviewed immutable promotion workflow are required."
          exit 1

  deploy:
    name: Production database mutation hard-disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      PRODUCTION_MUTATIONS_DISABLED: "true"
    steps:
      - run: exit 1
