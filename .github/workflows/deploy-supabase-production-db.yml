          export ROLE_SWITCH_MIGRATION_PENDING_COUNT="$pending_count"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const sqlPath =
            "release-candidate/supabase/reconciliation/role-switch-online-finalization.sql";
          const artifact = JSON.parse(readFileSync(
            "evidence/api/mutation-lease-artifact.json",
            "utf8",
          ));
          const leasePath =
            "evidence/mutation-lease/production-mutation-lease.json";
          const digest = (path) => createHash("sha256")
            .update(readFileSync(path))
            .digest("hex");
          const evidence = {
            schema_version: 1,
            evidence_type: "maiprop-role-switch-online-finalization",
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            production_run_id: process.env.PRODUCTION_RUN_ID,
            production_run_attempt: process.env.PRODUCTION_RUN_ATTEMPT,
            mutation_lease: {
              artifact_name: process.env.MUTATION_LEASE_ARTIFACT,
              artifact_id: String(artifact.id),
              artifact_digest: String(artifact.digest),
              payload_sha256: digest(leasePath),
            },
            migration_pending_count: Number(
              process.env.ROLE_SWITCH_MIGRATION_PENDING_COUNT,
            ),
            sql_path: sqlPath.replace(/^release-candidate\//, ""),
            sql_sha256: digest(sqlPath),
            completed_at: new Date().toISOString(),
          };
          writeFileSync(
            "production-role-switch-online-finalization.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Require exact production migration parity
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --command "
              SELECT COALESCE(
                json_agg(
                  json_build_object(
                    'version', version,
                    'name', COALESCE(name, ''),
                    'statement_count', COALESCE(cardinality(statements), 0),
                    'statement_marker_only', COALESCE(
                      cardinality(statements) = 1 AND
                      statements[1] = version || '_' || COALESCE(name, '') || '.sql',
                      FALSE
                    ),
                    'statements_sha256', encode(
                      extensions.digest(
                        convert_to(COALESCE(to_json(statements)::text, '[]'), 'UTF8'),
                        'sha256'
                      ),
                      'hex'
                    )
                  )
                  ORDER BY version
                ),
                '[]'::json
              )::text
              FROM supabase_migrations.schema_migrations;
            " > production-migrations-after.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { reconcileMigrationHistories } from "./scripts/production-release-validation.mjs";

          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const staging = read(
            "evidence/staging-supabase/supabase-staging-db-attestation.json",
          );
          const reviewed = read("production-migration-plan.json");
          const parity = reconcileMigrationHistories({
            candidate: reviewed.candidate,
            staging: staging.migration_inventory,
            production: read("production-migrations-after.json"),
            manifest: read(
              "release-candidate/supabase/reconciliation/production-history-v1.json",
            ),
          });
          if (
            parity.cutover_applied !== true ||
            parity.pending.length !== 0 ||
            parity.production.length !== parity.staged.length
          ) {
            throw new Error(
              "Production migration history does not satisfy the signed legacy reconciliation and exact post-cutover contract.",
            );
          }
          NODE

      - name: Require exact role-switch post-apply integrity
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          raw_index_state="$(mktemp)"
          psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --file release-candidate/supabase/reconciliation/role-switch-index-preflight.sql \
            | sed '/^[[:space:]]*$/d' > "$raw_index_state"
          if [ "$(wc -l < "$raw_index_state" | tr -d '[:space:]')" != "1" ]; then
            echo "::error::Production post-apply role-switch index state must contain exactly one JSON object."
            exit 1
          fi
          jq -cS . "$raw_index_state" \
            > production-role-switch-index-state-after.json
          node scripts/check-role-switch-index-preflight.mjs \
            --state production-role-switch-index-state-after.json \
            --plan production-migration-plan.json \
            --out production-role-switch-index-preflight-after.json \
            --release-sha "$RELEASE_SHA" \
            --require-finalized

          raw_fk_state="$(mktemp)"
          psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --file release-candidate/supabase/reconciliation/role-switch-fk-state.sql \
            | sed '/^[[:space:]]*$/d' > "$raw_fk_state"
          if [ "$(wc -l < "$raw_fk_state" | tr -d '[:space:]')" != "1" ]; then
            echo "::error::Production post-apply role-switch foreign-key state must contain exactly one JSON object."
            exit 1
          fi
          jq -cS . "$raw_fk_state" \
            > production-role-switch-fk-state-after.json
          node scripts/check-role-switch-fk-post-apply.mjs \
            --state production-role-switch-fk-state-after.json \
            --out production-role-switch-fk-post-apply.json \
            --release-sha "$RELEASE_SHA"

      - name: Require exact legacy schema convergence with staging
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          raw_evidence="$(mktemp)"
          psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --file release-candidate/supabase/reconciliation/production-history-v1.sql \
            | sed '/^[[:space:]]*$/d' > "$raw_evidence"
          if [ "$(wc -l < "$raw_evidence" | tr -d '[:space:]')" != "1" ]; then
            echo "::error::Production legacy schema evidence must contain exactly one JSON object."
            exit 1
          fi
          production_canonical="$(jq -cS . "$raw_evidence")"
          printf '%s' "$production_canonical" \
            > production-legacy-migration-schema-evidence-after.json
          staging_canonical="$(jq -cS '.legacy_migration_schema_evidence' \
            evidence/staging-supabase/supabase-staging-db-attestation.json)"
          printf '%s' "$staging_canonical" \
            > staging-legacy-migration-schema-evidence.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { validateLegacyMigrationSchemaEvidence } from "./scripts/production-release-validation.mjs";

          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const stagingAttestation = read(
            "evidence/staging-supabase/supabase-staging-db-attestation.json",
          );
          const productionBytes = readFileSync(
            "production-legacy-migration-schema-evidence-after.json",
          );
          const stagingBytes = readFileSync(
            "staging-legacy-migration-schema-evidence.json",
          );
          validateLegacyMigrationSchemaEvidence(JSON.parse(productionBytes));
          const stagingEvidence = validateLegacyMigrationSchemaEvidence(
            JSON.parse(stagingBytes),
          );
          const stagingSha256 = createHash("sha256")
            .update(stagingBytes)
            .digest("hex");
          if (
            !productionBytes.equals(stagingBytes) ||
            stagingSha256 !==
              stagingAttestation.legacy_migration_schema_evidence_sha256 ||
            JSON.stringify(stagingEvidence) !==
              JSON.stringify(stagingAttestation.legacy_migration_schema_evidence)
          ) {
            throw new Error(
              "Production legacy schema evidence does not exactly match signed staging evidence.",
            );
          }
          NODE

      - name: Check production Supabase generated types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qvvicunqcrwpioqnvzxf
        run: npm run check:supabase-types -- -- --strict

      - name: Capture production Supabase index stats
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PROJECT_REF: qvvicunqcrwpioqnvzxf
        run: npm run capture:supabase-index-stats -- --out supabase-index-stats-production.json

      - name: Check production Supabase advisors
        env:
