          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > production-database-evidence-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root "$payload_root" \
            --file-root "$payload_root" \
            --file production-supabase-db-attestation.json \
            --file production-migration-plan.json \
             --file production-migration-history-reconciliation.json \
             --file production-legacy-migration-schema-evidence-after.json \
             --file production-migrations-after.json \
             --file production-role-switch-index-state-before.json \
             --file production-role-switch-index-preflight-before.json \
              --file production-role-switch-index-state-mutation-boundary.json \
              --file production-role-switch-index-preflight-mutation-boundary.json \
              --file production-role-switch-online-finalization.json \
              --file production-role-switch-index-state-after.json \
             --file production-role-switch-index-preflight-after.json \
             --file production-role-switch-fk-state-after.json \
             --file production-role-switch-fk-post-apply.json \
            --out "$binding_root/release-artifact-binding.json" \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path "$PRODUCTION_CALLER_WORKFLOW_PATH" \
            --workflow-ref "$GITHUB_REPOSITORY/$PRODUCTION_CALLER_WORKFLOW_PATH@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "${{ steps.database_attestation.outputs.artifact_name }}" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding "$binding_root/release-artifact-binding.json" \
            --payload-root "$payload_root" \
            --file-root "$payload_root" \
            --file production-supabase-db-attestation.json \
            --file production-migration-plan.json \
             --file production-migration-history-reconciliation.json \
             --file production-legacy-migration-schema-evidence-after.json \
             --file production-migrations-after.json \
             --file production-role-switch-index-state-before.json \
             --file production-role-switch-index-preflight-before.json \
              --file production-role-switch-index-state-mutation-boundary.json \
              --file production-role-switch-index-preflight-mutation-boundary.json \
              --file production-role-switch-online-finalization.json \
              --file production-role-switch-index-state-after.json \
             --file production-role-switch-index-preflight-after.json \
             --file production-role-switch-fk-state-after.json \
             --file production-role-switch-fk-post-apply.json \
            --artifact-metadata production-database-evidence-metadata/artifact.json \
            --producer-run production-database-evidence-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path "$PRODUCTION_CALLER_WORKFLOW_PATH" \
            --workflow-ref "$GITHUB_REPOSITORY/$PRODUCTION_CALLER_WORKFLOW_PATH@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "${{ steps.database_attestation.outputs.artifact_name }}" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
