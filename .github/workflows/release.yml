name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # Generates CHANGELOG.md from Conventional Commits
          # Creates a release PR that bumps version + updates changelog
          # When merged, creates a GitHub Release with tag

  # PRs created with GITHUB_TOKEN do not recursively start pull_request
  # workflows. Use a separate least-privilege job to dispatch and verify the
  # exact release commit without extending those permissions to Release Please.
  verify-release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Dispatch CI for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--main--components--maiprop-listing-site
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_BRANCH}" >/dev/null 2>&1; then
            exit 0
          fi

          release_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_BRANCH}" --jq '.commit.sha')
          status_api="repos/${GITHUB_REPOSITORY}/statuses/${release_sha}"
          workflow_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"
            gh api --method POST "$status_api" \
              -f state="$state" \
              -f context="release-please/ci" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          existing_run=$(gh run list \
            --workflow ci.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId,headSha,status,conclusion,url,createdAt \
            --jq "map(select(.headSha == \"$release_sha\")) | sort_by(.createdAt) | reverse | first // empty")

          if [[ -n "$existing_run" ]]; then
            existing_status=$(jq -r '.status' <<< "$existing_run")
            existing_conclusion=$(jq -r '.conclusion // ""' <<< "$existing_run")
            existing_url=$(jq -r '.url' <<< "$existing_run")
            if [[ "$existing_status" != "completed" ]]; then
              post_status pending "Release PR CI is running" "$existing_url"
              exit 0
            fi
            if [[ "$existing_conclusion" == "success" ]]; then
              post_status success "Release PR CI passed" "$existing_url"
              exit 0
            fi
          fi

          post_status pending "Release PR CI is queued" "$workflow_url"
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
