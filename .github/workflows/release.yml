name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # Generates CHANGELOG.md from Conventional Commits
          # Creates a release PR that bumps version + updates changelog
          # When merged, creates a GitHub Release with tag

  # PRs created with GITHUB_TOKEN do not recursively start pull_request
  # workflows. Use a separate least-privilege job to dispatch and verify the
  # exact release commit without extending those permissions to Release Please.
  verify-release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Dispatch and verify CI for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--main--components--maiprop-listing-site
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_BRANCH}" >/dev/null 2>&1; then
            exit 0
          fi

          release_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_BRANCH}" --jq '.commit.sha')
          status_api="repos/${GITHUB_REPOSITORY}/statuses/${release_sha}"
          workflow_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          status_state="pending"

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"
            gh api --method POST "$status_api" \
              -f state="$state" \
              -f context="release-please/ci" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          cleanup() {
            local exit_code=$?
            if [[ $exit_code -ne 0 && "$status_state" == "pending" ]]; then
              post_status failure "Release PR CI did not complete" "$workflow_url" || true
            fi
          }
          trap cleanup EXIT

          post_status pending "Release PR CI is running" "$workflow_url"
          existing_run_ids=$(gh run list \
            --workflow ci.yml \
            --branch "$RELEASE_BRANCH" \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId')
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

          run_id=""
          run_url="$workflow_url"
          for _ in $(seq 1 120); do
            while IFS=$'\t' read -r candidate_id candidate_url; do
              if [[ -n "$candidate_id" ]] && ! grep -Fxq "$candidate_id" <<< "$existing_run_ids"; then
                run_id="$candidate_id"
                run_url="$candidate_url"
                break
              fi
            done < <(gh run list \
              --workflow ci.yml \
              --branch "$RELEASE_BRANCH" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId,headSha,url \
              --jq ".[] | select(.headSha == \"$release_sha\") | [.databaseId, .url] | @tsv" \
            )
            [[ -n "$run_id" ]] && break
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "No CI run found for release SHA $release_sha" >&2
            exit 1
          fi

          if timeout 30m gh run watch "$run_id" --exit-status; then
            post_status success "Release PR CI passed" "$run_url"
            status_state="success"
          else
            post_status failure "Release PR CI failed" "$run_url"
            status_state="failure"
            exit 1
          fi
