name: Deploy Catalogue Performance Database Hotfix

on:
  workflow_dispatch:
    inputs:
      release_sha: { description: "Full 40-character current main SHA", required: true, type: string }
      confirm: { description: "Type DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX", required: true, type: string }
      single_admin_break_glass: { description: "Use configured production authorization", required: true, default: false, type: boolean }
      incident_id: { description: "Configured incident ID", required: false, type: string }
      reason: { description: "Operator-held authorization reason", required: false, type: string }

permissions: { contents: read }
concurrency: { group: maiprop-production-release, cancel-in-progress: false }

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Validate exact current-main control and authorization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_ACTION: production-deploy
          RELEASE_STANDARD_CONFIRMATION: DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ]; then echo "::error::Manual main, first attempt, and triggering actor are required."; exit 1; fi
          git fetch --no-tags origin main
          export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)" RELEASE_CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$RELEASE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CHECKOUT_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CURRENT_MAIN_SHA" ]; then echo "::error::Exact current main SHA is required."; exit 1; fi
          node scripts/production-break-glass-validation.mjs validate-workflow --out "$RUNNER_TEMP/catalogue-hotfix-authorization.json"
          if [ "$RELEASE_SINGLE_ADMIN_BREAK_GLASS" = false ]; then node --input-type=module -e 'const a=String(process.env.GITHUB_ACTOR??"").toLowerCase(),d=String(process.env.PRODUCTION_RELEASE_DEPLOYERS??"").split(/[\s,]+/).map(x=>x.toLowerCase()).filter(Boolean);if(!new Set(d).has(a))throw Error("Production actor is not allowlisted");'; fi
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"

  staging:
    needs: [validate]
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_KIND: staging
      TARGET_PROJECT_REF: xsiehskfgeoqyazcgauv
      TARGET_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      TARGET_API_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_MUTATION_ACKNOWLEDGEMENT: ${{ vars.STAGING_MUTATION_ACKNOWLEDGEMENT }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Revalidate staging identity immediately before mutation
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)" RELEASE_CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ] || [ "$RELEASE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CHECKOUT_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CURRENT_MAIN_SHA" ]; then echo "::error::Staging control changed."; exit 1; fi
          node scripts/assert-staging-mutation-target.mjs --project-ref "$TARGET_PROJECT_REF" --database-url "$TARGET_DB_URL" --acknowledgement "$STAGING_MUTATION_ACKNOWLEDGEMENT"
          node scripts/catalogue-hotfix-workflow-helpers.mjs validate-target
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${TARGET_API_URL%/}/rest/v1/" -H "apikey: $TARGET_ANON_KEY")"; [ "$code" = 200 ] || exit 1
      - name: Apply only manifest-bound staging migrations
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"
          work="$RUNNER_TEMP/catalogue-hotfix-staging"; cli="$GITHUB_WORKSPACE/node_modules/.bin/supabase"; rm -rf "$work"; mkdir -p "$work/supabase/migrations" evidence
          printf '[api]\nenabled = false\n' > "$work/supabase/config.toml"
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atc 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version' > "$work/remote-numeric-history.txt"
          while IFS= read -r v; do [ -z "$v" ] && continue; [[ "$v" =~ ^[0-9]+$ ]] || exit 1; jq -e --arg v "$v" '.hotfix.migrations[]|select(.version==$v)' "$RUNNER_TEMP/catalogue-hotfix-contract.json" >/dev/null || printf '%s\n' '-- remote numeric history placeholder; never pending SQL' > "$work/supabase/migrations/${v}_remote_history_placeholder.sql"; done < "$work/remote-numeric-history.txt"
          jq -r '.hotfix.migrations[].path' "$RUNNER_TEMP/catalogue-hotfix-contract.json" | while IFS= read -r p; do case "$p" in supabase/migrations/*.sql) cp "$p" "$work/supabase/migrations/$(basename "$p")";; *) exit 1;; esac; done
          ( cd "$work"; "$cli" db push --include-all --dry-run --db-url "$TARGET_DB_URL" > dry-run-output.txt 2>&1 )
          node scripts/catalogue-hotfix-workflow-helpers.mjs validate-dry-run "$RUNNER_TEMP/catalogue-hotfix-contract.json" "$work/remote-numeric-history.txt" "$work/dry-run-output.txt" evidence/dry-run-pending.json
          ( cd "$work"; "$cli" db push --include-all --yes --db-url "$TARGET_DB_URL" > push-output.txt 2>&1 )
      - name: Verify staging database, pgTAP, legacy PostgREST, and direct samples
        run: |
          set -euo pipefail
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atc "SELECT json_build_object('migration_versions',array_agg(version ORDER BY version),'legacy_rpc',to_regprocedure('public.get_public_listing_catalogue(timestamp with time zone)') IS NOT NULL,'publication_rpc',to_regprocedure('public.get_public_catalogue_publication(bigint)') IS NOT NULL,'typed_rpc',to_regproc('public.query_public_catalogue') IS NOT NULL,'anon_legacy_execute',has_function_privilege('anon','public.get_public_listing_catalogue(timestamp with time zone)','EXECUTE'),'publication_id',(SELECT publication_id FROM private.public_catalogue_current WHERE singleton)) FROM supabase_migrations.schema_migrations WHERE version IN ('20260728123058','20260729120405')" > evidence/database-contract.json
          jq -e '(.migration_versions|sort)==["20260728123058","20260729120405"] and .legacy_rpc and .publication_rpc and .typed_rpc and .anon_legacy_execute and .publication_id>0' evidence/database-contract.json >/dev/null
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/tests/public_catalogue_snapshot_test.sql > evidence/public_catalogue_snapshot_test.txt
          node scripts/parse-tap-proof.mjs --file evidence/public_catalogue_snapshot_test.txt --expected-plan 90 > evidence/public-catalogue-pgtap-proof.json
          api="${TARGET_API_URL%/}/rest/v1/rpc/get_public_listing_catalogue"
          code="$(curl -sS -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,city,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=1')"; [ "$code" = 200 ] || exit 1
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=JSON.parse(readFileSync(process.argv[1]))[0];if(!r?.id||!r.city||r.status!=="active"||r.is_off_market!==false||!r.project||!Array.isArray(r.listing_images)||r.listing_images.length>3)throw Error("Nonempty card probe required");writeFileSync(process.argv[2],JSON.stringify({id:r.id,city:r.city}));' "$RUNNER_TEMP/seed.json" evidence/probe-context.json
          id="$(jq -r .id evidence/probe-context.json)"; city="$(jq -r .city evidence/probe-context.json)"
          code="$(curl -sS -o "$RUNNER_TEMP/card.json" -w '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,city,location_search_text,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode "location_search_text=ilike.*${city}*" --data-urlencode 'limit=12')"; [ "$code" = 200 ] || exit 1
          code="$(curl -sS -o "$RUNNER_TEMP/detail.json" -w '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project:project_detail,listing_images:listing_images_detail' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode "id=eq.${id}" --data-urlencode 'limit=1')"; [ "$code" = 200 ] || exit 1
          head="$(curl -sS -o /dev/null -w '%{http_code}' -X HEAD -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode "location_search_text=ilike.*${city}*" --data-urlencode 'limit=12')"; [[ "$head" = 200 || "$head" = 206 ]] || exit 1
          node --input-type=module -e 'import{readFileSync}from"node:fs";const c=JSON.parse(readFileSync(process.argv[1])),d=JSON.parse(readFileSync(process.argv[2]));if(!c.length||!d.length||c.some(r=>!r.project||!Array.isArray(r.listing_images)||r.listing_images.length>3)||d.some(r=>!r.project||!Array.isArray(r.listing_images)))throw Error("Nonempty card/detail probes required");' "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/detail.json"
          : > evidence/http-samples.ndjson; for n in $(seq 1 30); do a="$(date +%s%3N)"; s="$(curl -sS -o "$RUNNER_TEMP/sample-$n.json" -w '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode "location_search_text=ilike.*${city}*" --data-urlencode 'limit=12')"; b="$(date +%s%3N)"; [ "$s" = 200 ] || exit 1; jq -n --argjson sample "$n" --argjson status "$s" --argjson duration_ms "$((b-a))" '{sample:$sample,status:$status,duration_ms:$duration_ms}' >> evidence/http-samples.ndjson; done
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=readFileSync("evidence/http-samples.ndjson","utf8").trim().split("\n").map(JSON.parse),p=q=>[...r.map(x=>x.duration_ms)].sort((a,b)=>a-b)[Math.ceil(r.length*q)-1],o={sample_count:r.length,failed_statuses:r.filter(x=>x.status!==200).length,p50_ms:p(.5),p95_ms:p(.95),samples:r,completed_at:new Date().toISOString()};if(r.length!==30||o.failed_statuses||o.p95_ms>1800)throw Error("Thirty staging samples within the p95 ceiling are required");writeFileSync("evidence/http-latency.json",JSON.stringify(o,null,2));'
      - name: Prove staging publish-public-catalogue cron liveness
        run: |
          set -euo pipefail
          started="$(date +%s)"; state(){ psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atc "WITH j AS (SELECT jobid,schedule,command,active FROM cron.job WHERE jobname='publish-public-catalogue'), r AS (SELECT runid,start_time,end_time FROM cron.job_run_details WHERE jobid=(SELECT jobid FROM j) AND status='succeeded' ORDER BY runid DESC LIMIT 20) SELECT json_build_object('schedule',(SELECT schedule FROM j),'command',(SELECT command FROM j),'active',(SELECT active FROM j),'successful_runs',(SELECT coalesce(json_agg(r),'[]'::json) FROM r),'publication_id',(SELECT publication_id FROM private.public_catalogue_current WHERE singleton))"; }
          state > evidence/catalogue-cron-baseline.json; base="$(jq -r .publication_id evidence/catalogue-cron-baseline.json)"; runs="$(jq -c '[.successful_runs[].runid]' evidence/catalogue-cron-baseline.json)"; ok=false
          for n in $(seq 1 48); do state > evidence/catalogue-cron-current.json; elapsed_seconds="$(( $(date +%s)-started ))"; if jq -e --argjson b "$base" --argjson r "$runs" --argjson e "$elapsed_seconds" '.schedule=="* * * * *" and .command=="SELECT private.publish_public_catalogue();" and .active==true and $e>=120 and .publication_id>=($b+2) and ([.successful_runs[].runid]-$r|unique|length)>=2 and ([.successful_runs[].start_time[0:16]]|unique|length)>=2' evidence/catalogue-cron-current.json >/dev/null; then ok=true; break; fi; sleep 10; done; [ "$ok" = true ] || exit 1
          jq -n --argjson elapsed_seconds "$elapsed_seconds" --slurpfile baseline evidence/catalogue-cron-baseline.json --slurpfile final evidence/catalogue-cron-current.json '{minute_boundaries:2,elapsed_seconds:$elapsed_seconds,baseline:$baseline[0],final:$final[0]}' > evidence/catalogue-cron-proof.json
      - name: Write minimized staging evidence
        run: node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const h=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/catalogue-hotfix-contract.json")).hotfix;writeFileSync("evidence/catalogue-performance-hotfix-staging.json",JSON.stringify({target_kind:"staging",database_hotfix_sha:process.env.RELEASE_SHA,migrations:h.migrations.map(({version,path,sha256})=>({version,path,sha256})),database_contract:JSON.parse(readFileSync("evidence/database-contract.json")),cron:JSON.parse(readFileSync("evidence/catalogue-cron-proof.json")),samples:JSON.parse(readFileSync("evidence/http-latency.json")),completed_at:new Date().toISOString()},null,2));'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "catalogue-performance-hotfix-staging-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}", path: evidence/, if-no-files-found: error, retention-days: 30 }

  production:
    needs: [validate, staging]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_KIND: production
      TARGET_PROJECT_REF: qvvicunqcrwpioqnvzxf
      TARGET_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      TARGET_API_URL: ${{ secrets.VITE_SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Revalidate production control and authorization immediately before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_ACTION: production-deploy
          RELEASE_STANDARD_CONFIRMATION: DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main; export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)" RELEASE_CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ] || [ "$RELEASE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CHECKOUT_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CURRENT_MAIN_SHA" ]; then exit 1; fi
          node scripts/production-break-glass-validation.mjs validate-workflow --out "$RUNNER_TEMP/catalogue-hotfix-authorization.json"
          node scripts/catalogue-hotfix-workflow-helpers.mjs validate-target
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${TARGET_API_URL%/}/rest/v1/" -H "apikey: $TARGET_ANON_KEY")"; [ "$code" = 200 ] || exit 1
      - name: Capture fixed live frontend marker
        run: |
          set -euo pipefail
          mkdir -p evidence; node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"
          npm run --silent release:verify-live-marker -- https://portal.maiprop.co --expected-sha db53d1b9adae41edae93fbeb3e612b42dd8fec0b > "$RUNNER_TEMP/live-frontend-marker.json"
          cp "$RUNNER_TEMP/live-frontend-marker.json" evidence/live-frontend-marker.json
          node --input-type=module -e 'import{readFileSync}from"node:fs";if(JSON.parse(readFileSync("evidence/live-frontend-marker.json")).release_sha!=="db53d1b9adae41edae93fbeb3e612b42dd8fec0b")throw Error("Fixed live frontend marker changed");'
      - name: Apply only manifest-bound production migrations
        run: |
          set -euo pipefail
          # Only manifest versions 20260728123058 and 20260729120405 may become pending SQL.
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"; work="$RUNNER_TEMP/catalogue-hotfix-production"; cli="$GITHUB_WORKSPACE/node_modules/.bin/supabase"; rm -rf "$work"; mkdir -p "$work/supabase/migrations"
          printf '[api]\nenabled = false\n' > "$work/supabase/config.toml"; psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atc 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version' > "$work/remote-numeric-history.txt"
          while IFS= read -r v; do [ -z "$v" ]&&continue; [[ "$v" =~ ^[0-9]+$ ]]||exit 1; jq -e --arg v "$v" '.hotfix.migrations[]|select(.version==$v)' "$RUNNER_TEMP/catalogue-hotfix-contract.json" >/dev/null || printf '%s\n' '-- remote numeric history placeholder; never pending SQL' > "$work/supabase/migrations/${v}_remote_history_placeholder.sql"; done < "$work/remote-numeric-history.txt"; jq -r '.hotfix.migrations[].path' "$RUNNER_TEMP/catalogue-hotfix-contract.json" | while IFS= read -r p; do case "$p" in supabase/migrations/*.sql)cp "$p" "$work/supabase/migrations/$(basename "$p")";;*)exit 1;;esac;done
          (cd "$work"; "$cli" db push --include-all --dry-run --db-url "$TARGET_DB_URL" > dry-run-output.txt 2>&1); node scripts/catalogue-hotfix-workflow-helpers.mjs validate-dry-run "$RUNNER_TEMP/catalogue-hotfix-contract.json" "$work/remote-numeric-history.txt" "$work/dry-run-output.txt" evidence/dry-run-pending.json; (cd "$work"; "$cli" db push --include-all --yes --db-url "$TARGET_DB_URL" > push-output.txt 2>&1)
      - name: Verify production legacy worker, cron, and public API pairs
        run: |
          set -euo pipefail
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atc "SELECT json_build_object('migration_versions',array_agg(version ORDER BY version),'legacy_rpc',to_regprocedure('public.get_public_listing_catalogue(timestamp with time zone)') IS NOT NULL,'publication_rpc',to_regprocedure('public.get_public_catalogue_publication(bigint)') IS NOT NULL,'typed_rpc',to_regproc('public.query_public_catalogue') IS NOT NULL,'anon_legacy_execute',has_function_privilege('anon','public.get_public_listing_catalogue(timestamp with time zone)','EXECUTE'),'publication_id',(SELECT publication_id FROM private.public_catalogue_current WHERE singleton)) FROM supabase_migrations.schema_migrations WHERE version IN ('20260728123058','20260729120405')" > evidence/database-contract.json
          jq -e '(.migration_versions|sort)==["20260728123058","20260729120405"] and .legacy_rpc and .publication_rpc and .typed_rpc and .anon_legacy_execute and .publication_id>0' evidence/database-contract.json >/dev/null
          api="${TARGET_API_URL%/}/rest/v1/rpc/get_public_listing_catalogue"; code="$(curl -sS -o "$RUNNER_TEMP/seed.json" -w '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,city,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=1')"; [ "$code" = 200 ]||exit 1
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const r=JSON.parse(readFileSync(process.argv[1]))[0];if(!r?.id||!r.city||r.status!=="active"||r.is_off_market!==false||!r.project||!Array.isArray(r.listing_images)||r.listing_images.length>3)throw Error("Nonempty legacy card required");writeFileSync(process.argv[2],JSON.stringify({id:r.id,city:r.city}));' "$RUNNER_TEMP/seed.json" evidence/probe-context.json
