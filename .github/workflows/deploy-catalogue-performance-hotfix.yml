name: Deploy Catalogue Performance Database Hotfix

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character current main SHA"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX"
        required: true
        type: string
      single_admin_break_glass:
        description: "Use the configured production deployment authorization"
        required: true
        default: false
        type: boolean
      incident_id:
        description: "Configured incident ID; empty in standard mode"
        required: false
        type: string
      reason:
        description: "Operator-held authorization reason; never persisted"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: catalogue-performance-hotfix-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact database-only hotfix tuple
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact contract runtime
        run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Validate exact current-main control and authorization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_ACTION: production-deploy
          RELEASE_STANDARD_CONFIRMATION: DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export RELEASE_CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$RELEASE_SHA" != "$GITHUB_SHA" ] ||
             [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ] ||
             [ "$RELEASE_SHA" != "$RELEASE_CHECKOUT_SHA" ] ||
             [ "$RELEASE_SHA" != "$RELEASE_CURRENT_MAIN_SHA" ]; then
            echo "::error::The hotfix must run from the exact current main SHA."
            exit 1
          fi
          node scripts/production-break-glass-validation.mjs validate-workflow \
            --out "$RUNNER_TEMP/catalogue-hotfix-authorization.json"
          if [ "$RELEASE_SINGLE_ADMIN_BREAK_GLASS" = "false" ]; then
            node --input-type=module <<'NODE'
            const actor = String(process.env.GITHUB_ACTOR ?? "").trim().toLowerCase();
            const deployers = String(process.env.PRODUCTION_RELEASE_DEPLOYERS ?? "")
              .split(/[\s,]+/).map((value) => value.trim().toLowerCase()).filter(Boolean);
            if (!/^[a-z0-9-]+$/.test(actor) || !new Set(deployers).has(actor)) {
              throw new Error("The actor is not allowlisted for production deployment.");
            }
            NODE
          fi
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json \
            > "$RUNNER_TEMP/catalogue-hotfix-contract.json"

  staging:
    name: Apply and prove staging catalogue database hotfix
    needs: [validate]
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_KIND: staging
      TARGET_PROJECT_REF: xsiehskfgeoqyazcgauv
      TARGET_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      TARGET_API_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact contract runtime
        run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Construct manifest-only temporary migration project and apply staging subset
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"
          if [ -z "$TARGET_DB_URL" ] || [ -z "$TARGET_API_URL" ] || [ -z "$TARGET_ANON_KEY" ] ||
             [[ "$TARGET_DB_URL" != *"$TARGET_PROJECT_REF"* ]] ||
             [[ "$TARGET_API_URL" != *"$TARGET_PROJECT_REF"* ]]; then
            echo "::error::The isolated staging database target is not the manifest-bound project."
            exit 1
          fi
          MIGRATION_WORKDIR="$RUNNER_TEMP/catalogue-hotfix-$TARGET_KIND"
          SUPABASE_CLI="$GITHUB_WORKSPACE/node_modules/.bin/supabase"
          test -x "$SUPABASE_CLI"
          rm -rf "$MIGRATION_WORKDIR"
          mkdir -p "$MIGRATION_WORKDIR/supabase/migrations" evidence
          printf '[api]\nenabled = false\n' > "$MIGRATION_WORKDIR/supabase/config.toml"
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --command 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;' \
            > "$MIGRATION_WORKDIR/remote-numeric-history.txt"
          while IFS= read -r version; do
            [ -z "$version" ] && continue
            if ! [[ "$version" =~ ^[0-9]+$ ]]; then
              echo "::error::Remote migration history is not numeric."
              exit 1
            fi
            if jq -e --arg version "$version" '.hotfix.migrations[] | select(.version == $version)' \
              "$RUNNER_TEMP/catalogue-hotfix-contract.json" >/dev/null; then
              continue
            fi
            printf '%s\n' '-- remote numeric history placeholder; never pending SQL' \
              > "$MIGRATION_WORKDIR/supabase/migrations/${version}_remote_history_placeholder.sql"
          done < "$MIGRATION_WORKDIR/remote-numeric-history.txt"
          jq -r '.hotfix.migrations[].path' "$RUNNER_TEMP/catalogue-hotfix-contract.json" | while IFS= read -r path; do
            case "$path" in supabase/migrations/*.sql) ;; *) echo "::error::Manifest path is outside migrations."; exit 1 ;; esac
            cp "$path" "$MIGRATION_WORKDIR/supabase/migrations/$(basename "$path")"
          done
          if grep -Eq '^(20260728123058|20260729120405)$' "$MIGRATION_WORKDIR/remote-numeric-history.txt"; then
            legacy="$RUNNER_TEMP/recorded-legacy-contract.json"
            status="$(curl --silent --show-error --output "$legacy" --write-out '%{http_code}' -X GET -G "${TARGET_API_URL%/}/rest/v1/rpc/get_public_listing_catalogue" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project:project_detail,listing_images:listing_images_detail' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=1')"
            [ "$status" = 200 ] || { echo "::error::A recorded hotfix migration lacks the corrected legacy contract."; exit 1; }
            node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            const rows = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/recorded-legacy-contract.json", "utf8"));
            if (!Array.isArray(rows) || !rows.length || rows.some((row) => row.status !== "active" || row.is_off_market !== false || !("project" in row) || !("listing_images" in row))) throw new Error("A recorded migration does not satisfy the corrected runtime contract.");
            NODE
          fi
          (
            cd "$MIGRATION_WORKDIR"
            "$SUPABASE_CLI" db push --db-url "$TARGET_DB_URL" --dry-run > dry-run.txt
          )
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const contract = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-contract.json", "utf8")).hotfix;
          const allowed = new Set(contract.migrations.map((migration) => migration.version));
          const dryRun = readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-staging/dry-run.txt", "utf8");
          const pending = [...new Set([...dryRun.matchAll(/\b(\d{14})\b/g)].map((match) => match[1]))];
          if (pending.some((version) => !allowed.has(version))) throw new Error("Dry-run pending migration subset escapes the manifest allowlist.");
          writeFileSync("evidence/dry-run-pending.json", JSON.stringify({ target_kind: "staging", pending_versions: pending }, null, 2) + "\n");
          NODE
          (
            cd "$MIGRATION_WORKDIR"
            "$SUPABASE_CLI" db push --db-url "$TARGET_DB_URL" > push.txt
          )
      - name: Verify staging migration, RPC, anonymous, and publication contract
        run: |
          set -euo pipefail
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
            SELECT json_build_object(
              'migration_versions', array_agg(version ORDER BY version),
              'legacy_rpc', to_regprocedure('public.get_public_listing_catalogue(timestamp with time zone)') IS NOT NULL,
              'publication_rpc', to_regprocedure('public.get_public_catalogue_publication(bigint)') IS NOT NULL,
              'typed_rpc', to_regprocedure('public.query_public_catalogue(bigint,text,text,text,text,numeric,numeric,numeric,numeric,numeric,numeric,numeric,numeric,numeric,numeric,integer,integer,text[],text,text,text,text,text[],numeric,numeric,numeric,numeric,numeric,numeric,text,text,text,timestamp with time zone,numeric,uuid,boolean,integer,integer,jsonb)') IS NOT NULL,
              'anon_legacy_execute', has_function_privilege('anon', 'public.get_public_listing_catalogue(timestamp with time zone)', 'EXECUTE'),
              'publication_id', (SELECT publication_id FROM private.public_catalogue_current WHERE singleton)
            )::text
            FROM supabase_migrations.schema_migrations
            WHERE version IN ('20260728123058', '20260729120405');" | sed '/^[[:space:]]*$/d' > evidence/database-contract.json
          jq -e '(.migration_versions | sort) == ["20260728123058", "20260729120405"] and .legacy_rpc and .publication_rpc and .typed_rpc and .anon_legacy_execute and (.publication_id | type == "number" and . > 0)' evidence/database-contract.json >/dev/null
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/tests/public_catalogue_snapshot_test.sql > evidence/public-catalogue-pgtap.txt
          node scripts/parse-tap-proof.mjs --file evidence/public-catalogue-pgtap.txt --expected-plan 90 > evidence/public-catalogue-pgtap-proof.json
      - name: Prove staging catalogue cron liveness across two minute boundaries
        run: |
          set -euo pipefail
          cron_state() {
            psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "
              WITH job AS (SELECT jobid, jobname, schedule, command, active FROM cron.job WHERE jobname = 'publish-public-catalogue'),
              success AS (SELECT max(details.runid) AS runid FROM cron.job_run_details details JOIN job ON job.jobid = details.jobid WHERE details.status = 'succeeded')
              SELECT json_build_object('captured_at', clock_timestamp(), 'job_count', (SELECT count(*) FROM job), 'schedule', (SELECT min(schedule) FROM job), 'command', (SELECT min(command) FROM job), 'active', (SELECT bool_and(active) FROM job), 'latest_success_run_id', coalesce((SELECT runid FROM success), 0), 'publication_id', (SELECT publication_id FROM private.public_catalogue_current WHERE singleton))::text;" | sed '/^[[:space:]]*$/d'
          }
          cron_state > evidence/catalogue-cron-baseline.json
          jq -e '.job_count == 1 and .schedule == "* * * * *" and .command == "SELECT private.publish_public_catalogue();" and .active == true and (.publication_id > 0)' evidence/catalogue-cron-baseline.json >/dev/null
          baseline_publication_id="$(jq -r '.publication_id' evidence/catalogue-cron-baseline.json)"
          baseline_run_id="$(jq -r '.latest_success_run_id' evidence/catalogue-cron-baseline.json)"
          ready=false
          for attempt in $(seq 1 36); do
            cron_state > evidence/catalogue-cron-current.json
            if jq -e --argjson publication "$baseline_publication_id" --argjson run "$baseline_run_id" '.latest_success_run_id >= ($run + 2) and .publication_id >= ($publication + 2)' evidence/catalogue-cron-current.json >/dev/null; then ready=true; break; fi
            sleep 10
          done
          if [ "$ready" != true ]; then echo "::error::Catalogue publication did not advance across two minute boundaries."; exit 1; fi
          jq -n --slurpfile before evidence/catalogue-cron-baseline.json --slurpfile after evidence/catalogue-cron-current.json '{minute_boundaries: 2, baseline: $before[0], final: $after[0]}' > evidence/catalogue-cron-proof.json
      - name: Exercise legacy PostgREST shapes and collect thirty anonymous samples
        run: |
          set -euo pipefail
          api="${TARGET_API_URL%/}/rest/v1/rpc/get_public_listing_catalogue"
          card="$RUNNER_TEMP/card.json"; detail="$RUNNER_TEMP/detail.json"
          code="$(curl --silent --show-error --output "$card" --write-out '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,city,location_search_text,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'location_search_text=ilike.*athens*' --data-urlencode 'limit=12')"
          [ "$code" = 200 ] || { echo "::error::Legacy card request failed."; exit 1; }
          code="$(curl --silent --show-error --output "$detail" --write-out '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project:project_detail,listing_images:listing_images_detail' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=1')"
          [ "$code" = 200 ] || { echo "::error::Legacy detail request failed."; exit 1; }
          head_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X HEAD -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=12')"
          [[ "$head_code" = 200 || "$head_code" = 206 ]] || { echo "::error::Legacy catalogue HEAD failed."; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const card = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/card.json", "utf8"));
          const detail = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/detail.json", "utf8"));
          if (!Array.isArray(card) || !Array.isArray(detail) || !detail.length || card.some((row) => row.status !== "active" || row.is_off_market !== false || (Array.isArray(row.listing_images) && row.listing_images.length > 3)) || detail.some((row) => !("project" in row) || !("listing_images" in row))) throw new Error("Legacy PostgREST response shape is incompatible.");
          NODE
          : > evidence/http-samples.ndjson
          for sample in $(seq 1 30); do
            body="$RUNNER_TEMP/sample-$sample.json"; started="$(date +%s%3N)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project,listing_images' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=12')"; ended="$(date +%s%3N)"
            [[ "$status" = 200 || "$status" = 206 ]] || { echo "::error::Anonymous catalogue sample failed."; exit 1; }
            if grep -qi 'fixture' "$body"; then echo "::error::Catalogue sample returned fixture data."; exit 1; fi
            jq -n --argjson sample "$sample" --argjson status "$status" --argjson duration_ms "$((ended-started))" --arg kind "$([ "$sample" = 1 ] && echo cold || echo warm)" '{sample: $sample, status: $status, duration_ms: $duration_ms, kind: $kind}' >> evidence/http-samples.ndjson
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const rows = readFileSync("evidence/http-samples.ndjson", "utf8").trim().split("\n").map(JSON.parse);
          const percentile = (values, p) => [...values].sort((a,b) => a-b)[Math.ceil(values.length * p) - 1];
          const cold = rows.filter((row) => row.kind === "cold").map((row) => row.duration_ms);
          const warm = rows.filter((row) => row.kind === "warm").map((row) => row.duration_ms);
          const result = { target_kind: "staging", sample_count: rows.length, statuses: rows.map((row) => row.status), cold_p95_ms: percentile(cold, .95), warm_p95_ms: percentile(warm, .95), completed_at: new Date().toISOString() };
          if (rows.length !== 30 || result.cold_p95_ms > 1800 || result.warm_p95_ms > 1000) throw new Error("Catalogue latency ceiling failed.");
          writeFileSync("evidence/http-latency.json", JSON.stringify(result, null, 2) + "\n");
          NODE
      - name: Write minimized staging evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const contract = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-contract.json", "utf8")).hotfix;
          const evidence = { target_kind: "staging", release_sha: process.env.RELEASE_SHA, frontend_sha: contract.livePagesSha, migrations: contract.migrations.map(({version,path,sha256}) => ({version,path,sha256})), database_contract: JSON.parse(readFileSync("evidence/database-contract.json", "utf8")), http: JSON.parse(readFileSync("evidence/http-latency.json", "utf8")), completed_at: new Date().toISOString() };
          writeFileSync("evidence/catalogue-performance-hotfix-staging.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-performance-hotfix-staging-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  production:
    name: Apply and prove production catalogue database hotfix
    needs: [validate, staging]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_KIND: production
      TARGET_PROJECT_REF: qvvicunqcrwpioqnvzxf
      TARGET_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      TARGET_API_URL: ${{ secrets.VITE_SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact contract runtime
        run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Revalidate exact production control and authorization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_ACTION: production-deploy
          RELEASE_STANDARD_CONFIRMATION: DEPLOY_CATALOGUE_PERFORMANCE_HOTFIX
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export RELEASE_CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CHECKOUT_SHA" ] || [ "$RELEASE_SHA" != "$RELEASE_CURRENT_MAIN_SHA" ]; then echo "::error::Production control identity changed."; exit 1; fi
          node scripts/production-break-glass-validation.mjs validate-workflow --out "$RUNNER_TEMP/catalogue-hotfix-authorization.json"
      - name: Require unchanged live frontend marker
        run: |
          set -euo pipefail
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"
          LIVE_PAGES_SHA="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          process.stdout.write(JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-contract.json", "utf8")).hotfix.livePagesSha);
          NODE
          )"
          test "$LIVE_PAGES_SHA" = db53d1b9adae41edae93fbeb3e612b42dd8fec0b
          npm run --silent release:verify-live-marker -- https://portal.maiprop.co --expected-sha "$LIVE_PAGES_SHA" > "$RUNNER_TEMP/live-frontend-marker.json"
      - name: Construct manifest-only temporary migration project and apply production subset
        run: |
          set -euo pipefail
          umask 077
          node scripts/catalogue-performance-hotfix-contract.mjs verify --json > "$RUNNER_TEMP/catalogue-hotfix-contract.json"
          if [ -z "$TARGET_DB_URL" ] || [ -z "$TARGET_API_URL" ] || [ -z "$TARGET_ANON_KEY" ] || [[ "$TARGET_DB_URL" != *"$TARGET_PROJECT_REF"* ]] || [[ "$TARGET_API_URL" != *"$TARGET_PROJECT_REF"* ]]; then echo "::error::Production database target is not the manifest-bound project."; exit 1; fi
          MIGRATION_WORKDIR="$RUNNER_TEMP/catalogue-hotfix-$TARGET_KIND"
          SUPABASE_CLI="$GITHUB_WORKSPACE/node_modules/.bin/supabase"
          test -x "$SUPABASE_CLI"
          rm -rf "$MIGRATION_WORKDIR"; mkdir -p "$MIGRATION_WORKDIR/supabase/migrations" evidence
          printf '[api]\nenabled = false\n' > "$MIGRATION_WORKDIR/supabase/config.toml"
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;' > "$MIGRATION_WORKDIR/remote-numeric-history.txt"
          while IFS= read -r version; do
            [ -z "$version" ] && continue
            [[ "$version" =~ ^[0-9]+$ ]] || { echo "::error::Remote migration history is not numeric."; exit 1; }
            if jq -e --arg version "$version" '.hotfix.migrations[] | select(.version == $version)' "$RUNNER_TEMP/catalogue-hotfix-contract.json" >/dev/null; then continue; fi
            printf '%s\n' '-- remote numeric history placeholder; never pending SQL' > "$MIGRATION_WORKDIR/supabase/migrations/${version}_remote_history_placeholder.sql"
          done < "$MIGRATION_WORKDIR/remote-numeric-history.txt"
          jq -r '.hotfix.migrations[].path' "$RUNNER_TEMP/catalogue-hotfix-contract.json" | while IFS= read -r path; do case "$path" in supabase/migrations/*.sql) cp "$path" "$MIGRATION_WORKDIR/supabase/migrations/$(basename "$path")" ;; *) echo "::error::Manifest path is outside migrations."; exit 1 ;; esac; done
          if grep -Eq '^(20260728123058|20260729120405)$' "$MIGRATION_WORKDIR/remote-numeric-history.txt"; then
            legacy="$RUNNER_TEMP/recorded-legacy-contract.json"
            status="$(curl --silent --show-error --output "$legacy" --write-out '%{http_code}' -X GET -G "${TARGET_API_URL%/}/rest/v1/rpc/get_public_listing_catalogue" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'select=id,status,is_off_market,project:project_detail,listing_images:listing_images_detail' --data-urlencode 'status=eq.active' --data-urlencode 'is_off_market=eq.false' --data-urlencode 'limit=1')"
            [ "$status" = 200 ] || { echo "::error::A recorded hotfix migration lacks the corrected legacy contract."; exit 1; }
            node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            const rows = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/recorded-legacy-contract.json", "utf8"));
            if (!Array.isArray(rows) || !rows.length || rows.some((row) => row.status !== "active" || row.is_off_market !== false || !("project" in row) || !("listing_images" in row))) throw new Error("A recorded migration does not satisfy the corrected runtime contract.");
            NODE
          fi
          ( cd "$MIGRATION_WORKDIR" && "$SUPABASE_CLI" db push --db-url "$TARGET_DB_URL" --dry-run > dry-run.txt )
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const contract = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-contract.json", "utf8")).hotfix;
          const allowed = new Set(contract.migrations.map((migration) => migration.version));
          const dryRun = readFileSync(process.env.RUNNER_TEMP + "/catalogue-hotfix-production/dry-run.txt", "utf8");
          const pending = [...new Set([...dryRun.matchAll(/\b(\d{14})\b/g)].map((match) => match[1]))];
          if (pending.some((version) => !allowed.has(version))) throw new Error("Dry-run pending migration subset escapes the manifest allowlist.");
          writeFileSync("evidence/dry-run-pending.json", JSON.stringify({ target_kind: "production", pending_versions: pending }, null, 2) + "\n");
          NODE
          ( cd "$MIGRATION_WORKDIR" && "$SUPABASE_CLI" db push --db-url "$TARGET_DB_URL" > push.txt )
      - name: Verify production migration, RPC, publication, and anonymous latency contract
        run: |
          set -euo pipefail
          psql "$TARGET_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT json_build_object('migration_versions', array_agg(version ORDER BY version), 'legacy_rpc', to_regprocedure('public.get_public_listing_catalogue(timestamp with time zone)') IS NOT NULL, 'publication_rpc', to_regprocedure('public.get_public_catalogue_publication(bigint)') IS NOT NULL, 'anon_legacy_execute', has_function_privilege('anon', 'public.get_public_listing_catalogue(timestamp with time zone)', 'EXECUTE'), 'publication_id', (SELECT publication_id FROM private.public_catalogue_current WHERE singleton))::text FROM supabase_migrations.schema_migrations WHERE version IN ('20260728123058', '20260729120405');" | sed '/^[[:space:]]*$/d' > evidence/database-contract.json
          jq -e '(.migration_versions | sort) == ["20260728123058", "20260729120405"] and .legacy_rpc and .publication_rpc and .anon_legacy_execute and (.publication_id > 0)' evidence/database-contract.json >/dev/null
          api="${TARGET_API_URL%/}/rest/v1/rpc/query_public_catalogue"; : > evidence/http-samples.ndjson
          for sample in $(seq 1 30); do body="$RUNNER_TEMP/sample-$sample.json"; started="$(date +%s%3N)"; status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -X GET -G "$api" -H "apikey: $TARGET_ANON_KEY" --data-urlencode 'p_limit=12')"; ended="$(date +%s%3N)"; [[ "$status" = 200 || "$status" = 206 ]] || { echo "::error::Anonymous catalogue sample failed."; exit 1; }; if grep -qi 'fixture' "$body"; then echo "::error::Catalogue sample returned fixture data."; exit 1; fi; jq -n --argjson sample "$sample" --argjson status "$status" --argjson duration_ms "$((ended-started))" --arg kind "$([ "$sample" = 1 ] && echo cold || echo warm)" '{sample: $sample, status: $status, duration_ms: $duration_ms, kind: $kind}' >> evidence/http-samples.ndjson; done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const rows = readFileSync("evidence/http-samples.ndjson", "utf8").trim().split("\n").map(JSON.parse), p=(v,q)=>[...v].sort((a,b)=>a-b)[Math.ceil(v.length*q)-1];
          const cold=rows.filter(r=>r.kind==="cold").map(r=>r.duration_ms), warm=rows.filter(r=>r.kind==="warm").map(r=>r.duration_ms), result={target_kind:"production",sample_count:rows.length,statuses:rows.map(r=>r.status),cold_p95_ms:p(cold,.95),warm_p95_ms:p(warm,.95),completed_at:new Date().toISOString()};
          if(rows.length!==30||result.cold_p95_ms>1800||result.warm_p95_ms>1000) throw new Error("Catalogue latency ceiling failed."); writeFileSync("evidence/http-latency.json",JSON.stringify(result,null,2)+"\n");
          NODE
      - name: Write minimized production evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const contract=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/catalogue-hotfix-contract.json","utf8")).hotfix;
          writeFileSync("evidence/catalogue-performance-hotfix-production.json",JSON.stringify({target_kind:"production",release_sha:process.env.RELEASE_SHA,frontend_sha:contract.livePagesSha,migrations:contract.migrations.map(({version,path,sha256})=>({version,path,sha256})),database_contract:JSON.parse(readFileSync("evidence/database-contract.json","utf8")),http:JSON.parse(readFileSync("evidence/http-latency.json","utf8")),completed_at:new Date().toISOString()},null,2)+"\n");
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-performance-hotfix-production-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
