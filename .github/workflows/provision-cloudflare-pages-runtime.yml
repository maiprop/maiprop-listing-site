name: Provision Cloudflare Pages Runtime

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fixed Pages runtime to provision"
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: "Full exact current-main control SHA"
        required: true
        type: string
      confirm:
        description: "Type the target-specific PROVISION_*_PAGES_RUNTIME phrase"
        required: true
        type: string
      single_admin_break_glass:
        description: "Use the exact-SHA single-admin break-glass authorization"
        required: true
        default: false
        type: boolean
      incident_id:
        description: "Configured break-glass incident ID; empty in standard mode"
        required: false
        type: string
      reason:
        description: "Ephemeral break-glass reason; empty in standard mode"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  provision:
    name: Provision strict Pages runtime bindings
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == github.triggering_actor &&
      inputs.release_sha == github.workflow_sha &&
      (inputs.target == 'staging' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: maiprop-cloudflare-pages-runtime-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Verify exact current-main control identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$current_main" != "$GITHUB_WORKFLOW_SHA" ] ||
             [ "$GITHUB_SHA" != "$GITHUB_WORKFLOW_SHA" ] ||
             [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "::error::Pages runtime provisioning must execute from the exact current main SHA."
            exit 1
          fi

      - name: Check out the exact release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Verify exact checkout identity
        id: checkout
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$checkout_sha" != "$RELEASE_SHA" ] ||
             ! [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Exact Pages runtime checkout validation failed."
            exit 1
          fi
          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Select release authorization
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_TARGET: ${{ inputs.target }}
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CHECKOUT_SHA: ${{ steps.checkout.outputs.checkout_sha }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          if [ "$PAGES_TARGET" = "staging" ]; then
            RELEASE_AUTHORIZATION_ACTION="pages-staging"
            RELEASE_STANDARD_CONFIRMATION="PROVISION_STAGING_PAGES_RUNTIME"
          else
            RELEASE_AUTHORIZATION_ACTION="pages-production"
            RELEASE_STANDARD_CONFIRMATION="PROVISION_PRODUCTION_PAGES_RUNTIME"
          fi
          export RELEASE_AUTHORIZATION_ACTION RELEASE_STANDARD_CONFIRMATION
          export RELEASE_CURRENT_MAIN_SHA
          RELEASE_CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          node scripts/production-break-glass-validation.mjs validate-workflow \
            --out release-authorization.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Enforce standard Pages authorization gates
        if: ${{ steps.authorization.outputs.mode == 'standard' }}
        env:
          PAGES_TARGET: ${{ inputs.target }}
          ALLOWED_ACTORS: ${{ vars.PRODUCTION_RELEASE_APPROVERS }}
          DEPLOYER_ACTORS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          STAGING_RELEASE_ENABLED: ${{ vars.STAGING_RELEASE_ENABLED }}
          PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$PAGES_TARGET" = "staging" ]; then
            target_release_enabled="$STAGING_RELEASE_ENABLED"
          else
            target_release_enabled="$PRODUCTION_RELEASE_ENABLED"
          fi
          if [ "$target_release_enabled" != "true" ]; then
            echo "::error::The target release-enabled gate must be true in standard mode."
            exit 1
          fi
          case ",${ALLOWED_ACTORS// /}," in
            *,"$GITHUB_ACTOR",*) ;;
            *)
              echo "::error::Pages runtime provisioning dispatcher is not an allowlisted release approver."
              exit 1
              ;;
          esac
          case ",${DEPLOYER_ACTORS// /}," in
            *,"$GITHUB_ACTOR",*)
              echo "::error::A release deployer cannot also provision the protected Pages runtime."
              exit 1
              ;;
            *) ;;
          esac

      - name: Reject disabled standard Pages target
        if: ${{ steps.authorization.outputs.mode == 'standard' && !((inputs.target == 'staging' && vars.STAGING_RELEASE_ENABLED == 'true') || (inputs.target == 'production' && vars.PRODUCTION_RELEASE_ENABLED == 'true')) }}
        run: |
          echo "::error::The target release-enabled gate must be true in standard mode."
          exit 1

      - name: Record standard no-consumption sentinel
        id: standard_consumption
        if: ${{ steps.authorization.outputs.mode == 'standard' }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"mode":"standard"}' > consumption-tuple.json
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Verify provider credential isolation
        env:
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CLOUDFLARE_PAGES_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          CLOUDFLARE_STAGING_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_PAGES_READ_TOKEN }}
          CLOUDFLARE_STAGING_PAGES_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_PAGES_EDIT_TOKEN }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
          CLOUDFLARE_STAGING_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_STAGING_TURN_KEY_ID }}
          CLOUDFLARE_STAGING_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TURN_API_TOKEN }}
        run: |
          set -euo pipefail
          values=(
            "$CLOUDFLARE_PAGES_READ_TOKEN"
            "$CLOUDFLARE_PAGES_EDIT_TOKEN"
            "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN"
            "$CLOUDFLARE_STAGING_PAGES_EDIT_TOKEN"
            "$CLOUDFLARE_TURN_KEY_ID"
            "$CLOUDFLARE_TURN_API_TOKEN"
            "$CLOUDFLARE_STAGING_TURN_KEY_ID"
            "$CLOUDFLARE_STAGING_TURN_API_TOKEN"
          )
          for value in "${values[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::Complete production and staging provider credentials are required."
              exit 1
            fi
            echo "::add-mask::$value"
          done
          pages_tokens=(
            "$CLOUDFLARE_PAGES_READ_TOKEN"
            "$CLOUDFLARE_PAGES_EDIT_TOKEN"
            "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN"
            "$CLOUDFLARE_STAGING_PAGES_EDIT_TOKEN"
          )
          if [ "$(printf '%s\n' "${pages_tokens[@]}" | sort -u | wc -l)" -ne 4 ]; then
            echo "::error::Pages read/edit credentials must be four distinct scoped tokens."
            exit 1
          fi
          if [ "$CLOUDFLARE_STAGING_TURN_KEY_ID" = "$CLOUDFLARE_TURN_KEY_ID" ] ||
             [ "$CLOUDFLARE_STAGING_TURN_API_TOKEN" = "$CLOUDFLARE_TURN_API_TOKEN" ]; then
            echo "::error::Staging and production TURN credentials must be distinct."
            exit 1
          fi

      - name: Install exact-name receipt listing guard
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-consumption-artifacts.mjs" <<'NODE'
          import { readFileSync } from "node:fs";

          const [listingPath, exactName, mode, expectedId = "", expectedDigest = ""] =
            process.argv.slice(2);
          const listing = JSON.parse(readFileSync(listingPath, "utf8"));
          if (!listing || typeof listing !== "object" || !Array.isArray(listing.artifacts)) {
            throw new Error("Artifact listing has an invalid shape.");
          }
          const matches = listing.artifacts.filter(
            (artifact) => artifact && artifact.name === exactName,
          );
          if (mode === "precheck") {
            if (matches.length !== 0) {
              throw new Error("The exact break-glass action is already consumed.");
            }
          } else if (mode === "postcheck") {
            if (!/^[1-9][0-9]*$/.test(expectedId) || !/^[0-9a-f]{64}$/.test(expectedDigest)) {
              throw new Error("Expected immutable artifact identity is invalid.");
            }
            const match = matches[0];
            const apiDigest = String(match?.digest ?? "");
            if (
              matches.length !== 1 ||
              String(match?.id ?? "") !== expectedId ||
              !/^sha256:[0-9a-f]{64}$/.test(apiDigest) ||
              apiDigest.slice("sha256:".length) !== expectedDigest ||
              match?.expired !== false
            ) {
              throw new Error("Uploaded consumption artifact identity is not unique and exact.");
            }
          } else {
            throw new Error("Artifact listing verification mode is unsupported.");
          }
          NODE

      - name: Precheck and create break-glass consumption receipt
        id: receipt
        if: ${{ steps.authorization.outputs.mode == 'break_glass' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_name="$(node scripts/production-break-glass-consumption.mjs name \
            --authorization release-authorization.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100" \
            > receipt-precheck.json
          node "$RUNNER_TEMP/verify-consumption-artifacts.mjs" \
            receipt-precheck.json "$receipt_name" precheck
          node scripts/production-break-glass-consumption.mjs create \
            --authorization release-authorization.json \
            --out production-break-glass-consumption.json
          echo "receipt_name=$receipt_name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable break-glass consumption receipt
        id: receipt_upload
        if: ${{ steps.authorization.outputs.mode == 'break_glass' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.receipt.outputs.receipt_name }}
          path: production-break-glass-consumption.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Create and same-run verify consumption receipt binding
        if: ${{ steps.authorization.outputs.mode == 'break_glass' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
          RECEIPT_ARTIFACT_NAME: ${{ steps.receipt.outputs.receipt_name }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.checkout.outputs.source_tree }}
        run: |
          set -euo pipefail
          if ! [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The consumption receipt upload did not return immutable identity."
            exit 1
          fi
          mkdir -p receipt-binding receipt-binding-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > receipt-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > receipt-binding-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root production-break-glass-consumption.json \
            --out receipt-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/provision-cloudflare-pages-runtime.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" --artifact-name "$RECEIPT_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding receipt-binding/release-artifact-binding.json \
            --payload-root production-break-glass-consumption.json \
            --artifact-metadata receipt-binding-metadata/artifact.json \
            --producer-run receipt-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/provision-cloudflare-pages-runtime.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" --artifact-name "$RECEIPT_ARTIFACT_NAME" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > receipt-binding/verification.json

      - name: Upload immutable consumption receipt binding
        id: receipt_binding_upload
        if: ${{ steps.authorization.outputs.mode == 'break_glass' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.receipt.outputs.receipt_name }}-binding
          path: receipt-binding/
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Postcheck and finalize break-glass consumption tuple
        id: break_glass_consumption
        if: ${{ steps.authorization.outputs.mode == 'break_glass' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_NAME: ${{ steps.receipt.outputs.receipt_name }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
          RECEIPT_BINDING_ARTIFACT_ID: ${{ steps.receipt_binding_upload.outputs.artifact-id }}
          PAGES_ACTION: ${{ steps.authorization.outputs.action }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${RECEIPT_ARTIFACT_NAME}&per_page=100" \
            > receipt-postcheck.json
          node "$RUNNER_TEMP/verify-consumption-artifacts.mjs" \
            receipt-postcheck.json "$RECEIPT_ARTIFACT_NAME" postcheck \
            "$RECEIPT_ARTIFACT_ID" "$RECEIPT_ARTIFACT_DIGEST"
          node scripts/production-break-glass-consumption.mjs verify \
            --file production-break-glass-consumption.json \
            --authorization release-authorization.json \
            --action "$PAGES_ACTION"
          payload_sha256="$(sha256sum production-break-glass-consumption.json | awk '{print $1}')"
          export RECEIPT_PAYLOAD_SHA256="$payload_sha256"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { consumptionTuple } from "./scripts/production-break-glass-consumption.mjs";
          const receipt = JSON.parse(
            readFileSync("production-break-glass-consumption.json", "utf8"),
          );
          const tuple = consumptionTuple({
            receipt,
            payloadArtifact: {
              artifactId: process.env.RECEIPT_ARTIFACT_ID,
              artifactDigest: process.env.RECEIPT_ARTIFACT_DIGEST,
            },
            bindingArtifact: {
              artifactId: process.env.RECEIPT_BINDING_ARTIFACT_ID,
            },
            payloadSha256: process.env.RECEIPT_PAYLOAD_SHA256,
          });
          writeFileSync("consumption-tuple.json", `${JSON.stringify(tuple, null, 2)}\n`);
          NODE
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Provision strict Cloudflare Pages runtime bindings
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          AUTHORIZATION_MODE: ${{ steps.authorization.outputs.mode }}
          PAGES_ACTION: ${{ steps.authorization.outputs.action }}
          RECEIPT_BINDING_ARTIFACT_ID: ${{ steps.receipt_binding_upload.outputs.artifact-id }}
          CONSUMPTION_VERIFIED: ${{ steps.standard_consumption.outputs.verified || steps.break_glass_consumption.outputs.verified }}
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STAGING_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_PAGES_READ_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          TARGET_EDIT_TOKEN: ${{ inputs.target == 'staging' && secrets.CLOUDFLARE_STAGING_PAGES_EDIT_TOKEN || secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_ID: ${{ vars.CLOUDFLARE_PAGES_PROJECT_ID }}
          CLOUDFLARE_STAGING_PAGES_PROJECT_ID: ${{ vars.CLOUDFLARE_STAGING_PAGES_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ inputs.target == 'staging' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
          PAGES_RUNTIME_TURN_KEY_ID: ${{ inputs.target == 'staging' && secrets.CLOUDFLARE_STAGING_TURN_KEY_ID || secrets.CLOUDFLARE_TURN_KEY_ID }}
          PAGES_RUNTIME_TURN_API_TOKEN: ${{ inputs.target == 'staging' && secrets.CLOUDFLARE_STAGING_TURN_API_TOKEN || secrets.CLOUDFLARE_TURN_API_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_ID: ${{ vars.PRODUCTION_SUPABASE_PROJECT_ID }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_APP_URL: https://portal.maiprop.co
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_RUNTIME_MODE: ${{ vars.VITE_STRIPE_RUNTIME_MODE }}
          VITE_BILLING_MODE: ${{ vars.VITE_BILLING_MODE }}
          VITE_STRIPE_PRICE_PARTICIPANT_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_PARTICIPANT_MONTHLY }}
          VITE_STRIPE_PRICE_PARTICIPANT_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_PARTICIPANT_ANNUAL }}
          VITE_STRIPE_PRICE_AGENT_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_AGENT_MONTHLY }}
          VITE_STRIPE_PRICE_AGENT_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_AGENT_ANNUAL }}
          VITE_STRIPE_PRICE_DEVELOPER_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_DEVELOPER_MONTHLY }}
          VITE_STRIPE_PRICE_DEVELOPER_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_DEVELOPER_ANNUAL }}
          VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
          VITE_STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
        run: |
          set -euo pipefail
          if [ "$CONSUMPTION_VERIFIED" != "true" ]; then
            echo "::error::Pages mutation requires a verified standard sentinel or one-shot consumption tuple."
            exit 1
          fi
          PRODUCTION_PROJECT="maiprop-listing-site"
          STAGING_PROJECT="maiprop-listing-site-staging"
          export PRODUCTION_PROJECT STAGING_PROJECT
          API_BASE="https://api.cloudflare.com/client/v4"
          RAW_DIR="$RUNNER_TEMP/cloudflare-pages-runtime-raw"
          EVIDENCE_DIR="$RUNNER_TEMP/cloudflare-pages-runtime-evidence"
          mkdir -p "$RAW_DIR" "$EVIDENCE_DIR"
          trap 'rm -rf "$RAW_DIR"' EXIT

          for value in \
            "$CLOUDFLARE_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_STAGING_ACCOUNT_ID" \
            "$TARGET_EDIT_TOKEN" \
            "$PAGES_RUNTIME_TURN_KEY_ID" \
            "$PAGES_RUNTIME_TURN_API_TOKEN" \
            "$CLOUDFLARE_PAGES_PROJECT_ID" \
            "$CLOUDFLARE_STAGING_PAGES_PROJECT_ID"; do
            if [ -z "$value" ]; then
              echo "::error::Complete isolated Pages read/edit identities are required."
              exit 1
            fi
            echo "::add-mask::$value"
          done
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "$CLOUDFLARE_STAGING_ACCOUNT_ID" ] ||
             [ "$CLOUDFLARE_PAGES_PROJECT_ID" = "$CLOUDFLARE_STAGING_PAGES_PROJECT_ID" ]; then
            echo "::error::Pages runtime identities are not isolated."
            exit 1
          fi

          get_project() {
            local token="$1"
            local account_id="$2"
            local name="$3"
            local out="$4"
            curl -fsS --retry 3 \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/json" \
              "$API_BASE/accounts/$account_id/pages/projects/$name" \
              > "$out"
          }

          PRODUCTION_PRE="$RAW_DIR/production-pre.json"
          STAGING_PRE="$RAW_DIR/staging-pre.json"
          get_project \
            "$CLOUDFLARE_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$PRODUCTION_PROJECT" \
            "$PRODUCTION_PRE"
          get_project \
            "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_STAGING_ACCOUNT_ID" \
            "$STAGING_PROJECT" \
            "$STAGING_PRE"
          jq -e --arg id "$CLOUDFLARE_PAGES_PROJECT_ID" --arg name "$PRODUCTION_PROJECT" \
            '.success == true and .result.id == $id and .result.name == $name' \
            "$PRODUCTION_PRE" > /dev/null
          jq -e --arg id "$CLOUDFLARE_STAGING_PAGES_PROJECT_ID" --arg name "$STAGING_PROJECT" \
            '.success == true and .result.id == $id and .result.name == $name' \
            "$STAGING_PRE" > /dev/null
          node scripts/validate-cloudflare-pages-staging-posture.mjs \
            --mode git-lock \
            --staging-project-file "$STAGING_PRE" \
            --production-project-file "$PRODUCTION_PRE" \
            --out "$EVIDENCE_DIR/cloudflare-pages-runtime-pre-lock.json"

          service_role_key=""
          if [ "$PAGES_TARGET" = "staging" ]; then
            TARGET_PROJECT="$STAGING_PROJECT"
            TARGET_PROJECT_ID="$CLOUDFLARE_STAGING_PAGES_PROJECT_ID"
            TARGET_ACCOUNT_ID="$CLOUDFLARE_STAGING_ACCOUNT_ID"
            TARGET_CURRENT="$STAGING_PRE"
            service_role_key="$(
              curl -fsS --retry 3 \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$STAGING_SUPABASE_PROJECT_ID/api-keys?reveal=true" \
                | jq -er '
                    (if type == "array" then . else (.keys // .result // []) end)
                    | map(select(
                        (.type // "") == "secret" or
                        (.name // .role // .id // "") == "service_role"
                      ))
                    | sort_by(if (.type // "") == "secret" then 0 else 1 end)
                    | .[0]
                    | (.api_key // .key // .value // empty)
                  '
            )"
            if [ -z "$service_role_key" ] ||
               [ "$service_role_key" = "$STAGING_SUPABASE_PUBLISHABLE_KEY" ]; then
              echo "::error::Could not resolve an isolated staging Supabase service credential."
              exit 1
            fi
            echo "::add-mask::$service_role_key"
            plain_text_json="$(
              jq -cn \
                --arg url "$STAGING_SUPABASE_URL" \
                --arg project "$STAGING_SUPABASE_PROJECT_ID" \
                --arg key "$STAGING_SUPABASE_PUBLISHABLE_KEY" \
                --arg app "$STAGING_APP_URL" '{
                  SUPABASE_URL: $url,
                  SUPABASE_PROJECT_ID: $project,
                  SUPABASE_PUBLISHABLE_KEY: $key,
                  VITE_SUPABASE_URL: $url,
                  VITE_SUPABASE_PROJECT_ID: $project,
                  VITE_SUPABASE_PUBLISHABLE_KEY: $key,
                  VITE_APP_URL: $app,
                  VITE_PUBLIC_API_ORIGIN: $app,
                  VITE_APP_ENVIRONMENT: "staging",
                  MAIPROP_TURN_TTL_SECONDS: "21600"
                }'
            )"
          else
            TARGET_PROJECT="$PRODUCTION_PROJECT"
            TARGET_PROJECT_ID="$CLOUDFLARE_PAGES_PROJECT_ID"
            TARGET_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            TARGET_CURRENT="$PRODUCTION_PRE"
            plain_text_json="$(
              jq -cn \
                --arg url "$PRODUCTION_SUPABASE_URL" \
                --arg project "$PRODUCTION_SUPABASE_PROJECT_ID" \
                --arg key "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
                --arg app "$PRODUCTION_APP_URL" \
                --arg stripe_key "$VITE_STRIPE_PUBLISHABLE_KEY" \
                --arg stripe_mode "$VITE_STRIPE_RUNTIME_MODE" \
                --arg billing_mode "$VITE_BILLING_MODE" \
                --arg participant_monthly "$VITE_STRIPE_PRICE_PARTICIPANT_MONTHLY" \
                --arg participant_annual "$VITE_STRIPE_PRICE_PARTICIPANT_ANNUAL" \
                --arg agent_monthly "$VITE_STRIPE_PRICE_AGENT_MONTHLY" \
                --arg agent_annual "$VITE_STRIPE_PRICE_AGENT_ANNUAL" \
                --arg developer_monthly "$VITE_STRIPE_PRICE_DEVELOPER_MONTHLY" \
                --arg developer_annual "$VITE_STRIPE_PRICE_DEVELOPER_ANNUAL" \
                --arg professional_monthly "$VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY" \
                --arg professional_annual "$VITE_STRIPE_PRICE_PROFESSIONAL_ANNUAL" '{
                  SUPABASE_URL: $url,
                  SUPABASE_PROJECT_ID: $project,
                  SUPABASE_PUBLISHABLE_KEY: $key,
                  VITE_SUPABASE_URL: $url,
                  VITE_SUPABASE_PROJECT_ID: $project,
                  VITE_SUPABASE_PUBLISHABLE_KEY: $key,
                  VITE_APP_URL: $app,
                  VITE_PUBLIC_API_ORIGIN: $app,
                  VITE_APP_ENVIRONMENT: "production",
                  MAIPROP_TURN_TTL_SECONDS: "21600",
                  VITE_STRIPE_PUBLISHABLE_KEY: $stripe_key,
                  VITE_STRIPE_RUNTIME_MODE: $stripe_mode,
                  VITE_BILLING_MODE: $billing_mode,
                  VITE_STRIPE_PRICE_PARTICIPANT_MONTHLY: $participant_monthly,
                  VITE_STRIPE_PRICE_PARTICIPANT_ANNUAL: $participant_annual,
                  VITE_STRIPE_PRICE_AGENT_MONTHLY: $agent_monthly,
                  VITE_STRIPE_PRICE_AGENT_ANNUAL: $agent_annual,
                  VITE_STRIPE_PRICE_DEVELOPER_MONTHLY: $developer_monthly,
                  VITE_STRIPE_PRICE_DEVELOPER_ANNUAL: $developer_annual,
                  VITE_STRIPE_PRICE_PROFESSIONAL_MONTHLY: $professional_monthly,
                  VITE_STRIPE_PRICE_PROFESSIONAL_ANNUAL: $professional_annual
                }'
            )"
          fi
          echo "::add-mask::$PAGES_RUNTIME_TURN_KEY_ID"
          echo "::add-mask::$PAGES_RUNTIME_TURN_API_TOKEN"

          PATCH_BODY="$RAW_DIR/runtime-patch.json"
          PATCH_PLAN="$EVIDENCE_DIR/cloudflare-pages-runtime-patch-plan.json"
          PAGES_RUNTIME_PLAIN_TEXT_JSON="$plain_text_json" \
          PAGES_RUNTIME_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            node scripts/build-cloudflare-pages-runtime-patch.mjs \
              --target "$PAGES_TARGET" \
              --current "$TARGET_CURRENT" \
              --out "$PATCH_BODY" \
              --evidence "$PATCH_PLAN"
          unset service_role_key plain_text_json

          if [ "$AUTHORIZATION_MODE" = "break_glass" ]; then
            test -s production-break-glass-consumption.json
            test -s release-authorization.json
            test -s receipt-binding/verification.json
            test -s receipt-binding/release-artifact-binding.json
            test -s consumption-tuple.json
            receipt_sha256="$(sha256sum production-break-glass-consumption.json | awk '{print $1}')"
            receipt_size="$(wc -c < production-break-glass-consumption.json | tr -d '[:space:]')"
            if ! [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]] ||
               ! [[ "$receipt_size" =~ ^[1-9][0-9]*$ ]] ||
               ! [[ "$RECEIPT_BINDING_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Final receipt identity is invalid."
              exit 1
            fi
            jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg receipt_sha256 "$receipt_sha256" \
              --argjson receipt_size "$receipt_size" \
              --slurpfile binding receipt-binding/release-artifact-binding.json \
              --slurpfile tuple consumption-tuple.json '
                .evidence_type == "maiprop-release-artifact-binding-verification" and
                .ok == true and .verification_mode == "same-run" and
                .release_sha == $sha and .workflow_sha == $sha and
                (.run_id | tostring) == $run_id and
                (.run_attempt | tostring) == $run_attempt and
                .files == [{
                  path: "production-break-glass-consumption.json",
                  size: $receipt_size,
                  sha256: $receipt_sha256
                }] and
                ($binding | length) == 1 and ($tuple | length) == 1 and
                $binding[0].evidence_type == "maiprop-release-artifact-binding" and
                $binding[0].binding_digest_sha256 == .binding_digest_sha256 and
                $binding[0].files == .files and
                ($binding[0].artifact.id | tostring) == ($tuple[0].artifact_id | tostring) and
                $binding[0].artifact.digest == $tuple[0].artifact_digest and
                (.artifact_id | tostring) == ($tuple[0].artifact_id | tostring) and
                .artifact_digest == $tuple[0].artifact_digest
              ' receipt-binding/verification.json > /dev/null
            jq -e \
              --arg action "$PAGES_ACTION" \
              --arg sha "$RELEASE_SHA" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg binding_artifact_id "$RECEIPT_BINDING_ARTIFACT_ID" \
              --arg receipt_sha256 "$receipt_sha256" \
              --slurpfile receipt production-break-glass-consumption.json '
                .action == $action and .release_sha == $sha and
                (.parent_run_id | tostring) == $run_id and
                (.binding_artifact_id | tostring) == $binding_artifact_id and
                .payload_sha256 == $receipt_sha256 and
                ($receipt | length) == 1 and
                .action == $receipt[0].authorization.action and
                .incident_id == $receipt[0].authorization.incident_id and
                .release_sha == $receipt[0].authorization.release_sha and
                (.parent_run_id | tostring) == ($receipt[0].workflow_run_id | tostring) and
                (keys | sort) == ([
                  "action", "artifact_digest", "artifact_id", "binding_artifact_id",
                  "incident_id", "parent_run_id", "payload_sha256", "release_sha"
                ] | sort)
              ' consumption-tuple.json > /dev/null
            node scripts/production-break-glass-consumption.mjs verify \
              --file production-break-glass-consumption.json \
              --authorization release-authorization.json \
              --action "$PAGES_ACTION"
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$GITHUB_WORKFLOW_SHA" ] ||
             [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::main advanced before the Pages runtime mutation; refusing to continue."
            exit 1
          fi
          curl -fsS \
            --request PATCH \
            -H "Authorization: Bearer $TARGET_EDIT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$PATCH_BODY" \
            "$API_BASE/accounts/$TARGET_ACCOUNT_ID/pages/projects/$TARGET_PROJECT" \
            > "$RAW_DIR/runtime-patch-response.json"
          jq -e \
            --arg id "$TARGET_PROJECT_ID" \
            --arg name "$TARGET_PROJECT" \
            '.success == true and .result.id == $id and .result.name == $name' \
            "$RAW_DIR/runtime-patch-response.json" > /dev/null

          PRODUCTION_POST="$RAW_DIR/production-post.json"
          STAGING_POST="$RAW_DIR/staging-post.json"
          get_project \
            "$CLOUDFLARE_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_ACCOUNT_ID" \
            "$PRODUCTION_PROJECT" \
            "$PRODUCTION_POST"
          get_project \
            "$CLOUDFLARE_STAGING_PAGES_READ_TOKEN" \
            "$CLOUDFLARE_STAGING_ACCOUNT_ID" \
            "$STAGING_PROJECT" \
            "$STAGING_POST"
          node scripts/validate-cloudflare-pages-staging-posture.mjs \
            --mode "$PAGES_TARGET" \
            --staging-project-file "$STAGING_POST" \
            --production-project-file "$PRODUCTION_POST" \
            --out "$EVIDENCE_DIR/cloudflare-pages-runtime-posture.json"
          jq -n \
            --slurpfile authorization release-authorization.json \
            --slurpfile consumption consumption-tuple.json \
            --arg target "$PAGES_TARGET" \
            --arg project_id "$TARGET_PROJECT_ID" \
            --arg release_sha "$RELEASE_SHA" '{
              schema_version: 2,
              evidence_type: "cloudflare-pages-runtime-provision-result",
              target: $target,
              project_id: $project_id,
              release_sha: $release_sha,
              authorization: $authorization[0],
              consumption: $consumption[0],
              status: "verified"
            }' > "$EVIDENCE_DIR/cloudflare-pages-runtime-result.json"

      - name: Upload minimized Cloudflare Pages runtime evidence
        id: pages_evidence_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-pages-runtime-${{ inputs.target }}-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-pages-runtime-evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Create and same-run verify Pages runtime evidence binding
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.pages_evidence_upload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.pages_evidence_upload.outputs.artifact-digest }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.checkout.outputs.source_tree }}
          PAGES_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if ! [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The Pages evidence upload did not return immutable identity."
            exit 1
          fi
          artifact_name="cloudflare-pages-runtime-${PAGES_TARGET}-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p pages-runtime-binding pages-runtime-binding-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > pages-runtime-binding-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > pages-runtime-binding-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root "$RUNNER_TEMP/cloudflare-pages-runtime-evidence" \
            --out pages-runtime-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/provision-cloudflare-pages-runtime.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" --artifact-name "$artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding pages-runtime-binding/release-artifact-binding.json \
            --payload-root "$RUNNER_TEMP/cloudflare-pages-runtime-evidence" \
            --artifact-metadata pages-runtime-binding-metadata/artifact.json \
            --producer-run pages-runtime-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/provision-cloudflare-pages-runtime.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" --artifact-name "$artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > pages-runtime-binding/verification.json

      - name: Upload immutable Pages runtime evidence binding
        id: pages_binding_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-pages-runtime-${{ inputs.target }}-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-binding
          path: pages-runtime-binding/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
