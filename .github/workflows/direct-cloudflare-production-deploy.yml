name: Direct Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character current main SHA with final CI readiness and backend deployment proof"
        required: true
        type: string
      confirm:
        description: "Type RECOVER_CLOUDFLARE_PRODUCTION to validate the backend-proven SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: maiprop-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate recovery deploy
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RECOVER_CLOUDFLARE_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Require canonical main, final readiness, and same-run backend proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ] || [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            echo "::error::Recovery SHA must be the exact checked-out current main SHA."
            exit 1
          fi

          node scripts/production-release-validation.mjs github-recovery \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA"
          if [ "$PRODUCTION_RELEASE_ENABLED" != "true" ]; then
            echo "::error::Production recovery mutations remain disabled. PRODUCTION_RELEASE_ENABLED is not true."
            exit 1
          fi
          echo "::error::Production recovery mutations remain disabled until the coordinated production release blockers are closed."
          exit 1
