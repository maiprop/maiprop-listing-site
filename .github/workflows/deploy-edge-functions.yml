name: Deploy Edge Functions

on:
  workflow_call:
    inputs:
      functions:
        description: Reserved for a future immutable production promotion workflow.
        required: false
        type: string
        default: ""
      confirm_deploy_all:
        description: Reserved; production Edge mutations are disabled.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Reserved; this workflow performs no production inspection or mutation.
        required: false
        type: boolean
        default: true
      release_sha:
        description: Immutable repository commit submitted for validation.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable repository commit submitted for validation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-disabled:
    name: Production Edge deployment disabled
    runs-on: ubuntu-latest
    steps:
      - name: Reject production Edge mutation
        run: |
          echo "::error::Production Edge Function mutations are disabled. A separately reviewed immutable bundle-promotion workflow is required."
          exit 1

  deploy:
    name: Production Edge mutation hard-disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      PRODUCTION_MUTATIONS_DISABLED: "true"
    steps:
      - run: exit 1
