            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "${{ steps.edge_attestation.outputs.artifact_name }}" \
