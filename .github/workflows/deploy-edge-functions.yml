name: Deploy Edge Functions

on:
  # Manual trigger with explicit targeting. This workflow intentionally does
  # not auto-deploy on push; production Supabase changes require an explicit
  # ready-to-proceed action.
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names to deploy"
        required: false
        type: string
      confirm_deploy_all:
        description: "Required when functions is blank; confirms deploying ALL edge functions"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run - list functions without deploying"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.98.1

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or VITE_SUPABASE_PROJECT_ID secrets"
            exit 1
          fi

      - name: Guard production deploy ref
        if: inputs.dry_run != true
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production edge function deploys must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          {
            echo "### Supabase edge function deployment"
            echo "- Ref: ${GITHUB_REF}"
            echo "- SHA: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Determine functions to deploy
        id: target
        env:
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
          CONFIRM_DEPLOY_ALL: ${{ github.event.inputs.confirm_deploy_all }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_FUNCTIONS" ]; then
            if [ "$CONFIRM_DEPLOY_ALL" != "true" ]; then
              echo "::error::Set 'functions' or set 'confirm_deploy_all=true' to target every edge function."
              exit 1
            fi
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=$INPUT_FUNCTIONS" >> "$GITHUB_OUTPUT"
            echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: inputs.dry_run != true
        env:
          TARGET_DEPLOY_ALL: ${{ steps.target.outputs.deploy_all }}
          TARGET_FUNCTIONS: ${{ steps.target.outputs.functions }}
        run: |
          set -euo pipefail
          if [ "$TARGET_DEPLOY_ALL" = "true" ]; then
            echo "Deploying ALL edge functions..."
            supabase functions deploy --project-ref "$PROJECT_REF"
          elif [ -n "$TARGET_FUNCTIONS" ]; then
            for fn in $TARGET_FUNCTIONS; do
              echo "Deploying: $fn"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            done
          else
            echo "No functions to deploy"
          fi

      - name: Dry run - list targets
        if: inputs.dry_run == true
        env:
          TARGET_DEPLOY_ALL: ${{ steps.target.outputs.deploy_all }}
          TARGET_FUNCTIONS: ${{ steps.target.outputs.functions }}
        run: |
          echo "DRY RUN - would deploy:"
          if [ "$TARGET_DEPLOY_ALL" = "true" ]; then
            echo "  ALL functions"
            ls -d supabase/functions/*/ | grep -v _shared | grep -v node_modules | sed 's|supabase/functions/||;s|/||'
          elif [ -n "$TARGET_FUNCTIONS" ]; then
            for fn in $TARGET_FUNCTIONS; do
              echo "  - $fn"
            done
          else
            echo "  (none)"
          fi
