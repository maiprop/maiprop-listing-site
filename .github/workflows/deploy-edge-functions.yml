            production.edge_source_manifest,
          );
          assertEdgeBundleParity(
            staging.edge_bundles,
            production.live_function_inventory?.deployed,
          );
          NODE

      - name: Activate and verify role-switch reconciliation cron
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_REF: qvvicunqcrwpioqnvzxf
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          lease_args=()
          if [ "$AUTHORIZATION_MODE" = "break_glass" ]; then
            lease_args+=(--authorization-file evidence/release-authorization.json --consumption-file evidence/consumption-tuple.json)
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::Release SHA is no longer current main before cron activation."
