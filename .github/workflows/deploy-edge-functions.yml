          fi
          npm run --silent release:validate -- github-staging-lease \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT"
          npm run --silent release:validate -- mutation-lease \
            --file evidence/mutation-lease/production-mutation-lease.json \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-tree "$SOURCE_TREE" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --approval-nonce "$APPROVAL_NONCE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            --approval-run-id "$APPROVAL_RUN_ID" \
            --approval-run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --production-run-id "$PRODUCTION_RUN_ID" \
            --production-run-attempt "$PRODUCTION_RUN_ATTEMPT" \
            --stripe-readiness-run-id "$STRIPE_READINESS_RUN_ID" \
            --stripe-readiness-run-attempt "$STRIPE_READINESS_RUN_ATTEMPT" \
            --stripe-readiness-sha256 "$STRIPE_READINESS_SHA256" \
            --stripe-readiness-artifact-id "$STRIPE_READINESS_ARTIFACT_ID" \
            --stripe-readiness-artifact-digest "$STRIPE_READINESS_ARTIFACT_DIGEST" \
            "${lease_args[@]}"
          npm run --silent release:validate -- supabase-target \
            > production-supabase-cron-target.json
          "$RUNNER_TEMP/verify-production-provider-bindings.sh"
          lease_expires_at="$(jq -er '.expires_at' evidence/mutation-lease/production-mutation-lease.json)"
          lease_expires_epoch_ms="$(date -u --date="$lease_expires_at" +'%s%3N')"
          authorization_expires_epoch_ms=""
          if [ "$AUTHORIZATION_MODE" = "break_glass" ]; then
            authorization_expires_at="$(jq -er '.authorized_expires_at' evidence/release-authorization.json)"
            authorization_expires_epoch_ms="$(date -u --date="$authorization_expires_at" +'%s%3N')"
          fi
          if ! [[ "$lease_expires_epoch_ms" =~ ^[1-9][0-9]{12,}$ ]] ||
             { [ "$AUTHORIZATION_MODE" = "break_glass" ] &&
               ! [[ "$authorization_expires_epoch_ms" =~ ^[1-9][0-9]{12,}$ ]]; }; then
            echo "::error::Production cron mutation deadline is not canonical."
            exit 1
          fi

          raw_state="$(mktemp)"
          provider_boundary_epoch_real="$EPOCHREALTIME"
          if ! [[ "$provider_boundary_epoch_real" =~ ^[1-9][0-9]{9,}\.[0-9]{6}$ ]]; then
            echo "::error::Production cron mutation boundary clock is not canonical."
            exit 1
          fi
          provider_boundary_epoch_us="${provider_boundary_epoch_real/./}"
          if (( 10#$provider_boundary_epoch_us >= 10#$lease_expires_epoch_ms * 1000 )) ||
             { [ "$AUTHORIZATION_MODE" = "break_glass" ] &&
               (( 10#$provider_boundary_epoch_us >= 10#$authorization_expires_epoch_ms * 1000 )); }; then
            echo "::error::Production cron mutation authorization expired before activation."
            exit 1
          fi
          psql "$SUPABASE_PRODUCTION_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --file release-candidate/supabase/reconciliation/activate-role-switch-billing-cron.sql \
            | sed '/^[[:space:]]*$/d' > "$raw_state"
          if [ "$(wc -l < "$raw_state" | tr -d '[:space:]')" != "1" ]; then
            echo "::error::Role-switch cron activation must return exactly one evidence object."
            exit 1
          fi
          jq -e '
            .schema_version == 1 and
            .evidence_type == "maiprop-role-switch-cron-activation" and
            .job_name == "reconcile-role-switch-billing" and
            .schedule == "*/5 * * * *" and
            .command == "SELECT private.invoke_role_switch_billing_reconciliation();" and
            .active == true
          ' "$raw_state" > /dev/null
          jq -cS . "$raw_state" > production-role-switch-cron-state.json

      - name: Create production Edge attestation
        id: edge_attestation
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const digest = (path) =>
            createHash("sha256").update(readFileSync(path)).digest("hex");
          const live = JSON.parse(readFileSync(
            "release-safety-production-live-functions.json",
            "utf8",
          ));
          const staging = JSON.parse(readFileSync(
            "evidence/staging-supabase/supabase-staging-edge-attestation.json",
            "utf8",
          ));
          const manifest = JSON.parse(readFileSync(
            "release-candidate/release-manifest.json",
            "utf8",
          ));
          const database = JSON.parse(readFileSync(
            "evidence/production-database/production-supabase-db-attestation.json",
            "utf8",
          ));
          const roleSwitchCron = JSON.parse(readFileSync(
            "production-role-switch-cron-state.json",
            "utf8",
          ));
          if (
            staging.supabase_sha256 !== manifest.supabase_sha256 ||
            database.supabase_sha256 !== manifest.supabase_sha256
          ) {
            throw new Error(
              "Production Edge attestations do not share the signed Supabase source digest.",
            );
          }
          const edgeBundles = live.live_function_inventory.deployed
            .map(({ name, ezbr_sha256, verify_jwt }) => ({
              name,
              ezbr_sha256,
              verify_jwt,
            }))
            .sort((left, right) => left.name.localeCompare(right.name));
          const attestation = {
            schema_version: 1,
            evidence_type: "maiprop-production-edge-promotion",
            authorization_mode: process.env.AUTHORIZATION_MODE,
            authorization_sha256: process.env.AUTHORIZATION_SHA256,
            consumption_sha256: process.env.AUTHORIZATION_MODE === "break_glass"
              ? process.env.CONSUMPTION_PAYLOAD_SHA256
              : null,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            approval_run_id: process.env.APPROVAL_RUN_ID,
            approval_run_attempt: process.env.APPROVAL_RUN_ATTEMPT,
            production_run_id: process.env.PRODUCTION_RUN_ID,
            production_run_attempt: process.env.PRODUCTION_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            manifest_sha256: process.env.MANIFEST_SHA256,
            supabase_sha256: manifest.supabase_sha256,
            project_ref: "qvvicunqcrwpioqnvzxf",
            staging_edge_sha256: digest(
              "evidence/staging-supabase/supabase-staging-edge-attestation.json",
            ),
            production_database_sha256:
              process.env.DATABASE_ATTESTATION_SHA256,
            pre_inventory_sha256: digest(
              "release-safety-production-live-functions-before.json",
            ),
            forward_plan_sha256: digest(
              "production-edge-forward-plan.json",
            ),
            deploy_progress_sha256: digest(
              "production-edge-deploy-progress.jsonl",
            ),
            live_inventory_sha256: digest(
              "release-safety-production-live-functions.json",
            ),
            staged_source_manifest_sha256:
              staging.edge_source_manifest.manifest_sha256,
            production_source_manifest_sha256:
              live.edge_source_manifest.manifest_sha256,
            role_switch_cron_sha256: digest(
              "production-role-switch-cron-state.json",
            ),
            role_switch_cron: roleSwitchCron,
            edge_bundles: edgeBundles,
            promoted_at: new Date().toISOString(),
          };
          writeFileSync(
            "production-supabase-edge-attestation.json",
            `${JSON.stringify(attestation, null, 2)}\n`,
          );
          NODE
          artifact_name="production-supabase-edge-attestation-${RELEASE_SHA}-${PRODUCTION_RUN_ID}-${PRODUCTION_RUN_ATTEMPT}"
          attestation_sha256="$(sha256sum production-supabase-edge-attestation.json | awk '{print $1}')"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "attestation_sha256=$attestation_sha256" >> "$GITHUB_OUTPUT"
          payload_root="production-edge-evidence-payload"
          mkdir -p "$payload_root"
          for pattern in \
            production-supabase-edge-attestation.json \
            production-supabase-edge-target.json \
            production-supabase-edge-target-pre-deploy.json \
            'production-supabase-edge-target-*.json' \
            production-candidate-release-safety.json \
            production-candidate-release-safety-mutation-boundary.json \
            release-safety-production-live-functions-before.json \
            release-safety-production-live-functions.json \
            production-edge-forward-plan.json \
            production-edge-deploy-progress.jsonl; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                cp -- "$file" "$payload_root/$(basename "$file")"
              fi
            done
          done
          cp -- production-role-switch-cron-state.json "$payload_root/production-role-switch-cron-state.json"
          cp -- production-supabase-cron-target.json "$payload_root/production-supabase-cron-target.json"

