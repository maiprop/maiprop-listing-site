      - name: Upload signed production Edge evidence binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.edge_binding.outputs.binding_artifact_name }}
          path: production-edge-evidence-binding/
          if-no-files-found: error
          retention-days: 30

      - name: Create production Edge terminal evidence
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, statSync, writeFileSync } from "node:fs";

          const record = (path) => {
            if (!existsSync(path)) return { path, present: false };
            try {
              const bytes = readFileSync(path);
              return {
                path,
                present: true,
                size: statSync(path).size,
                sha256: createHash("sha256").update(bytes).digest("hex"),
              };
            } catch (error) {
              return {
                path,
                present: true,
                read_error: error instanceof Error ? error.message : String(error),
              };
            }
          };
          const readJsonIfValid = (path) => {
            if (!existsSync(path)) return { value: {}, error: null };
            try {
              return {
                value: JSON.parse(readFileSync(path, "utf8")),
                error: null,
              };
            } catch (error) {
              return {
                value: {},
                error: error instanceof Error ? error.message : String(error),
              };
            }
          };
          const manifestPath = "release-candidate/release-manifest.json";
          const manifestResult = readJsonIfValid(manifestPath);
          const manifest = manifestResult.value;
          const jobStatus = process.env.JOB_STATUS || "unknown";
          const evidence = {
            schema_version: 1,
            evidence_type: "maiprop-production-edge-terminal",
            job_status: jobStatus,
            repository: process.env.GITHUB_REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            production_run_id: process.env.PRODUCTION_RUN_ID,
            production_run_attempt: process.env.PRODUCTION_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            manifest_sha256: process.env.MANIFEST_SHA256,
            supabase_sha256: manifest.supabase_sha256 ?? null,
            manifest_parse_error: manifestResult.error,
            target_project_ref: "qvvicunqcrwpioqnvzxf",
            phase_evidence: [
              record("production-supabase-edge-target.json"),
              record("production-supabase-edge-target-pre-deploy.json"),
              record("release-safety-production-live-functions-before.json"),
              record("production-edge-forward-plan.json"),
              record("production-edge-deploy-progress.jsonl"),
              record("production-role-switch-cron-state.json"),
              record("production-supabase-cron-target.json"),
              record("release-safety-production-live-functions.json"),
              record("production-candidate-release-safety.json"),
              record("production-candidate-release-safety-mutation-boundary.json"),
              record("production-supabase-edge-attestation.json"),
            ],
            recovery: jobStatus === "success" ? null : {
              strategy: "serial-forward-convergence",
              instruction:
                "Rerun this exact release. Live inventory is compared to staging and only missing or digest/JWT-mismatched functions are redeployed in deterministic name order; functions are never deleted automatically.",
            },
            captured_at: new Date().toISOString(),
          };
          writeFileSync(
            "production-supabase-edge-terminal-evidence.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
          terminal_root="production-edge-terminal-evidence-payload"
          mkdir -p "$terminal_root"
          for pattern in \
            production-supabase-edge-terminal-evidence.json \
            'production-supabase-edge-target*.json' \
            'production-candidate-release-safety*.json' \
            'release-safety-production-live-functions*.json' \
            production-edge-forward-plan.json \
            production-edge-deploy-progress.jsonl \
            production-supabase-edge-attestation.json; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                cp -- "$file" "$terminal_root/$(basename "$file")"
              fi
            done
          done

      - name: Upload production Edge terminal evidence
        id: edge_terminal_payload_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-supabase-edge-terminal-${{ inputs.release_sha }}-${{ inputs.production_run_id }}-${{ inputs.production_run_attempt }}
          path: production-edge-terminal-evidence-payload/
          if-no-files-found: error
          retention-days: 30

      - name: Create signed production Edge terminal binding
        id: edge_terminal_binding
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.edge_terminal_payload_upload.outputs.artifact-digest }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.edge_terminal_payload_upload.outputs.artifact-id }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          payload_root="production-edge-terminal-evidence-payload"
          binding_root="production-edge-terminal-evidence-binding"
          payload_artifact_name="production-supabase-edge-terminal-${RELEASE_SHA}-${PRODUCTION_RUN_ID}-${PRODUCTION_RUN_ATTEMPT}"
          binding_artifact_name="${payload_artifact_name}-binding"
          mkdir -p "$binding_root" production-edge-terminal-evidence-metadata
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}" \
            > production-edge-terminal-evidence-metadata/artifact.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > production-edge-terminal-evidence-metadata/run.json
          node scripts/create-release-artifact-binding.mjs \
            --payload-root "$payload_root" \
            --file-root "$payload_root" \
            --file production-supabase-edge-terminal-evidence.json \
            --out "$binding_root/release-artifact-binding.json" \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path "$PRODUCTION_CALLER_WORKFLOW_PATH" \
            --workflow-ref "$GITHUB_REPOSITORY/$PRODUCTION_CALLER_WORKFLOW_PATH@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-name "$payload_artifact_name" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          echo "binding_artifact_name=$binding_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed production Edge terminal binding
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.edge_terminal_binding.outputs.binding_artifact_name }}
          path: production-edge-terminal-evidence-binding/
          if-no-files-found: error
          retention-days: 30
