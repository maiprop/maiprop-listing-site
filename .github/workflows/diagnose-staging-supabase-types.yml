name: Diagnose Staging Supabase Types

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-staging-supabase-types.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Generate staging schema types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: >-
          npx --no-install supabase gen types
          --lang=typescript
          --project-id "$STAGING_SUPABASE_PROJECT_ID"
          --schema public
          > staging-supabase-types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: staging-supabase-types
          path: staging-supabase-types.ts
          if-no-files-found: error
          retention-days: 1
