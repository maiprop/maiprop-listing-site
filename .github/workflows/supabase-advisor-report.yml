name: Supabase Advisor Report

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-advisor-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-main:
    name: Verify trusted main provenance
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.verify.outputs.main_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind run to the current main workflow SHA
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Supabase advisor reports may run only from refs/heads/main."
            exit 1
          fi

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_WORKFLOW_SHA" != "$main_sha" ]; then
            echo "::error::Workflow SHA $GITHUB_WORKFLOW_SHA is not current main $main_sha."
            exit 1
          fi

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

  advisor-report:
    name: Capture Supabase advisor warnings
    runs-on: ubuntu-latest
    needs: verify-current-main

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-current-main.outputs.main_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check runtime
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Capture Supabase evidence from current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-current-main.outputs.main_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          assert_current_main() {
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$current_main" != "$RELEASE_SHA" ]; then
              echo "::error::Current main advanced from $RELEASE_SHA to $current_main; refusing stale credentialed execution."
              exit 1
            fi
          }

          assert_current_main
          npm run capture:supabase-index-stats -- --out supabase-index-stats.json --allow-empty-when-unconfigured

          assert_current_main
          npm run check:supabase-advisor -- --fail-on-error --fail-on-unknown --index-stats supabase-index-stats.json --out supabase-advisor-report.json

      - name: Summarize advisory debt
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "supabase-advisor-report.json";
          if (!fs.existsSync(path)) {
            console.log("No advisor report was produced.");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          const lines = [
            "## Supabase Advisor Report",
            "",
            `Generated: ${report.generated_at}`,
            `Failing lint count: ${report.failing_lint_count}`,
            "",
            "| Level | Count |",
            "|---|---:|",
            ...Object.entries(report.totals?.by_level ?? {}).map(([level, count]) => `| ${level} | ${count} |`),
            "",
            "| Category | Lints |",
            "|---|---:|",
            ...(report.results ?? []).map((result) => `| ${result.category} | ${result.lint_count} |`),
            "",
            "### Advisor Debt",
            "",
            "| Status | Count |",
            "|---|---:|",
            `| Accepted | ${report.advisor_debt?.accepted_count ?? 0} |`,
            `| Needs review | ${report.advisor_debt?.review_count ?? 0} |`,
            `| Unknown | ${report.advisor_debt?.unknown_count ?? 0} |`,
            "",
            "### Unused Index Review",
            "",
            "| Status | Count |",
            "|---|---:|",
            `| Advisor lints | ${report.unused_index_review?.totals?.unused_index_lints ?? 0} |`,
            `| Mapped to pg_stat_user_indexes | ${report.unused_index_review?.totals?.mapped_to_stats ?? 0} |`,
            `| With scans | ${report.unused_index_review?.totals?.with_scans ?? 0} |`,
            `| Zero-scan candidates needing extra review | ${report.unused_index_review?.totals?.zero_scan_candidates ?? 0} |`,
            `| Managed-schema indexes, do not drop from advisor alone | ${report.unused_index_review?.totals?.managed_schema_indexes ?? 0} |`,
            `| Protected constraint/unique indexes, do not drop | ${report.unused_index_review?.totals?.protected_indexes ?? 0} |`,
            `| Public write-path candidates needing query-plan review | ${report.unused_index_review?.totals?.write_path_candidates ?? 0} |`,
            `| Needs stats snapshot | ${report.unused_index_review?.totals?.needs_stats_snapshot ?? 0} |`,
            `| Needs manual mapping | ${report.unused_index_review?.totals?.needs_manual_mapping ?? 0} |`,
            "",
            "Accepted items require an owner and review cadence in scripts/supabase-advisor-debt-policy.json.",
            "Unused-index candidates must be matched to production pg_stat_user_indexes and reviewed with pg_stat_statements before any DROP INDEX migration.",
            "Unknown WARN items should be classified or fixed in the next advisor cleanup pass. Keep ERROR/CRITICAL/HIGH at zero.",
            "",
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          NODE

      - name: Upload advisor report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisor-report
          path: |
            supabase-advisor-report.json
            supabase-index-stats.json
          if-no-files-found: ignore
          retention-days: 90
