name: Approve Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character current main SHA with successful CI and signed staging evidence"
        required: true
        type: string
      confirm:
        description: "Type APPROVE_PRODUCTION_RELEASE or the exact production-approval break-glass confirmation"
        required: true
        type: string
      single_admin_break_glass:
        description: "Use the exact configured single-admin break-glass authorization"
        required: true
        default: false
        type: boolean
      incident_id:
        description: "Configured break-glass incident ID; empty in standard mode"
        required: false
        type: string
      reason:
        description: "Single-line break-glass reason; empty in standard mode and never persisted"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maiprop-production-approval-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  approve:
    name: Production release approved
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.triggering_actor
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify trusted exact current-main control identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ] ||
             [ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ] ||
             [ "$RELEASE_SHA" != "$GITHUB_SHA" ] ||
             [ "$RELEASE_SHA" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "::error::Production approval control identity is not trusted."
            exit 1
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::error::Production approval must target the exact current main SHA."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean checkout identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$actual_sha" != "$RELEASE_SHA" ] ||
             ! [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]] ||
             [ -n "$dirty" ]; then
            echo "::error::Production approval checkout identity is not exact and clean."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Validate production approval authorization
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTHORIZATION_ACTION: production-approval
          RELEASE_STANDARD_CONFIRMATION: APPROVE_PRODUCTION_RELEASE
          RELEASE_SINGLE_ADMIN_BREAK_GLASS: ${{ inputs.single_admin_break_glass }}
          RELEASE_INCIDENT_ID: ${{ inputs.incident_id }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_RELEASE_DEPLOYERS: ${{ vars.PRODUCTION_RELEASE_DEPLOYERS }}
          PRODUCTION_BREAK_GLASS_ACTOR: ${{ vars.PRODUCTION_BREAK_GLASS_ACTOR }}
          PRODUCTION_BREAK_GLASS_RELEASE_SHA: ${{ vars.PRODUCTION_BREAK_GLASS_RELEASE_SHA }}
          PRODUCTION_BREAK_GLASS_INCIDENT_ID: ${{ vars.PRODUCTION_BREAK_GLASS_INCIDENT_ID }}
          PRODUCTION_BREAK_GLASS_EXPIRES_AT: ${{ vars.PRODUCTION_BREAK_GLASS_EXPIRES_AT }}
        run: |
          set -euo pipefail
          export RELEASE_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export RELEASE_CURRENT_MAIN_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha'
          )"
          node scripts/production-break-glass-validation.mjs validate-workflow \
            --out release-authorization.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Require standard production approver allowlist
        if: ${{ steps.authorization.outputs.mode == 'standard' }}
        env:
          APPROVER: ${{ github.actor }}
          PRODUCTION_RELEASE_APPROVERS: ${{ vars.PRODUCTION_RELEASE_APPROVERS }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const actor = String(process.env.APPROVER ?? "").trim().toLowerCase();
          const allowlist = String(process.env.PRODUCTION_RELEASE_APPROVERS ?? "")
            .split(/[\s,]+/)
            .map((value) => value.trim().toLowerCase())
            .filter(Boolean);
          if (!/^[a-z0-9-]+$/.test(actor)) {
            throw new Error("The approval actor is invalid.");
          }
          if (allowlist.length === 0 || allowlist.some((value) => !/^[a-z0-9-]+$/.test(value))) {
            throw new Error("PRODUCTION_RELEASE_APPROVERS must contain valid GitHub logins.");
          }
          if (!new Set(allowlist).has(actor)) {
            throw new Error("The approval actor is not allowlisted for production releases.");
          }
          NODE

      - name: Verify exact current-main release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          AUTHORIZATION_MODE: ${{ steps.authorization.outputs.mode }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a full lowercase 40-character Git SHA."
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected release SHA $RELEASE_SHA."
            exit 1
          fi

          CURRENT_MAIN="$(
            gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha'
          )"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            echo "::error::Release SHA $RELEASE_SHA is no longer current main ($CURRENT_MAIN)."
            exit 1
          fi

          node scripts/production-release-validation.mjs github-release-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            > release-proof-selection.json

          SOURCE_RUN_ID="$(jq -r '.readiness_run_id' release-proof-selection.json)"
          SOURCE_RUN_ATTEMPT="$(jq -r '.readiness_run_attempt' release-proof-selection.json)"
          STAGING_RUN_ID="$(jq -r '.staging_run_id' release-proof-selection.json)"
          STAGING_RUN_ATTEMPT="$(jq -r '.staging_run_attempt' release-proof-selection.json)"
          SOURCE_TREE="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             [ "$SOURCE_RUN_ATTEMPT" != "1" ] ||
             ! [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             [ "$STAGING_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Selected source or staging run identity is invalid."
            exit 1
          fi

          mkdir -p staging-evidence staging-binding staging-binding-metadata
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID/artifacts?per_page=100" \
            > staging-binding-metadata/artifacts.json
          binding_name="release-candidate-attestation-${RELEASE_SHA}-${STAGING_RUN_ATTEMPT}-binding"
          mapfile -t binding_ids < <(
            jq -r --arg name "$binding_name" \
              '.artifacts[] | select(.expired == false and .name == $name) | .id' \
              staging-binding-metadata/artifacts.json
          )
          if [ "${#binding_ids[@]}" -ne 1 ]; then
            echo "::error::Approval requires exactly one unexpired staging binding artifact."
            exit 1
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/${binding_ids[0]}/zip" \
            > staging-binding.zip
          unzip -q staging-binding.zip -d staging-binding
          rm staging-binding.zip
          staging_artifact_id="$(jq -er '.artifact.id' staging-binding/release-artifact-binding.json)"
          if ! [[ "$staging_artifact_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The staging binding does not identify a valid payload artifact."
            exit 1
          fi
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$staging_artifact_id" \
            > staging-binding-metadata/artifact.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" \
            > staging-binding-metadata/run.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > staging-binding-metadata/source-run.json
          jq -e '
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 1 and
            .actor.login == .triggering_actor.login
          ' staging-binding-metadata/source-run.json > /dev/null
          staging_actor="$(jq -er '.actor.login' staging-binding-metadata/run.json)"
          staging_triggering_actor="$(jq -er '.triggering_actor.login' staging-binding-metadata/run.json)"
          source_actor="$(jq -er '.actor.login' staging-binding-metadata/source-run.json)"
          approver="$(printf '%s' "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]')"
          if [ "$AUTHORIZATION_MODE" = "standard" ] && {
             [ "$approver" = "$(printf '%s' "$staging_actor" | tr '[:upper:]' '[:lower:]')" ] ||
             [ "$approver" = "$(printf '%s' "$source_actor" | tr '[:upper:]' '[:lower:]')" ];
          }; then
            echo "::error::The allowlisted approver must be independent from CI and staging producers."
            exit 1
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$staging_artifact_id/zip" \
            > staging-evidence.zip
          unzip -q staging-evidence.zip -d staging-evidence
          rm staging-evidence.zip
          node scripts/verify-release-artifact-binding.mjs \
            --binding staging-binding/release-artifact-binding.json \
            --payload-root staging-evidence/release-candidate-attestation.json \
            --artifact-metadata staging-binding-metadata/artifact.json \
            --producer-run staging-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/stage-release.yml \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/stage-release.yml@refs/heads/main" \
            --workflow-sha "$RELEASE_SHA" \
            --event workflow_run \
            --run-id "$STAGING_RUN_ID" \
            --run-attempt "$STAGING_RUN_ATTEMPT" \
            --actor "$staging_actor" \
            --triggering-actor "$staging_triggering_actor" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            > staging-evidence/cryptographic-verification.json
          jq -e '.ok == true and .verification_mode == "prior-run"' \
            staging-evidence/cryptographic-verification.json > /dev/null

          node scripts/production-release-validation.mjs release-candidate-attestation \
            --file staging-evidence/release-candidate-attestation.json \
            --sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-run-id "$STAGING_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT" \
            > staging-evidence/content-verification.json

          ARTIFACT_SHA256="$(
            jq -r '.artifact_sha256' staging-evidence/content-verification.json
          )"
          if ! [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Signed staging evidence has an invalid artifact digest."
            exit 1
          fi
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "staging_run_attempt=$STAGING_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Create short-lived exact-SHA approval
        env:
          APPROVAL_RUN_ID: ${{ github.run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          APPROVER: ${{ github.actor }}
          ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_TREE: ${{ steps.evidence.outputs.source_tree }}
          SOURCE_RUN_ID: ${{ steps.evidence.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.evidence.outputs.source_run_attempt }}
          STAGING_RUN_ID: ${{ steps.evidence.outputs.staging_run_id }}
          STAGING_RUN_ATTEMPT: ${{ steps.evidence.outputs.staging_run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const approvedAt = new Date();
          const authorization = JSON.parse(
            readFileSync("release-authorization.json", "utf8"),
          );
          const approvalExpiry = approvedAt.getTime() + 2 * 60 * 60 * 1000;
          const authorizationExpiry = authorization.mode === "break_glass"
            ? Date.parse(authorization.authorized_expires_at)
            : approvalExpiry;
          const expiresAt = new Date(Math.min(approvalExpiry, authorizationExpiry));
          const approval = {
            schema_version: 2,
            repository: process.env.REPOSITORY,
            release_sha: process.env.RELEASE_SHA,
            source_tree: process.env.SOURCE_TREE,
            source_run_id: process.env.SOURCE_RUN_ID,
            source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
            artifact_sha256: process.env.ARTIFACT_SHA256,
            staging_run_id: process.env.STAGING_RUN_ID,
            staging_run_attempt: process.env.STAGING_RUN_ATTEMPT,
            approval_run_id: process.env.APPROVAL_RUN_ID,
            approval_run_attempt: process.env.APPROVAL_RUN_ATTEMPT,
            approver: process.env.APPROVER,
            nonce: randomBytes(32).toString("hex"),
            revoked: false,
            approved_at: approvedAt.toISOString(),
            expires_at: expiresAt.toISOString(),
            authorization,
          };
          writeFileSync(
            "production-release-approval.json",
            `${JSON.stringify(approval, null, 2)}\n`,
          );
          NODE

      - name: Upload production release approval
        id: approval_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-approval-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-release-approval.json
          if-no-files-found: error
          retention-days: 7

      - name: Create and verify production approval binding
        env:
          APPROVAL_ARTIFACT_DIGEST: ${{ steps.approval_upload.outputs.artifact-digest }}
          APPROVAL_ARTIFACT_ID: ${{ steps.approval_upload.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_SIGNING_KEY: ${{ secrets.RELEASE_EVIDENCE_SIGNING_KEY }}
          RELEASE_EVIDENCE_SIGNING_KEY_ID: ${{ vars.RELEASE_EVIDENCE_SIGNING_KEY_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_TREE: ${{ steps.evidence.outputs.source_tree }}
        run: |
          set -euo pipefail
          if ! [[ "$APPROVAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The approval upload did not return an immutable artifact ID."
            exit 1
          fi
          mkdir -p approval-binding approval-binding-metadata
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVAL_ARTIFACT_ID" \
            > approval-binding-metadata/artifact.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > approval-binding-metadata/run.json
          artifact_name="production-release-approval-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/create-release-artifact-binding.mjs \
            --payload-root production-release-approval.json \
            --out approval-binding/release-artifact-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/approve-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --artifact-id "$APPROVAL_ARTIFACT_ID" \
            --artifact-name "$artifact_name" \
            --artifact-digest "$APPROVAL_ARTIFACT_DIGEST" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID"
          node scripts/verify-release-artifact-binding.mjs \
            --binding approval-binding/release-artifact-binding.json \
            --payload-root production-release-approval.json \
            --artifact-metadata approval-binding-metadata/artifact.json \
            --producer-run approval-binding-metadata/run.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --workflow-path .github/workflows/approve-production-release.yml \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --key-id "$RELEASE_EVIDENCE_SIGNING_KEY_ID" \
            --same-run \
            --trusted-current-run-id "$GITHUB_RUN_ID" \
            --trusted-current-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-current-actor "$GITHUB_ACTOR" \
            --trusted-current-triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            > approval-binding/verification.json

      - name: Upload production release approval binding
        id: approval_binding_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-approval-binding-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: approval-binding/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize approval
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ steps.evidence.outputs.staging_run_id }}
        run: |
          {
            echo "### Production release approval"
            echo "- Exact SHA: $RELEASE_SHA"
            echo "- Signed staging run: $STAGING_RUN_ID"
            echo "- Approval run: $GITHUB_RUN_ID"
            echo "- Signed approval binding artifact ID: ${{ steps.approval_binding_upload.outputs.artifact-id }}"
            echo "- Expires no more than two hours after approval"
            echo "- Production mutations remain disabled"
          } >> "$GITHUB_STEP_SUMMARY"
