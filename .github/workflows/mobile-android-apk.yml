name: Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mobile-android-app
    paths:
      - ".github/workflows/mobile-android-apk.yml"
      - "mobile/**"
      - "agent-worker/**"
      - "package.json"
      - "README.md"

concurrency:
  group: mobile-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build downloadable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maiprop-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
