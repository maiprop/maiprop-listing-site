version = 1

exclude_patterns = [
  "*.config.*",
  ".eslintrc.cjs",
  "src/**",
  "e2e/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "functions/**",
  "supabase/functions/**",
  "scripts/**",
  "remotion-video/**"
]

test_patterns = [
  "src/test/**",
  "e2e/**",
  "**/*.test.ts",
  "**/*.test.tsx"
]

[[analyzers]]
name = "javascript"
enabled = false

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "nodejs", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "python"
enabled = true

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "sql"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
