version = 1

exclude_patterns = [
  "src/pages/Dashboard.tsx",
  "src/components/Navbar.tsx",
  "src/components/property/PropertyReportCard.tsx",
  "src/test/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "supabase/functions/fetch-os-auctions/index.ts",
  "supabase/functions/_shared/testUtils.ts",
  "scripts/*.cjs",
  "scripts/**"
]

test_patterns = [
  "src/test/**",
  "**/*.test.ts",
  "**/*.test.tsx"
]

[[analyzers]]
name = "javascript"
enabled = false

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "nodejs", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "python"
enabled = true

[[analyzers]]
name = "rust"
enabled = true

[[analyzers]]
name = "sql"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
