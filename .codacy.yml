---
# This project uses ESLint 9 flat config (eslint.config.js) — real linting is
# enforced via GitHub Actions. Codacy's bundled ESLint uses eslint-plugin-solid
# (SolidJS rules) which produce 100% false positives on this React 18 codebase.
# Excluding src/** globally prevents all such false positives from every engine.
exclude_paths:
  - "src/**"
  - "e2e/**"
  - "scripts/**"
  - "supabase/migrations/**"
  - "supabase/functions/**"
  - "supabase/migrations/20260707000000_fix_linked_lint_failures.sql"
engines:
  # JSHint does not understand ES2015+ modules/destructuring/arrow functions.
  jshint:
    enabled: false
  # Disabling Codacy's bundled ESLint as a belt-and-suspenders measure.
  # Even with exclude_paths above, keeping this off avoids any overlap.
  eslint:
    enabled: false
  metric:
    exclude_paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
